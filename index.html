          else if (spec.border === 'top') borderId = this.#intern(this.borders, '<border><left/><right/><top style="medium"><color rgb="FF1F3A5F"/></top><bottom/><diagonal/></border>');
          else if (spec.border === 'bottom') borderId = this.#intern(this.borders, `<border><left/><right/><top/><bottom style="thin">${grey}</bottom><diagonal/></border>`);
          const align = spec.wrap || spec.h || spec.v ? `<alignment${spec.h ? ` horizontal="${spec.h}"` : ''}${spec.v ? ` vertical="${spec.v}"` : ''}${spec.wrap ? ' wrapText="1"' : ''}/>` : '';
          const xf = `<xf numFmtId="${numFmtId}" fontId="${fontId}" fillId="${fillId}" borderId="${borderId}" xfId="0"${numFmtId ? ' applyNumberFormat="1"' : ''}${fontId ? ' applyFont="1"' : ''}${fillId ? ' applyFill="1"' : ''}${borderId ? ' applyBorder="1"' : ''}${align ? ` applyAlignment="1">${align}</xf>` : '/>'}`;
          this.xfs.push(xf);
          const idx = this.xfs.length - 1;
          this.keys.set(key, idx);
          return idx;
        }

        xml() {
          const fmts = [...this.numFmts.entries()].map(([code, id]) => `<numFmt numFmtId="${id}" formatCode="${xmlEsc(code)}"/>`).join('');
          return (
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
            (fmts ? `<numFmts count="${this.numFmts.size}">${fmts}</numFmts>` : '') +
            `<fonts count="${this.fonts.length}">${this.fonts.join('')}</fonts>` +
            `<fills count="${this.fills.length}">${this.fills.join('')}</fills>` +
            `<borders count="${this.borders.length}">${this.borders.join('')}</borders>` +
            '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
            `<cellXfs count="${this.xfs.length}">${this.xfs.join('')}</cellXfs>` +
            '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
            '</styleSheet>'
          );
        }
      }

      const S = (v, s = 0) => ({ t: 's', v, s });
      const N = (v, s = 0) => (Number.isFinite(v) ? { t: 'n', v, s } : { t: 'blank', s });
      const F = (f, cached, s = 0) => ({ t: 'f', f, v: Number.isFinite(cached) ? cached : null, s });
      const BLANK = (s = 0) => ({ t: 'blank', s });

      function cellXml(ref, c) {
        if (!c) return '';
        const st = c.s ? ` s="${c.s}"` : '';
        switch (c.t) {
          case 'blank':
            return c.s ? `<c r="${ref}"${st}/>` : '';
          case 'n':
            return `<c r="${ref}"${st}><v>${c.v}</v></c>`;
          case 'f':
            return `<c r="${ref}"${st}><f>${xmlEsc(c.f)}</f>${c.v === null ? '' : `<v>${c.v}</v>`}</c>`;
          default: {
            let text = String(c.v ?? '');
            if (text === '') return c.s ? `<c r="${ref}"${st}/>` : '';
            if (text.length > MAX_CELL_TEXT) text = text.slice(0, MAX_CELL_TEXT);
            return `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(text)}</t></is></c>`;
          }
        }
      }

      function sheetXml(sheet) {
        const rowsXml = [];
        let maxCol = 0;
        sheet.rows.forEach((row, r) => {
          if (!row) return;
          let cells = '';
          row.forEach((c, k) => {
            const x = cellXml(`${colLetter(k)}${r + 1}`, c);
            if (x) {
              cells += x;
              maxCol = Math.max(maxCol, k + 1);
            }
          });
          if (cells) rowsXml.push(`<row r="${r + 1}"${sheet.heights?.[r] ? ` ht="${sheet.heights[r]}" customHeight="1"` : ''}>${cells}</row>`);
        });
        const lastRow = Math.max(1, sheet.rows.length);
        const dim = `A1:${colLetter(Math.max(0, maxCol - 1))}${lastRow}`;
        const pane = sheet.freezeRows
          ? `<pane ySplit="${sheet.freezeRows}" topLeftCell="A${sheet.freezeRows + 1}" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A${sheet.freezeRows + 1}" sqref="A${sheet.freezeRows + 1}"/>`
          : '';
        const cols = sheet.widths?.length ? `<cols>${sheet.widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w.toFixed(2)}" customWidth="1"/>`).join('')}</cols>` : '';
        const filter = sheet.filter ? `<autoFilter ref="A1:${colLetter(sheet.filter.cols - 1)}${sheet.filter.rows}"/>` : '';
        return (
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
          (sheet.tab ? `<sheetPr><tabColor rgb="FF${sheet.tab}"/></sheetPr>` : '') +
          `<dimension ref="${dim}"/>` +
          `<sheetViews><sheetView workbookViewId="0"${sheet.gridLines === false ? ' showGridLines="0"' : ''}>${pane}</sheetView></sheetViews>` +
          '<sheetFormatPr defaultRowHeight="15"/>' +
          cols +
          `<sheetData>${rowsXml.join('')}</sheetData>` +
          filter +
          (sheet.merges?.length ? `<mergeCells count="${sheet.merges.length}">${sheet.merges.map((r) => `<mergeCell ref="${r}"/>`).join('')}</mergeCells>` : '') +
          (sheet.charts?.length ? `<drawing r:id="rId1"/>` : '') +
          (sheet.tables?.length ? `<tableParts count="${sheet.tables.length}">${sheet.tables.map((t, i) => `<tablePart r:id="rId${(sheet.charts?.length ? 2 : 1) + i}"/>`).join('')}</tableParts>` : '') +
          '</worksheet>'
        );
      }

      const safeSheetName = (name, used) => {
        let base = String(name).replace(/[[\]:*?/\\]/g, ' ').trim().slice(0, 31) || 'Sheet';
        let n = base;
        let k = 2;
        while (used.has(n.toLowerCase())) n = `${base.slice(0, 28)} ${k++}`;
        used.add(n.toLowerCase());
        return n;
      };

      const chartTextXml = (value, size = 1400, bold = false) =>
        `<c:tx><c:rich><a:bodyPr/><a:lstStyle/><a:p><a:pPr><a:defRPr lang="en-US" sz="${size}"${bold ? ' b="1"' : ''}/></a:pPr><a:r><a:rPr lang="en-US" sz="${size}"${bold ? ' b="1"' : ''}/><a:t>${xmlEsc(value)}</a:t></a:r><a:endParaRPr lang="en-US"/></a:p></c:rich></c:tx>`;

      const chartTitleXml = (value, size = 1400) => value
        ? `<c:title>${chartTextXml(value, size, true)}<c:overlay val="0"/></c:title>`
        : '';

      const chartStringRef = (formula, values) =>
        `<c:strRef><c:f>${xmlEsc(formula)}</c:f><c:strCache><c:ptCount val="${values.length}"/>${values.map((v, i) => `<c:pt idx="${i}"><c:v>${xmlEsc(v)}</c:v></c:pt>`).join('')}</c:strCache></c:strRef>`;

      const chartNumberRef = (formula, values, fmt = 'General') =>
        `<c:numRef><c:f>${xmlEsc(formula)}</c:f><c:numCache><c:formatCode>${xmlEsc(fmt)}</c:formatCode><c:ptCount val="${values.length}"/>${values.map((v, i) => `<c:pt idx="${i}"><c:v>${Number(v) || 0}</c:v></c:pt>`).join('')}</c:numCache></c:numRef>`;

      function chartSeriesXml(chart, i = 0) {
        const fill = String(chart.color || '2F6FB0').replace('#', '').toUpperCase();
        const nameRef = chart.nameRef
          ? `<c:tx>${chartStringRef(chart.nameRef, [chart.seriesName || 'Series 1'])}</c:tx>`
          : `<c:tx><c:v>${xmlEsc(chart.seriesName || 'Series 1')}</c:v></c:tx>`;
        const cat = chart.categoriesRef
          ? `<c:cat>${chart.categoriesAreNumbers ? chartNumberRef(chart.categoriesRef, chart.categories || []) : chartStringRef(chart.categoriesRef, chart.categories || [])}</c:cat>`
          : `<c:cat><c:strLit><c:ptCount val="${(chart.categories || []).length}"/>${(chart.categories || []).map((v, n) => `<c:pt idx="${n}"><c:v>${xmlEsc(v)}</c:v></c:pt>`).join('')}</c:strLit></c:cat>`;
        const val = chart.valuesRef
          ? `<c:val>${chartNumberRef(chart.valuesRef, chart.cacheValues || chart.values || [], chart.formatCode || 'General')}</c:val>`
          : `<c:numLit><c:formatCode>${xmlEsc(chart.formatCode || 'General')}</c:formatCode><c:ptCount val="${(chart.values || []).length}"/>${(chart.values || []).map((v, n) => `<c:pt idx="${n}"><c:v>${Number(v) || 0}</c:v></c:pt>`).join('')}</c:numLit>`;
        const perPoint = ['pie', 'donut'].includes(chart.type)
          ? (chart.categories || []).map((_, n) => {
              const palette = ['2F6FB0', 'E08A1E', '2A9D6B', 'C8473D', '7A5BB5', '18A0B5', 'B8882A', '6B7A90'];
              return `<c:dPt><c:idx val="${n}"/><c:spPr><a:solidFill><a:srgbClr val="${palette[n % palette.length]}"/></a:solidFill><a:ln><a:noFill/></a:ln></c:spPr></c:dPt>`;
            }).join('')
          : `<c:spPr><a:solidFill><a:srgbClr val="${fill}"/></a:solidFill><a:ln><a:solidFill><a:srgbClr val="${fill}"/></a:solidFill></a:ln></c:spPr>`;
        const marker = chart.type === 'line' ? '<c:marker><c:symbol val="circle"/><c:size val="6"/></c:marker><c:smooth val="0"/>' : '';
        const trendline = chart.type === 'line' && chart.trendline && (chart.values || []).length >= 3
          ? '<c:trendline><c:name>Linear trendline</c:name><c:spPr><a:ln w="25400"><a:solidFill><a:srgbClr val="E08A1E"/></a:solidFill><a:prstDash val="dash"/></a:ln></c:spPr><c:trendlineType val="linear"/><c:dispRSqr val="0"/><c:dispEq val="0"/></c:trendline>'
          : '';
        return `<c:ser><c:idx val="${i}"/><c:order val="${i}"/>${nameRef}${perPoint}${marker}${trendline}${cat}${val}</c:ser>`;
      }

      function chartXml(chart, chartIndex) {
        const type = chart.type === 'hbar' ? 'bar' : chart.type;
        const id1 = 1000 + chartIndex * 2;
        const id2 = id1 + 1;
        const labels = chart.showDataLabels
          ? `<c:dLbls><c:showLegendKey val="0"/><c:showVal val="${type === 'pie' || type === 'donut' ? '0' : '1'}"/><c:showCatName val="0"/><c:showSerName val="0"/><c:showPercent val="${type === 'pie' || type === 'donut' ? '1' : '0'}"/><c:showLeaderLines val="1"/></c:dLbls>`
          : '';
        const legend = chart.showLegend
          ? '<c:legend><c:legendPos val="b"/><c:layout/><c:overlay val="0"/></c:legend>'
          : '';
        const catAxis = `<c:catAx><c:axId val="${id1}"/><c:scaling><c:orientation val="minMax"/></c:scaling><c:delete val="0"/><c:axPos val="${chart.type === 'hbar' ? 'l' : 'b'}"/><c:majorTickMark val="none"/><c:minorTickMark val="none"/><c:tickLblPos val="nextTo"/><c:crossAx val="${id2}"/><c:crosses val="autoZero"/><c:auto val="1"/><c:lblAlgn val="ctr"/><c:lblOffset val="100"/>${chart.xAxisTitle ? `<c:title>${chartTextXml(chart.xAxisTitle, 1000, false)}<c:overlay val="0"/></c:title>` : ''}<c:txPr><a:bodyPr/><a:lstStyle/><a:p><a:pPr><a:defRPr sz="900"/></a:pPr></a:p></c:txPr></c:catAx>`;
        const valAxis = `<c:valAx><c:axId val="${id2}"/><c:scaling><c:orientation val="minMax"/></c:scaling><c:delete val="0"/><c:axPos val="${chart.type === 'hbar' ? 'b' : 'l'}"/><c:majorGridlines><c:spPr><a:ln w="9525"><a:solidFill><a:srgbClr val="E3E8F0"/></a:solidFill></a:ln></c:spPr></c:majorGridlines><c:numFmt formatCode="${xmlEsc(chart.formatCode || 'General')}" sourceLinked="0"/><c:majorTickMark val="none"/><c:minorTickMark val="none"/><c:tickLblPos val="nextTo"/><c:crossAx val="${id1}"/><c:crosses val="autoZero"/><c:crossBetween val="between"/>${chart.yAxisTitle ? `<c:title>${chartTextXml(chart.yAxisTitle, 1000, false)}<c:overlay val="0"/></c:title>` : ''}</c:valAx>`;
        let plot;
        const ser = chartSeriesXml(chart);
        if (type === 'pie' || type === 'donut') {
          plot = `<c:${type === 'donut' ? 'doughnutChart' : 'pieChart'}><c:varyColors val="1"/>${ser}${labels}${type === 'donut' ? '<c:holeSize val="62"/>' : '<c:firstSliceAng val="270"/>'}</c:${type === 'donut' ? 'doughnutChart' : 'pieChart'}>`;
        } else if (type === 'line') {
          plot = `<c:lineChart><c:grouping val="standard"/><c:varyColors val="0"/>${ser}${labels}<c:marker val="1"/><c:smooth val="0"/><c:axId val="${id1}"/><c:axId val="${id2}"/></c:lineChart>${catAxis}${valAxis}`;
        } else {
          plot = `<c:barChart><c:barDir val="${chart.type === 'hbar' ? 'bar' : 'col'}"/><c:grouping val="clustered"/><c:varyColors val="0"/>${ser}${labels}<c:gapWidth val="65"/><c:overlap val="0"/><c:axId val="${id1}"/><c:axId val="${id2}"/></c:barChart>${catAxis}${valAxis}`;
        }
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><c:chartSpace xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><c:date1904 val="0"/><c:lang val="en-US"/><c:roundedCorners val="0"/><c:chart>${chartTitleXml(chart.title)}<c:autoTitleDeleted val="0"/><c:plotArea><c:layout/>${plot}</c:plotArea>${legend}<c:plotVisOnly val="0"/><c:dispBlanksAs val="gap"/><c:showDLblsOverMax val="0"/></c:chart><c:spPr><a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill><a:ln><a:noFill/></a:ln></c:spPr><c:printSettings><c:headerFooter/><c:pageMargins b="0.75" l="0.7" r="0.7" t="0.75" header="0.3" footer="0.3"/><c:pageSetup/></c:printSettings></c:chartSpace>`;
      }

      function drawingXml(charts) {
        const anchors = charts.map((c, i) => {
          const from = c.anchor || { row: i * 18, col: 0 };
          const toRow = from.row + (c.anchorRows || 16);
          const toCol = from.col + (c.anchorCols || 8);
          return `<xdr:twoCellAnchor editAs="oneCell"><xdr:from><xdr:col>${from.col}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${from.row}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from><xdr:to><xdr:col>${toCol}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${toRow}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:to><xdr:graphicFrame macro=""><xdr:nvGraphicFramePr><xdr:cNvPr id="${i + 2}" name="${xmlEsc(c.title || `Chart ${i + 1}`)}"/><xdr:cNvGraphicFramePr/></xdr:nvGraphicFramePr><xdr:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/></xdr:xfrm><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/chart"><c:chart xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:id="rId${i + 1}"/></a:graphicData></a:graphic></xdr:graphicFrame><xdr:clientData/></xdr:twoCellAnchor>`;
        }).join('');
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">${anchors}</xdr:wsDr>`;
      }

      const chartPartStart = (sheets, sheetIndex) => sheets.slice(0, sheetIndex).reduce((n, x) => n + (x.charts?.length || 0), 1);
      function tableXmlWithNames(table, id) {
        const namesUsed = new Set();
        const names = (table.columns || []).map((c, i) => {
          let base = String(c || `Column ${i + 1}`).trim() || `Column ${i + 1}`;
          base = base.replace(/[\[\]:*?/\\]/g, ' ').slice(0, 255) || `Column ${i + 1}`;
          let name = base, n = 2;
          while (namesUsed.has(name.toLowerCase())) name = `${base.slice(0, 245)} ${n++}`;
          namesUsed.add(name.toLowerCase());
          return `<tableColumn id="${i + 1}" name="${xmlEsc(name)}"/>`;
        });
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><table xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" id="${id}" name="${xmlEsc(table.name)}" displayName="${xmlEsc(table.name)}" ref="${xmlEsc(table.ref)}" totalsRowShown="0"><autoFilter ref="${xmlEsc(table.ref)}"/><tableColumns count="${names.length}">${names.join('')}</tableColumns><tableStyleInfo name="${xmlEsc(table.style || 'TableStyleMedium2')}" showFirstColumn="0" showLastColumn="0" showRowStripes="1" showColumnStripes="0"/></table>`;
      }


      function writeXlsx(sheets, styles, when = new Date()) {
        const used = new Set();
        const names = sheets.map((s) => safeSheetName(s.name, used));
        const defined = sheets
          .map((s, i) => (s.filter ? `<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${names[i].replace(/'/g, "''")}'!$A$1:$${colLetter(s.filter.cols - 1)}$${s.filter.rows}</definedName>` : ''))
          .join('');
        const files = [
          {
            name: '[Content_Types].xml',
            data:
              '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
              sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') +
              sheets.map((s, i) => s.charts?.length ? `<Override PartName="/xl/drawings/drawing${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>` : '').join('') +
              sheets.flatMap((s, i) => (s.charts || []).map((_, j) => `<Override PartName="/xl/charts/chart${chartPartStart(sheets, i) + j}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/>`)).join('') +
              sheets.flatMap((s) => (s.tables || [])).map((_, i) => `<Override PartName="/xl/tables/table${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.table+xml"/>`).join('') +
              '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>',
          },
          {
            name: '_rels/.rels',
            data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>',
          },
          {
            name: 'docProps/core.xml',
            data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:creator>Cubicle360</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${when.toISOString().replace(/\.\d+Z$/, 'Z')}</dcterms:created></cp:coreProperties>`,
          },
          {
            name: 'xl/workbook.xml',
            data:
              '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>' +
              names.map((n, i) => `<sheet name="${xmlEsc(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"${sheets[i].hidden ? ' state="hidden"' : ''}/>`).join('') +
              '</sheets>' + (defined ? `<definedNames>${defined}</definedNames>` : '') + '</workbook>',
          },
          {
            name: 'xl/_rels/workbook.xml.rels',
            data:
              '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
              sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +
              `<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`,
          },
          { name: 'xl/styles.xml', data: styles.xml() },
          ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: sheetXml(s) })),
        ];
        let chartId = 1;
        let tableId = 1;
        sheets.forEach((sheet, si) => {
          const charts = sheet.charts || [];
          const tables = sheet.tables || [];
          if (charts.length || tables.length) {
            const rels = [];
            if (charts.length) {
              rels.push(`<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing${si + 1}.xml"/>`);
            }
            tables.forEach((table, ti) => {
              const rid = (charts.length ? 2 : 1) + ti;
              rels.push(`<Relationship Id="rId${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/table" Target="../tables/table${tableId + ti}.xml"/>`);
            });
            files.push({ name: `xl/worksheets/_rels/sheet${si + 1}.xml.rels`, data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.join('')}</Relationships>` });
          }
          if (charts.length) {
            files.push({ name: `xl/drawings/drawing${si + 1}.xml`, data: drawingXml(charts) });
            files.push({ name: `xl/drawings/_rels/drawing${si + 1}.xml.rels`, data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${charts.map((_, ci) => `<Relationship Id="rId${ci + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/chart" Target="../charts/chart${chartId + ci}.xml"/>`).join('')}</Relationships>` });
            charts.forEach((chart, ci) => files.push({ name: `xl/charts/chart${chartId + ci}.xml`, data: chartXml(chart, chartId + ci - 1) }));
            chartId += charts.length;
          }
          if (tables.length) {
            tables.forEach((table) => {
              files.push({ name: `xl/tables/table${tableId}.xml`, data: tableXmlWithNames(table, tableId) });
              tableId++;
            });
          }
        });
        return makeZip(files, when);
      }

      const NAVY = '1F3A5F';
      const MAX_EXCEL_ROWS = 1048575;

      function numFmtFor(fmt) {
        switch (fmt.kind) {
          case 'integer':
            return '#,##0';
          case 'percent':
            return `0${(fmt.decimals ?? 1) > 0 ? `.${'0'.repeat(fmt.decimals ?? 1)}` : ''}%`;
          case 'duration':
            return '[h]:mm:ss';
          case 'time':
            return 'hh:mm:ss';
          case 'date':
            return 'yyyy-mm-dd';
          case 'datetime':
            return 'yyyy-mm-dd hh:mm:ss';
          case 'text':
            return undefined;
          default: {
            const d = fmt.decimals ?? 2;
            return d === 0 ? '#,##0' : `#,##0.${'0'.repeat(d)}`;
          }
        }
      }

      function excelNumber(v, fmt) {
        switch (fmt.kind) {
          case 'percent':
            return v / 100;
          case 'duration':
          case 'time':
            return v / 86400;
          case 'date':
          case 'datetime':
            return toExcelSerial(v);
          default:
            return v;
        }
      }

      const widthFor = (texts) => Math.min(50, Math.max(9, ...texts.map((t) => String(t ?? '').split('\n')[0].length + 2)));

      /* ---------------- visuals: the list of charts a report shows ----------------
         A visual only chooses a chart style and one metric the report already calculated. It never calculates anything. */
      const VISUAL_TYPES = ['bar', 'hbar', 'line', 'pie', 'donut'];
      const newVisualId = (list) => `v${list.reduce((m, v) => Math.max(m, +String(v.id).replace(/\D/g, '') || 0), 0) + 1}`;

      // Older saved reports keep one chart in presentation.charts; every saved entry becomes a visual.
      function visualsFromDefinition(def) {
        const saved = Array.isArray(def?.presentation?.charts) && def.presentation.charts.length ? def.presentation.charts : [{}];
        return saved.map((c, i) => ({ id: `v${i + 1}`, type: VISUAL_TYPES.includes(c?.type) ? c.type : 'bar', metric: c?.metric ?? null }));
      }

      // Tells which metric a visual really shows. No choice yet means the report's own default; a choice that
      // is no longer in the report is flagged as missing instead of being swapped for another metric.
      function resolveVisual(res, visual) {
        const calcIds = res.columns.filter((c) => c.kind === 'calc').map((c) => c.id);
        if (visual.metric === null || visual.metric === undefined || visual.metric === '') {
          const preferred = res.definition?.ranking?.by;
          return { ...visual, metric: calcIds.includes(preferred) ? preferred : calcIds[0] ?? null, missing: false };
        }
        return { ...visual, missing: !calcIds.includes(visual.metric) };
      }

      function addVisual(list, res) {
        const first = resolveVisual(res, { metric: null });
        return [...list, { id: newVisualId(list), type: 'bar', metric: first.metric }];
      }

      function updateVisual(list, id, patch) {
        return list.map((v) => {
          if (v.id !== id) return v;
          const next = { ...v };
          if (patch.type !== undefined && VISUAL_TYPES.includes(patch.type)) next.type = patch.type;
          if (patch.metric !== undefined) next.metric = patch.metric || null;
          return next;
        });
      }

      const removeVisual = (list, id) => list.filter((v) => v.id !== id);

      function buildReportWorkbook(ds, result, opts = {}) {
        const { includeSource = false, mode = 'static', generatedAt = new Date() } = opts;
        const styles = new StyleBook();
        const warnings = [];
        const formulaColumns = [];
        const cols = result.columns;
        const meta = result.meta;
        const def = result.definition;
        const hdr = styles.get({ bold: true, color: 'FFFFFF', fill: NAVY, border: 'all', wrap: true, v: 'center' });
        const tot = (spec) => styles.get({ ...spec, bold: true, border: 'top', fill: 'EEF2F7' });
        const bodyStyle = (c, bold = false) => {
          const fmt = c.kind === 'rank' ? { kind: 'integer' } : c.format;
          const numFmt = numFmtFor(fmt);
          return bold ? tot({ numFmt }) : styles.get({ numFmt, border: 'all' });
        };
        const letters = new Map(cols.map((c, i) => [c.id, colLetter(i)]));
        const nRows = result.rows.length;
        const dataStart = 2;
        const dataEnd = nRows + 1;

        const scaleConst = (aKind, value) => (aKind === 'percent' ? value / 100 : aKind === 'duration' || aKind === 'time' ? value / 86400 : aKind === 'date' || aKind === 'datetime' ? null : value);
        const derivedFormula = (c, row) => {
          const d = def.calculations.find((x) => x.id === c.id);
          if (!d || !['difference', 'variance', 'achievement', 'percentChange'].includes(d.type)) return null;
          const aCol = cols.find((x) => x.id === d.a);
          const aL = letters.get(d.a);
          if (!aL || !aCol) return null;
          const A = `${aL}${row}`;
          let B;
          if (d.b?.calc) {
            const bCol = cols.find((x) => x.id === d.b.calc);
            if (!bCol || (bCol.format.kind === 'percent') !== (aCol.format.kind === 'percent')) return null;
            B = `${letters.get(d.b.calc)}${row}`;
          } else {
            const k = scaleConst(aCol.format.kind, Number(d.b?.value));
            if (k === null || !Number.isFinite(k)) return null;
            B = `(${k})`;
          }
          if (d.type === 'difference') return `${A}-${B}`;
          if (d.type === 'achievement') return `IF(${B}=0,"",${A}/${B})`;
          return `IF(${B}=0,"",(${A}-${B})/ABS(${B}))`;
        };

        const reportRows = [];
        reportRows.push(cols.map((c) => S(c.label, hdr)));
        result.rows.forEach((row, r) => {
          const excelRow = r + dataStart;
          reportRows.push(
            row.map((v, k) => {
              const c = cols[k];
              const style = bodyStyle(c);
              if (c.kind === 'rank') return v === null ? BLANK(style) : N(v, style);
              if (c.kind === 'group') {
                const raw = result.groupRaw[r]?.[k - (cols[0].kind === 'rank' ? 1 : 0)];
                if (c.bucket === 'day' && raw !== null && raw !== undefined) return N(toExcelSerial(raw), styles.get({ numFmt: 'yyyy-mm-dd', border: 'all', h: 'left' }));
                return S(v, style);
              }
              if (v === null || v === undefined) return BLANK(style);
              const cached = excelNumber(v, c.format);
              if (mode === 'formula') {
                const f = derivedFormula(c, excelRow);
                if (f) {
                  if (!formulaColumns.includes(c.label)) formulaColumns.push(c.label);
                  return F(f, cached, style);
                }
              }
              return N(cached, style);
            }),
          );
        });
        if (result.totals) {
          reportRows.push([]);
          const totalRow = nRows + 3;
          reportRows.push(
            result.totals.map((v, k) => {
              const c = cols[k];
              const style = bodyStyle(c, true);
              if (c.kind === 'rank') return BLANK(style);
              if (c.kind === 'group') return v === '' || v === null ? BLANK(style) : S(v, style);
              if (v === null || v === undefined) return BLANK(style);
              const cached = excelNumber(v, c.format);
              if (mode === 'formula' && nRows > 0) {
                const L = letters.get(c.id);
                const range = `${L}${dataStart}:${L}${dataEnd}`;
                let f = null;
                if (['recordCount', 'count', 'sum'].includes(c.calcType) && !meta.limitApplied && !result.rows.some((r) => r[k] === null)) f = `SUM(${range})`;
                else if (c.calcType === 'min' && !meta.limitApplied) f = `MIN(${range})`;
                else if (c.calcType === 'max' && !meta.limitApplied) f = `MAX(${range})`;
                else f = derivedFormula(c, totalRow);
                if (f) {
                  if (!formulaColumns.includes(`${c.label} (Overall)`)) formulaColumns.push(`${c.label} (Overall)`);
                  return F(f, cached, style);
                }
              }
              return N(cached, style);
            }),
          );
        }
        const reportWidths = cols.map((c, k) => {
          const sample = result.rows.slice(0, 200).map((r) => (c.kind === 'group' ? r[k] : formatValue(r[k], c.format)));
          return widthFor([c.label, ...sample]);
        });
        const legacyCharts = [];
        const legacyTables = [];
        if (nRows > 0 && cols.length) {
          legacyTables.push({ name: 'C360ReportData', ref: `A1:${colLetter(cols.length - 1)}${nRows + 1}`, columns: cols.map((c) => c.label), style: 'TableStyleMedium2' });
        }
        // One native chart per visual. Older callers pass one chartType/chartMetric, which is the same as one visual.
        const visualList = Array.isArray(opts.visuals) ? opts.visuals : [{ type: opts.chartType, metric: opts.chartMetric }];
        const skippedVisuals = [];
        const groupIndexes = cols.map((c, i) => c.kind === 'group' ? i : -1).filter((i) => i >= 0);
        if (nRows > 0 && groupIndexes.length) {
          let slot = 0;
          visualList.forEach((visual) => {
            const chartType = VISUAL_TYPES.includes(visual.type) ? visual.type : 'bar';
            const resolved = resolveVisual(result, visual);
            const metricIndex = resolved.missing || !resolved.metric ? -1 : cols.findIndex((c) => c.id === resolved.metric && c.kind === 'calc');
            if (metricIndex < 0) { skippedVisuals.push(visual); return; }
            let points = result.rows.map((row) => ({
              label: groupIndexes.map((i) => String(row[i] ?? '(blank)')).join(' / '),
              value: row[metricIndex],
            })).filter((point) => point.value !== null && point.value !== undefined && Number.isFinite(point.value));
            const limit = chartType === 'pie' || chartType === 'donut' ? 12 : 40;
            points = points.slice(0, limit);
            if (chartType === 'pie' || chartType === 'donut') points = points.filter((point) => point.value > 0);
            if (!points.length) { skippedVisuals.push(visual); return; }
            const metric = cols[metricIndex];
            const groupLabel = groupIndexes.map((i) => cols[i].label).join(' / ');
            const chartDataStart = reportRows.length + 4; // 1-based first data row after a title and a header
            reportRows.push([]);
            reportRows.push([S(`Chart data — ${metric.label}`, hdr)]);
            reportRows.push([S(groupLabel || 'Category', hdr), S(metric.label, hdr)]);
            points.forEach((point) => reportRows.push([
              S(point.label, styles.get({ border: 'bottom' })),
              N(excelNumber(point.value, metric.format), styles.get({ numFmt: numFmtFor(metric.format), border: 'bottom' })),
            ]));
            const chartDataEnd = chartDataStart + points.length - 1;
            legacyTables.push({ name: slot ? `C360ChartData${slot + 1}` : 'C360ChartData', ref: `A${chartDataStart - 1}:B${chartDataEnd}`, columns: [groupLabel || 'Category', metric.label], style: 'TableStyleMedium4' });
            const anchorCol = Math.max(cols.length + 1, 6);
            const xlsxFormat = numFmtFor(metric.format) || 'General';
            legacyCharts.push({
              title: `${meta.name} — ${metric.label}`,
              type: chartType,
              seriesName: metric.label,
              categories: points.map((point) => point.label),
              values: points.map((point) => point.value),
              cacheValues: points.map((point) => excelNumber(point.value, metric.format)),
              categoriesRef: `'Report'!$A$${chartDataStart}:$A$${chartDataEnd}`,
              valuesRef: `'Report'!$B$${chartDataStart}:$B$${chartDataEnd}`,
              formatCode: xlsxFormat,
              xAxisTitle: chartType === 'pie' || chartType === 'donut' ? '' : groupLabel,
              yAxisTitle: chartType === 'pie' || chartType === 'donut' ? '' : metric.label,
              showLegend: ['pie', 'donut'].includes(chartType),
              showDataLabels: ['pie', 'donut'].includes(chartType),
              trendline: chartType === 'line',
              anchor: { row: slot * 19, col: anchorCol },
              anchorRows: 18,
              anchorCols: 9,
            });
            while (reportWidths.length < anchorCol + 9) reportWidths.push(12);
            slot++;
          });
        }
        const reportSheet = {
          name: 'Report', rows: reportRows, widths: reportWidths, freezeRows: 1,
          filter: undefined, tables: legacyTables, charts: legacyCharts, tab: NAVY,
        };

        const title = styles.get({ bold: true, size: 16, color: NAVY });
        const section = styles.get({ bold: true, color: 'FFFFFF', fill: NAVY });
        const label = styles.get({ bold: true, border: 'bottom', v: 'top' });
        const text = styles.get({ border: 'bottom', wrap: true, v: 'top' });
        const muted = styles.get({ italic: true, color: '667085' });
        const th = styles.get({ bold: true, fill: 'EEF2F7', border: 'all' });
        const rows = [];
        const sectionRow = (t, span = 4) => rows.push([S(t, section), ...Array.from({ length: span - 1 }, () => BLANK(section))]);
        rows.push([S('Cubicle360 report summary', title)]);
        rows.push([S(`Generated ${isoDateTime(generatedAt.getTime()).slice(0, 16)} (UTC)${ds.isSample ? ' · SAMPLE DATA' : ''}`, muted)]);
        rows.push([]);
        sectionRow('Report parameters');
        const kv = (k, v) => rows.push([S(k, label), S(v, text)]);
        kv('Report name', meta.name);
        kv('Source file', `${meta.source}${ds.isSample ? ' (sample data)' : ''}`);
        rows.push([S('Records in file', label), N(meta.inputRows + 0, styles.get({ numFmt: '#,##0', border: 'bottom', h: 'left' }))]);
        rows.push([S('Records excluded by you', label), N(meta.excludedRows, styles.get({ numFmt: '#,##0', border: 'bottom', h: 'left' }))]);
        rows.push([S('Records used in report', label), N(meta.filteredRows, styles.get({ numFmt: '#,##0', border: 'bottom', h: 'left' }))]);
        kv('Grouped by', meta.groupBy.length ? meta.groupBy.join('  ›  ') : 'None (overall figures)');
        kv('Date range used', meta.dateRange ? (meta.dateRange.from ? `${meta.dateRange.field}: ${meta.dateRange.from} to ${meta.dateRange.to}` : `${meta.dateRange.field}: no valid dates`) : 'Not applicable (no date column used)');
        kv('Filters applied', meta.filterSummary.length ? `${meta.filterSummary.join(`\n${meta.filterLogic} `)}` : 'None');
        kv('Ranking', meta.ranking ? `${meta.ranking.by}, ${meta.ranking.direction === 'desc' ? 'highest to lowest' : 'lowest to highest'} (${meta.ranking.method === 'dense' ? 'dense' : 'competition'} ranking)${meta.ranking.limit.mode !== 'all' ? `, ${meta.ranking.limit.mode} ${meta.ranking.limit.n}` : ''}` : 'None');
        kv('Values', mode === 'formula' ? `Formula-driven where valid (${formulaColumns.length ? formulaColumns.join(', ') : 'no formula columns applied'}); all other cells are static values` : 'Static values');
        rows.push([]);
        sectionRow('Key performance indicators', 3);
        rows.push([S('KPI', th), S('Value', th), S('Note', th)]);
        for (const k of result.kpis) {
          const fmt = k.format ?? { kind: 'integer' };
          const style = styles.get({ numFmt: numFmtFor(fmt), border: 'bottom', h: 'left' });
          const vCell = k.value === null || k.value === undefined ? BLANK(style) : typeof k.value === 'number' ? N(excelNumber(k.value, fmt), style) : S(k.value, style);
          rows.push([S(k.label, label), vCell, S(k.note ?? '', text)]);
        }
        rows.push([]);
        sectionRow('Calculations', 4);
        rows.push([S('Name', th), S('Type', th), S('Source column', th), S('Condition / weight / target', th)]);
        for (const c of meta.calculations) {
          const parts = [];
          if (c.condition) parts.push(c.condition);
          if (c.weightField) parts.push(`weighted by ${c.weightField}`);
          if (c.a) parts.push(`A = ${meta.calculations.find((x) => x.id === c.a)?.name ?? c.a}`);
          if (c.b) parts.push(c.b.calc ? `B = ${meta.calculations.find((x) => x.id === c.b.calc)?.name ?? c.b.calc}` : `target = ${c.b.value}`);
          rows.push([S(c.name, label), S(c.typeLabel, text), S(c.field ?? '—', text), S(parts.join('; ') || '—', text)]);
        }
        rows.push([]);
        sectionRow('Warnings and notes', 4);
        if (result.warnings.length === 0) rows.push([S('No warnings.', text)]);
        for (const w of result.warnings) rows.push([S(w.title, label), S(w.message, text)]);
        if (includeSource) {
          rows.push([]);
          rows.push([S('The "Source Data" sheet holds the original uploaded data. Nothing in it was changed.', muted)]);
        }
        const summarySheet = { name: 'Summary', rows, widths: [34, 62, 26, 46], gridLines: false, tab: '3E7CB1' };
        const sheets = [reportSheet, summarySheet];

        if (includeSource) {
          let srcRows = ds.rows;
          if (srcRows.length > 1048575 - 1) {
            warnings.push(`The source data has ${ds.rows.length} rows, more than Excel can hold; only the first ${MAX_EXCEL_ROWS - 1} were included.`);
            srcRows = srcRows.slice(0, 1048575 - 1);
          }
          const colStyles = ds.columns.map((c) => {
            switch (c.type) {
              case 'integer':
                return styles.get({ numFmt: '0' });
              case 'decimal':
                return styles.get({ numFmt: 'General' });
              case 'percentage':
                return styles.get({ numFmt: '0.0#%' });
              case 'date':
                return styles.get({ numFmt: 'yyyy-mm-dd', h: 'left' });
              case 'datetime':
                return styles.get({ numFmt: 'yyyy-mm-dd hh:mm:ss', h: 'left' });
              case 'time':
                return styles.get({ numFmt: 'hh:mm:ss' });
              case 'duration':
                return styles.get({ numFmt: '[h]:mm:ss' });
              default:
                return 0;
            }
          });
          const header = ds.columns.map((c) => S(c.name, hdr));
          const hasExcluded = ds.excluded.size > 0;
          if (hasExcluded) header.push(S('Excluded from report?', hdr));
          const src = [header];
          srcRows.forEach((r, i) => {
            const line = ds.columns.map((c, k) => {
              const raw = r[c.index];
              if (isBlank(raw)) return null;
              const TEXTUAL = c.type === 'text' || c.type === 'category' || c.type === 'identifier' || c.type === 'boolean';
              if (TEXTUAL) return S(raw, colStyles[k]);
              const v = parseValue(raw, c);
              if (v === null) return S(raw, 0);
              const fmtKind = { percentage: 'percent', date: 'date', datetime: 'datetime', time: 'time', duration: 'duration' }[c.type] ?? 'decimal';
              return N(fmtKind === 'decimal' ? v : excelNumber(v, { kind: fmtKind }), colStyles[k]);
            });
            if (hasExcluded) line.push(ds.excluded.has(i) ? S('Yes') : null);
            src.push(line);
          });
          const widths = ds.columns.map((c) => widthFor([c.name, ...ds.rows.slice(0, 200).map((r) => r[c.index])]));
          if (hasExcluded) widths.push(22);
          sheets.push({ name: 'Source Data', rows: src, widths, freezeRows: 1, filter: { rows: src.length, cols: header.length }, tab: '98A2B3' });
        }

        return { bytes: writeXlsx(sheets, styles, generatedAt), warnings, formulaColumns, chartCount: legacyCharts.length, skippedVisuals };
      }

      Object.assign(ns, { makeZip, crc32, StyleBook, writeXlsx, buildReportWorkbook, colLetter, S, N, F, BLANK, numFmtFor, excelNumber, widthFor, VISUAL_TYPES, visualsFromDefinition, resolveVisual, addVisual, updateVisual, removeVisual });
    })(C360);
  </script>

  <!-- =========================================================================
       MODULE 07: SAMPLE DATA GENERATOR (07-sample.js)

  <script>
    (function (ns) {
      'use strict';

      function rng(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const AGENTS = [
        { name: 'Maria Santos', id: '00417', team: 'Alpha', surveys: 38, good: 0.92 },
        { name: 'Juan dela Cruz', id: '00418', team: 'Alpha', surveys: 31, good: 0.8 },
        { name: 'Ana Reyes', id: '00532', team: 'Bravo', surveys: 44, good: 0.88 },
        { name: 'Carlo Mendoza', id: '00533', team: 'Bravo', surveys: 27, good: 0.7 },
        { name: 'Liza Ramos', id: '00610', team: 'Charlie', surveys: 5, good: 1 },
        { name: 'Paolo Garcia', id: '00611', team: 'Charlie', surveys: 60, good: 0.9 },
        { name: 'Jenny Lim', id: '00702', team: 'Alpha', surveys: 22, good: 0.86 },
        { name: 'Rico Bautista', id: '00703', team: 'Bravo', surveys: 18, good: 0.61 },
      ];

      function sampleCsatCsv({ seed = 360 } = {}) {
        const rand = rng(seed);
        const header = ['Survey ID', 'Employee ID', 'Agent Name', 'Team', 'Survey Date', 'CSAT Score', 'Handle Time', 'Status', 'Customer Phone', 'Comment'];
        const rows = [];
        const comments = ['Great help', 'Took too long', '', 'Very polite, thank you', 'Issue not resolved', '', 'Quick and clear'];
        const statuses = ['Completed', 'Completed', 'Completed', 'Escalated', 'Pending'];
        let n = 1;
        for (const a of AGENTS) {
          for (let k = 0; k < a.surveys; k++) {
            const day = 1 + Math.floor(rand() * 28);
            const good = rand() < a.good;
            let score = good ? (rand() < 0.6 ? 5 : 4) : 1 + Math.floor(rand() * 3);
            const min = 3 + Math.floor(rand() * 12);
            const sec = Math.floor(rand() * 60);
            let team = a.team;
            const spell = rand();
            if (a.team === 'Alpha' && spell < 0.06) team = 'alpha';
            else if (a.team === 'Alpha' && spell < 0.1) team = 'ALPHA ';
            const name = a.name === 'Juan dela Cruz' ? 'dela Cruz, Juan' : a.name;
            rows.push([
              `SRV${String(10000 + n++)}`,
              a.id,
              name,
              team,
              `2026-11-${String(day).padStart(2, '0')}`,
              String(score),
              `0:${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`,
              statuses[Math.floor(rand() * statuses.length)],
              `0917${String(1000000 + Math.floor(rand() * 8999999))}`,
              comments[Math.floor(rand() * comments.length)],
            ]);
          }
        }
        for (let i = rows.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          [rows[i], rows[j]] = [rows[j], rows[i]];
        }
        rows[3][5] = 'N/A';
        rows[9][5] = '';
        rows[15][5] = 'five';
        rows[21][5] = 'N/A';
        rows.push([...rows[7]]);
        const esc = (v) => (/[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v);
        return [header, ...rows].map((r) => r.map(esc).join(',')).join('\r\n');
      }

      Object.assign(ns, { sampleCsatCsv, SAMPLE_AGENTS: AGENTS, rng });
    })(C360);
  </script>

      function explainCalculation(ds, calc, allCalcs = []) {
        const meta = CALC_TYPES[calc.type];
        const friendly = FRIENDLY_CALC[calc.type];
        if (!meta || !friendly) return 'Custom calculation.';

        const col = calc.field ? resolveColumn(ds, calc.field) : null;
        const wcol = calc.weightField ? resolveColumn(ds, calc.weightField) : null;
        const parts = [];

        parts.push(`What it measures: ${friendly.friendly}.`);

        if (meta.derived) {
          const aName = allCalcs.find((x) => x.id === calc.a)?.name ?? calc.a ?? 'first metric';
          if (calc.type === 'periodChange') {
            parts.push(`How it is calculated: Compares "${aName}" in each row against the previous row of the same group.`);
          } else {
            const bLabel = calc.b?.calc
              ? `"${allCalcs.find((x) => x.id === calc.b.calc)?.name ?? calc.b.calc}"`
              : `fixed target ${calc.b?.value ?? '(not set)'}`;
            parts.push(`How it is calculated: Compares "${aName}" against ${bLabel}.`);
          }
          return parts.join(' ');
        }

        if (col) {
          parts.push(`Source column: "${col.label}" (${TYPE_LABELS[col.type].toLowerCase()}).`);
        } else if (calc.type === 'recordCount') {
          parts.push('Source: All rows that pass your report filters.');
        }

        if (calc.condition && calc.condition.field && calc.condition.op) {
          const condDesc = ns.describeCondition(ds, calc.condition);
          if (calc.type === 'percentage') {
            parts.push(`Qualifying rule: Counts rows where ${condDesc}, divided by all rows with a valid value in "${col?.label ?? 'the dataset'}".`);
          } else {
            parts.push(`Included records: Only rows where ${condDesc}.`);
          }
        } else if (col && calc.type !== 'recordCount') {
          parts.push(`Included records: All filtered rows that have a valid, non-empty value in "${col.label}".`);
        }

        if (wcol) {
          parts.push(`Weighting: Weighted by "${wcol.label}" so rows with higher volume carry proportional weight.`);
        } else if (calc.type === 'percentage') {
          parts.push('Weighting: Overall totals are calculated directly from underlying qualifying counts rather than averaging group percentages.');
        }

        if (ds?.excluded?.size > 0) {
          parts.push(`Excluded records: ${ds.excluded.size} row(s) you excluded in Data Health are left out.`);
        }

        return parts.join(' ');
      }

      function explainDataset(ds) {
        const quality = inspectQuality(ds);
        const entities = ds.columns.filter((c) => c.role === 'entity');
        const categories = ds.columns.filter((c) => c.role === 'category' || c.type === 'category' || c.type === 'boolean');
        const dates = ds.columns.filter((c) => DATE_TYPES.has(c.type));
        const metrics = ds.columns.filter((c) => NUMERIC_TYPES.has(c.type) && c.type !== 'duration');
        const durations = ds.columns.filter((c) => c.type === 'duration');
        const identifiers = ds.columns.filter((c) => c.type === 'identifier');

        const detectedPieces = [];
        if (entities.length) detectedPieces.push(`people/entities (${entities.map((c) => c.label).join(', ')})`);
        if (categories.length) detectedPieces.push(`categories (${categories.slice(0, 4).map((c) => c.label).join(', ')}${categories.length > 4 ? '…' : ''})`);
        if (dates.length) detectedPieces.push(`dates (${dates.map((c) => c.label).join(', ')})`);
        if (metrics.length) detectedPieces.push(`numeric metrics (${metrics.slice(0, 4).map((c) => c.label).join(', ')}${metrics.length > 4 ? '…' : ''})`);
        if (durations.length) detectedPieces.push(`durations (${durations.map((c) => c.label).join(', ')})`);
        if (identifiers.length) detectedPieces.push(`IDs (${identifiers.map((c) => c.label).join(', ')})`);

        const headline = detectedPieces.length
          ? `This file contains ${ds.rows.length.toLocaleString()} records across ${ds.columns.length} columns, including ${detectedPieces.join(', ')}.`
          : `This file contains ${ds.rows.length.toLocaleString()} records across ${ds.columns.length} text columns.`;

        const allTokens = ds.columns.flatMap((c) => tokenize(c.name));
        const hasToken = (...words) => words.some((w) => allTokens.includes(w));
        const suggestions = [];

        if (hasToken('csat', 'satisfaction', 'survey')) {
          suggestions.push({
            templateId: 'monthly_csat',
            reason: 'We found satisfaction scores and survey details — ideal for a Monthly CSAT Summary.',
          });
        }
        if (hasToken('qa', 'quality', 'audit', 'evaluation', 'evaluator')) {
          suggestions.push({
            templateId: 'qa_performance',
            reason: 'We found quality evaluation fields — you can build a QA Performance Report.',
          });
        }
        if (hasToken('attendance', 'absent', 'leave', 'pto', 'sick', 'shift')) {
          suggestions.push({
            templateId: 'attendance_overview',
            reason: 'We found attendance or status columns — ready for an Attendance Overview or Leave Summary.',
          });
        }
        if (hasToken('ticket', 'sla', 'aging', 'ageing', 'resolution', 'tat', 'backlog', 'escalated') || durations.length > 0) {
          suggestions.push({
            templateId: 'sla_ticket_aging',
            reason: 'We found ticket or duration/handling time columns — suited for an SLA & Ticket Aging report.',
          });
        }
        if (entities.length > 0 && metrics.length > 0) {
          suggestions.push({
            templateId: 'agent_ranking',
            reason: `We found ${entities[0].label} and numeric metrics — you can rank performance from highest to lowest.`,
          });
        }
        if (!suggestions.length) {
          suggestions.push({
            templateId: 'general_kpi',
            reason: 'You can summarize counts, totals, or averages across any column in this file.',
          });
        }

        const uncertainColumns = ds.columns.filter(
          (c) => c.detected?.ambiguousDate || c.detected?.mixedDateOrder || (c.detected?.alt && c.detected.alt.ratio >= 0.5)
        );

        return {
          headline,
          counts: {
            records: ds.rows.length,
            columns: ds.columns.length,
            issues: quality.summary.errors + quality.summary.warnings,
          },
          groups: { entities, categories, dates, metrics, durations, identifiers },
          suggestions: suggestions.slice(0, 3),
          uncertainColumns,
          qualitySummary: quality.summary,
        };
      }

            { key: 'output', label: 'Output / Volume metric (optional)', required: false, accepts: 'durationOrNumber', hints: ['volume', 'calls', 'handled', 'sales', 'units', 'count', 'qty', 'amount', 'hours', 'score'] },
            { key: 'date', label: 'Date column (optional)', required: false, accepts: 'date', hints: ['date', 'day', 'week', 'month'] },
          ],
          build(ds, map) {
            const d = emptyDefinition();
            d.name = 'Productivity Summary';
            const notes = [];
            const gCol = map.group ? resolveColumn(ds, map.group) : null;
            const oCol = map.output ? resolveColumn(ds, map.output) : null;
            if (gCol) d.groupBy.push({ field: gCol.name });
            d.calculations.push({ id: 'items', name: 'Total Records', type: 'recordCount', format: { kind: 'integer' } });
            if (oCol) {
              d.calculations.push({ id: 'total_out', name: `Total ${oCol.label}`, type: 'sum', field: oCol.name, format: { kind: 'auto' } });
              d.calculations.push({ id: 'avg_out', name: `Average ${oCol.label}`, type: 'average', field: oCol.name, format: { kind: 'decimal', decimals: 2 } });
              d.calculations.push({ id: 'pct_total', name: 'Share of Total (%)', type: 'percentOfTotal', field: oCol.name, format: { kind: 'percent', decimals: 1 } });
              d.ranking.by = 'total_out';
            } else {
              d.calculations.push({ id: 'pct_total', name: 'Share of Records (%)', type: 'percentOfTotal', format: { kind: 'percent', decimals: 1 } });
              d.ranking.by = 'items';
            }
            d.ranking.direction = 'desc';
            return { definition: d, notes };
          },
        },

        general_kpi: {
          id: 'general_kpi',
          name: 'General KPI Report',
          category: 'General Purpose',
          description: 'Flexible overview of record counts, totals, and averages for any dataset.',
          layoutHint: 'Clean summary table and bar chart.',
          roles: [
            { key: 'group', label: 'Category or Group column (optional)', required: false, accepts: 'text', hints: ['team', 'department', 'category', 'status', 'agent', 'employee', 'name', 'type'] },
            { key: 'metric', label: 'Numeric column to summarize (optional)', required: false, accepts: 'durationOrNumber', hints: ['score', 'amount', 'total', 'sales', 'count', 'qty', 'rating', 'duration', 'hours'] },
          ],
          build(ds, map) {
            const d = emptyDefinition();
            d.name = 'General KPI Report';
            const notes = [];
            const gCol = map.group ? resolveColumn(ds, map.group) : null;
            const mCol = map.metric ? resolveColumn(ds, map.metric) : null;
            if (gCol) d.groupBy.push({ field: gCol.name });
            d.calculations.push({ id: 'records', name: 'Record Count', type: 'recordCount', format: { kind: 'integer' } });
            if (mCol) {
              d.calculations.push({ id: 'sum_val', name: `Total ${mCol.label}`, type: 'sum', field: mCol.name, format: { kind: 'auto' } });
              d.calculations.push({ id: 'avg_val', name: `Average ${mCol.label}`, type: 'average', field: mCol.name, format: { kind: 'decimal', decimals: 2 } });
              d.ranking.by = 'sum_val';
            } else {
              d.ranking.by = 'records';
            }
            d.ranking.direction = 'desc';
            return { definition: d, notes };
          },
        },
      };

      function matchTemplate(ds, templateId) {
        const tpl = REPORT_TEMPLATES[templateId] ?? REPORT_TEMPLATES.general_kpi;
        const used = new Set();
        const mapping = {};
        const orderedRoles = [...tpl.roles].sort((a, b) => Number(b.required) - Number(a.required));

        for (const role of orderedRoles) {
          const acceptFn = ACCEPT_FNS[role.accepts] ?? ACCEPT_FNS.any;
          let best = null;
          let bestScore = 0;
          for (const col of ds.columns) {
            if (used.has(col.key) || !acceptFn(col)) continue;
            const tokens = tokenize(col.name).join(' ');
            let score = 1;
            role.hints.forEach((h, idx) => {
              if (tokens.includes(h)) score += 12 - Math.min(idx, 9);
            });
            if (role.accepts === 'number' && col.role === 'metric') score += 3;
            if (role.accepts === 'durationOrNumber' && (col.role === 'metric' || col.type === 'duration')) score += 3;
            if (role.accepts === 'date' && DATE_TYPES.has(col.type)) score += 4;
            if (role.accepts === 'text' && (col.role === 'entity' || col.role === 'category')) score += 2;
            if (score > bestScore) {
              best = col;
              bestScore = score;
            }
          }
          const compatibleCount = ds.columns.filter((c) => !used.has(c.key) && acceptFn(c)).length;
          if (best && (bestScore > 1 || (role.required && compatibleCount === 1))) {
            mapping[role.key] = best.name;
            used.add(best.key);
          } else {
            mapping[role.key] = null;
          }
        }

        const missingRequired = tpl.roles.filter((r) => r.required && !mapping[r.key]);
        return {
          template: tpl,
          mapping,
          missingRequired,
          ready: missingRequired.length === 0,
        };
      }

      function applyTemplate(ds, templateId, mapping, { allowPartial = false } = {}) {
        const tpl = REPORT_TEMPLATES[templateId] ?? REPORT_TEMPLATES.general_kpi;
        const missingRequired = tpl.roles.filter((r) => r.required && (!mapping[r.key] || !resolveColumn(ds, mapping[r.key])));
        if (missingRequired.length > 0 && !allowPartial) {
          return {
            ok: false,
            missingRequired,
            message: `Missing required information: ${missingRequired.map((r) => r.label).join(', ')}.`,
          };
        }
        const built = tpl.build(ds, mapping);
        if (missingRequired.length > 0) {
          built.notes.unshift(
            `Continued without ${missingRequired.map((r) => r.label).join(', ')} — showing available record counts. You can add metrics anytime.`
          );
        }
        return {
          ok: true,
          definition: built.definition,
          notes: built.notes,
          layoutHint: tpl.layoutHint,
        };
      }

      function buildGuidedDefinition(ds, answers) {
        const d = emptyDefinition();
        d.name = (answers.title ?? '').trim() || 'Guided Report';

        if (answers.groupField) {
          const gCol = resolveColumn(ds, answers.groupField);
          if (gCol) {
            const isDate = DATE_TYPES.has(gCol.type);
            d.groupBy.push({
              field: gCol.name,
              bucket: isDate ? (answers.dateBucket || 'month') : undefined,
            });
          }
        }

        if (answers.dateFilterField && (answers.dateFrom || answers.dateTo)) {
          const dCol = resolveColumn(ds, answers.dateFilterField);
          if (dCol) {
            if (answers.dateFrom && answers.dateTo) {
              d.filters.conditions.push({ field: dCol.name, op: 'between', value: answers.dateFrom, value2: answers.dateTo });
            } else if (answers.dateFrom) {
              d.filters.conditions.push({ field: dCol.name, op: 'gte', value: answers.dateFrom });
            } else if (answers.dateTo) {
              d.filters.conditions.push({ field: dCol.name, op: 'lte', value: answers.dateTo });
            }
          }
        }

        if (answers.filterField && answers.filterOp) {
          const fCol = resolveColumn(ds, answers.filterField);
          if (fCol) {
            d.filters.conditions.push({
              field: fCol.name,
              op: answers.filterOp,
              value: answers.filterValue ?? '',
            });
          }
        }

        const mCol = answers.metricField ? resolveColumn(ds, answers.metricField) : null;
        const choice = answers.aggChoice || (mCol ? 'average' : 'recordCount');

        if (choice !== 'recordCount') {
          d.calculations.push({
            id: 'total_records',
            name: 'Records',
            type: 'recordCount',
            format: { kind: 'integer' },
          });
        }

        let primaryCalcId = 'total_records';
        if (choice === 'recordCount') {
          d.calculations.push({
            id: 'total_records',
            name: 'Number of Records',
            type: 'recordCount',
            format: { kind: 'integer' },
          });
          primaryCalcId = 'total_records';
        } else if (choice === 'distinctCount' && mCol) {
          d.calculations.push({
            id: 'unique_entries',
            name: `Unique ${mCol.label}`,
            type: 'distinctCount',
            field: mCol.name,
            format: { kind: 'integer' },
          });
          primaryCalcId = 'unique_entries';
        } else if (choice === 'percentage' && mCol) {
          const op = answers.pctOperator || 'gte';
          const val = answers.pctValue ?? '';
          d.calculations.push({
            id: 'pct_meeting',
            name: `% of ${mCol.label} meeting rule`,
            type: 'percentage',
            field: mCol.name,
            condition: { field: mCol.name, op, value: String(val) },
            format: { kind: 'percent', decimals: 1 },
          });
          primaryCalcId = 'pct_meeting';
        } else if (mCol && ['average', 'sum', 'max', 'min'].includes(choice)) {
          const verb = { average: 'Average', sum: 'Total', max: 'Highest', min: 'Lowest' }[choice];
          d.calculations.push({
            id: 'primary_metric',
            name: `${verb} ${mCol.label}`,
            type: choice,
            field: mCol.name,
            format: { kind: 'auto' },
          });
          primaryCalcId = 'primary_metric';
        } else if (choice !== 'recordCount') {
          // The chosen calculation needs a column that was not picked (or does not exist). Keep it in the definition with an
          // empty column so validation asks for the column, instead of quietly producing a records-only report.
          const verb = { average: 'Average', sum: 'Total', max: 'Highest', min: 'Lowest', distinctCount: 'Unique entries', percentage: 'Percentage' }[choice] ?? 'Calculation';
          d.calculations.push({
            id: 'primary_metric',
            name: `${verb} (column not chosen)`,
            type: choice,
            field: '',
            ...(choice === 'percentage' ? { condition: { field: '', op: answers.pctOperator || 'gte', value: String(answers.pctValue ?? '') } } : {}),
            format: { kind: 'auto' },
          });
          primaryCalcId = 'primary_metric';
        }

        const sortChoice = answers.sortChoice || 'desc';
        if (sortChoice !== 'natural' && d.groupBy.length > 0) {
          d.ranking.by = primaryCalcId;
          d.ranking.direction = sortChoice === 'asc' ? 'asc' : 'desc';
          if (answers.topN && Number(answers.topN) > 0) {
            d.ranking.limit = { mode: sortChoice === 'asc' ? 'bottom' : 'top', n: Math.floor(Number(answers.topN)) };
          }
        }

        return d;
      }

      function narrateReport(result) {
        if (!result || !result.ok) return [];
        const { meta, columns, rows, totalsValues, definition } = result;
        const insights = [];

        const filterNote = meta.filterSummary.length
          ? ` after applying ${meta.filterSummary.length} filter(s) (${meta.filterSummary.join(` ${meta.filterLogic} `)})`
          : '';
        const exclNote = meta.excludedRows > 0
          ? ` (${meta.excludedRows.toLocaleString()} row(s) excluded in Data Health were left out)`
          : '';
        insights.push({
          title: 'Data scope & sample size',
          text: `This report analyzed ${meta.filteredRows.toLocaleString()} of ${meta.inputRows.toLocaleString()} total records${filterNote}${exclNote}.`,
        });

        if (meta.filteredRows === 0) {
          insights.push({
            title: 'No matching records',
            text: 'None of the rows matched your active filters, so no metrics could be calculated. Try broadening your date range or removing a filter.',
          });
          return insights;
        }

        const calcCols = columns.filter((c) => c.kind === 'calc');
        const primaryCol = (definition.ranking.by ? calcCols.find((c) => c.id === definition.ranking.by) : null)
          ?? calcCols.find((c) => c.calcType !== 'recordCount')
          ?? calcCols[0];

        if (primaryCol) {
          const overallVal = totalsValues[primaryCol.id];
          const formatted = overallVal === null || overallVal === undefined
            ? 'not available'
            : formatValue(overallVal, primaryCol.format);
          const calcDef = definition.calculations.find((c) => c.id === primaryCol.id);
          let detail = '';
          if (calcDef?.type === 'percentage') {
            detail = ' This is calculated directly from all qualifying records rather than averaging group percentages.';
          } else if (calcDef?.type === 'weightedAverage') {
            detail = ' Higher-volume rows contributed proportionally more to this overall figure.';
          }
          insights.push({
            title: `Overall ${primaryCol.label}`,
            text: `Across all included records, ${primaryCol.label} is ${formatted}.${detail}`,
          });
        }

        const groupCols = columns.filter((c) => c.kind === 'group');
        if (groupCols.length > 0 && primaryCol && rows.length > 1) {
          const ci = columns.findIndex((c) => c.id === primaryCol.id);
          const giList = groupCols.map((gc) => columns.indexOf(gc));
          const validGroups = rows
            .map((r) => ({
              name: giList.map((idx) => r[idx]).join(' / '),
              val: r[ci],
            }))
            .filter((x) => x.val !== null && x.val !== undefined && Number.isFinite(x.val));

          if (validGroups.length >= 2) {
            const highest = validGroups.reduce((a, b) => (b.val > a.val ? b : a));
            const lowest = validGroups.reduce((a, b) => (b.val < a.val ? b : a));
            const spread = highest.val - lowest.val;

            const isDateTrend = groupCols.length === 1 && Boolean(groupCols[0].bucket);
            if (isDateTrend) {
              const first = validGroups[0];
              const last = validGroups[validGroups.length - 1];
              const delta = last.val - first.val;
              const direction = delta > 0 ? 'increased' : delta < 0 ? 'decreased' : 'remained unchanged';
              insights.push({
                title: 'Change over time',
                text: `From ${first.name} (${formatValue(first.val, primaryCol.format)}) to ${last.name} (${formatValue(last.val, primaryCol.format)}), ${primaryCol.label} ${direction} by ${formatValue(Math.abs(delta), primaryCol.format)}. Peak was in ${highest.name} (${formatValue(highest.val, primaryCol.format)}).`,
              });
            } else {
              insights.push({
                title: 'Highest vs. lowest group',
                text: `${highest.name} has the highest ${primaryCol.label} at ${formatValue(highest.val, primaryCol.format)}, while ${lowest.name} is lowest at ${formatValue(lowest.val, primaryCol.format)} (a difference of ${formatValue(spread, primaryCol.format)}).`,
              });
            }
          }
        }

        return insights;
      }

      Object.assign(ns, {
        FRIENDLY_CALC,
        explainCalculation,
        explainDataset,
        TASK_CATEGORIES,
        REPORT_TEMPLATES,
        matchTemplate,
        applyTemplate,
        buildGuidedDefinition,
        narrateReport,
      });
    })(C360);
  </script>

  </script>

      const ACCEPTS = {
        person: (c) => TEXT_TYPES.has(c.type),

      const T2_RECIPES = {

          ],
          build(ds, map, opts = {}) {
            const sCol = resolveColumn(ds, map.score);
            if (!sCol || !NUMERIC_TYPES.has(sCol.type)) throw new Error('The score column is not numeric. In step 2, map "' + ('CSAT score') + '" to the numeric column that holds the satisfaction score (e.g. 1–5).');
            const max = sCol.stats?.max ?? 5;
            const rule = ns.csatThresholdRule(ds, sCol, opts.csatThreshold);
            if (rule.error) throw new Error(rule.error);
            const T = rule.threshold;
            const hasScale = max >= 3;
            const tCol = map.team ? resolveColumn(ds, map.team) : null;
            const aCol = map.agent ? resolveColumn(ds, map.agent) : null;
            const dCol = map.date ? resolveColumn(ds, map.date) : null;
            const nC = rc('surveys', 'Surveys', 'recordCount', { format: { kind: 'integer' } });
            const avgC = rc('avgScore', 'Average score', 'average', { field: sCol.name, format: { kind: 'decimal', decimals: 2 } });
            const pctC = rc('csatPct', `CSAT % (score ≥ ${T})`, 'percentage', { field: sCol.name, condition: { field: sCol.name, op: 'gte', value: String(T) }, format: { kind: 'percent', decimals: 1 } });
            const posC = rc('positive', 'Positive responses', 'recordCount', { condition: { field: sCol.name, op: 'gte', value: String(T) }, format: { kind: 'integer' } });
            const queries = [];
            queries.push({
              id: PRIMARY, name: 'Team summary',
              groupBy: tCol ? [{ field: tCol.name }] : [],
              calculations: [nC, avgC, pctC, posC, ...(hasScale ? [
                rc('neutral', 'Neutral responses', 'recordCount', { condition: { field: sCol.name, op: 'eq', value: String(T - 1) }, format: { kind: 'integer' } }),
                rc('negative', 'Negative responses', 'recordCount', { condition: { field: sCol.name, op: 'lte', value: String(T - 2) }, format: { kind: 'integer' } }),
              ] : [])],
              ranking: { by: 'csatPct', direction: 'desc', method: 'competition', limit: { mode: 'all', n: 10 } },
            });
            if (dCol) queries.push({ id: 'trend', name: 'Monthly trend', groupBy: [{ field: dCol.name, bucket: 'month' }], calculations: [nC, pctC, avgC] });

              id: 'dist', name: 'Score distribution', groupBy: [{ field: sCol.name }],
