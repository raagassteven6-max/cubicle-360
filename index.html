        };
        if (Array.isArray(f)) d.filters = { logic: 'AND', conditions: f.map(toCond) };
        else if (f && typeof f === 'object') d.filters = { logic: f.logic === 'OR' ? 'OR' : 'AND', conditions: (f.conditions ?? []).map(toCond) };
        d.filters.conditions.forEach((c, i) => {
          if (c.op && !OPERATORS[c.op]) errors.push(`Filter ${i + 1} uses an unknown operator "${c.op}".`);
        });
        const calcs = input.calculations ?? [];
        if (!Array.isArray(calcs)) errors.push('"calculations" must be a list.');
        else {
          d.calculations = calcs.map((c, i) => ({
            id: String(c.id ?? `calc_${i + 1}`),
            name: String(c.name ?? c.id ?? `Calculation ${i + 1}`),
            type: c.type,
            field: c.field || undefined,
            weightField: c.weightField || undefined,
            condition: c.condition ? toCond(c.condition) : null,
            a: c.a || undefined,
            b: c.b === undefined ? undefined : c.b,
            format: c.format ?? { kind: 'auto' },
          }));
          d.calculations.forEach((c) => {
            if (!CALC_TYPES[c.type]) errors.push(`Calculation "${c.name}" uses an unknown type "${c.type}".`);
          });
        }
        const r = input.ranking;
        if (r && typeof r === 'object') {
          d.ranking.by = r.by ?? r.field ?? null;
          d.ranking.direction = DIRECTIONS[r.direction] ?? 'desc';
          d.ranking.method = r.method === 'dense' ? 'dense' : 'competition';
          const lim = r.limit ?? {};
          d.ranking.limit = { mode: ['top', 'bottom'].includes(lim.mode) ? lim.mode : 'all', n: Math.max(1, Math.floor(Number(lim.n ?? 10)) || 10) };
        }
        if (input.presentation && typeof input.presentation === 'object') d.presentation = { ...d.presentation, ...input.presentation };
        if (input.export && typeof input.export === 'object') d.export = { ...d.export, ...input.export };
        return { definition: errors.length ? null : d, errors };
      }

      const TEXT_OK_OPS = new Set(['eq', 'neq', 'contains', 'notContains', 'isEmpty', 'notEmpty']);

      function parseUserValue(col, text) {
        const s = String(text ?? '').trim();
        if (s === '') return null;
        switch (col.type) {
          case 'integer':
          case 'decimal': {
            const n = parseNumber(s);
            return n === null ? null : { value: n, hasTime: false };
          }
          case 'percentage': {
            const n = parsePercent(s);
            return n === null ? null : { value: n, hasTime: false };
          }
          case 'duration': {
            const n = parseDuration(s, col.durationTwoPart) ?? parseNumber(s);
            return n === null ? null : { value: n, hasTime: false };
          }
          case 'time': {
            const n = parseClock(s);
            return n === null ? null : { value: n, hasTime: false };
          }
          case 'date':
          case 'datetime': {
            const r = parseDate(s, /^\d{4}/.test(s) ? 'YMD' : col.dateOrder);
            return r ? { value: r.ms, hasTime: r.hasTime } : null;
          }
          case 'boolean': {
            const b = parseBool(s);
            return b === null ? null : { value: b, hasTime: false };
          }
          default:
            return { value: s, hasTime: false };
        }
      }

      function compileCondition(ds, cond) {
        const col = resolveColumn(ds, cond.field);
        if (!col) return { error: `The column "${cond.field}" does not exist in this dataset.` };
        const op = cond.op;
        if (!OPERATORS[op]) return { error: `"${op}" is not a known filter operator.` };
        const raw = (i) => ds.rows[i][col.index];
        if (op === 'isEmpty') return { col, test: (i) => isBlank(raw(i)) };
        if (op === 'notEmpty') return { col, test: (i) => !isBlank(raw(i)) };
        const typed = getTyped(ds, col);
        const label = `${col.label} ${OPERATORS[op].label}`;

        if (op === 'contains' || op === 'notContains') {
          const needle = String(cond.value ?? '').trim().toLowerCase();
          if (needle === '') return { error: `Filter "${label}" needs some text to look for.` };
          const has = (i) => String(raw(i)).toLowerCase().includes(needle);
          return { col, test: op === 'contains' ? has : (i) => !has(i) };
        }
        if (TEXT_TYPES.has(col.type)) {
          if (!TEXT_OK_OPS.has(op)) {
            return { error: `"${label}" cannot be used because "${col.label}" holds text.\nUse "equals", "contains" or "is empty" instead.` };
          }
          const needle = String(cond.value ?? '').trim().toLowerCase();
          if (needle === '') return { error: `Filter "${label}" needs a value to compare with.` };
          const needles = [needle, ...(Array.isArray(cond.alsoMatch) ? cond.alsoMatch.map((v) => String(v).trim().toLowerCase()) : [])];
          const eq = (i) => typed[i] !== null && needles.includes(String(typed[i]).toLowerCase());
          return { col, test: op === 'eq' ? eq : (i) => !eq(i) };
        }
        if (col.type === 'boolean') {
          if (op !== 'eq' && op !== 'neq') return { error: `"${label}" cannot be used on a yes/no column.` };
          const u = parseUserValue(col, cond.value);
          if (!u) return { error: `"${cond.value}" is not a yes/no value for "${col.label}".` };
          return { col, test: op === 'eq' ? (i) => typed[i] === u.value : (i) => typed[i] !== u.value };
        }
        if ((op === 'before' || op === 'after') && !DATE_TYPES.has(col.type)) {
          return { error: `"${label}" only works on date columns, but "${col.label}" is ${TYPE_LABELS[col.type].toLowerCase()}.` };
        }
        const u1 = parseUserValue(col, cond.value);
        if (!u1) return { error: `"${cond.value ?? ''}" is not a valid ${TYPE_LABELS[col.type].toLowerCase()} value for "${col.label}".` };
        const isDate = DATE_TYPES.has(col.type);
        const lo = u1.value;
        const loEnd = isDate && !u1.hasTime ? lo + DAY - 1 : lo;
        switch (op) {
          case 'eq':
            return { col, test: isDate && !u1.hasTime ? (i) => typed[i] !== null && typed[i] >= lo && typed[i] <= loEnd : (i) => typed[i] === lo };
          case 'neq':
            return { col, test: isDate && !u1.hasTime ? (i) => !(typed[i] !== null && typed[i] >= lo && typed[i] <= loEnd) : (i) => typed[i] !== lo };
          case 'gt':
          case 'after':
            return { col, test: (i) => typed[i] !== null && typed[i] > loEnd };
          case 'gte':
            return { col, test: (i) => typed[i] !== null && typed[i] >= lo };
          case 'lt':
          case 'before':
            return { col, test: (i) => typed[i] !== null && typed[i] < lo };
          case 'lte':
            return { col, test: (i) => typed[i] !== null && typed[i] <= loEnd };
          case 'between': {
            const u2 = parseUserValue(col, cond.value2);
            if (!u2) return { error: `The second value "${cond.value2 ?? ''}" of "${label}" is missing or invalid.` };
            const hi = isDate && !u2.hasTime ? u2.value + DAY - 1 : u2.value;
            if (lo > hi) return { error: `"${label}" has its start (${cond.value}) after its end (${cond.value2}).` };
            return { col, test: (i) => typed[i] !== null && typed[i] >= lo && typed[i] <= hi };
          }
          default:
            return { error: `Unsupported operator "${op}".` };
        }
      }

      function describeCondition(ds, c) {
        const col = resolveColumn(ds, c.field);
        const name = col?.label ?? c.field;
        const op = OPERATORS[c.op]?.label ?? c.op;
        if (OPERATORS[c.op]?.needs === 0) return `${name} ${op}`;
        if (c.op === 'between') return `${name} ${op} ${c.value} and ${c.value2}`;
        return `${name} ${op} ${[c.value, ...(c.alsoMatch ?? [])].join(' or ')}`;
      }

      const collator = new Intl.Collator('en', { numeric: true, sensitivity: 'base' });

      function bucketDate(ms, bucket) {
        const d = new Date(ms);
        const y = d.getUTCFullYear();
        const m = d.getUTCMonth();
        switch (bucket) {
          case 'week': {
            const dow = (d.getUTCDay() + 6) % 7;
            const start = Date.UTC(y, m, d.getUTCDate() - dow);
            return { label: `Week of ${isoDate(start)}`, sort: start, raw: start };
          }
          case 'month':
            return { label: `${MONTH_ABBR[m]} ${y}`, sort: Date.UTC(y, m, 1), raw: null };
          case 'quarter':
            return { label: `${y}-Q${Math.floor(m / 3) + 1}`, sort: Date.UTC(y, Math.floor(m / 3) * 3, 1), raw: null };
          case 'year':
            return { label: String(y), sort: Date.UTC(y, 0, 1), raw: null };
          default: {
            const start = floorDay(ms);
            return { label: isoDate(start), sort: start, raw: start };
          }
        }
      }

      // Start of the period that follows a given period start (used to notice skipped periods).
      function nextBucketStart(ms, bucket) {
        const d = new Date(ms);
        const y = d.getUTCFullYear();
        const m = d.getUTCMonth();
        switch (bucket) {
          case 'week': return ms + 7 * DAY;
          case 'month': return Date.UTC(y, m + 1, 1);
          case 'quarter': return Date.UTC(y, m + 3, 1);
          case 'year': return Date.UTC(y + 1, 0, 1);
          default: return ms + DAY;
        }
      }

      const BLANK_LABEL = '(blank)';

      const nfCache = new Map();
      const nf = (dec) => {
        if (!nfCache.has(dec)) nfCache.set(dec, new Intl.NumberFormat('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }));
        return nfCache.get(dec);
      };

      // The difference between two percentages is a number of percentage points, not a percent.
      function formatDelta(v, fmt = {}) {
        if (fmt.kind === 'percent') return `${formatValue(v, { kind: 'decimal', decimals: fmt.decimals ?? 1 })} percentage points`;
        return formatValue(v, fmt);
      }

      function formatValue(v, fmt = {}) {
        if (v === null || v === undefined || (typeof v === 'number' && !Number.isFinite(v))) return '';
        if (typeof v === 'boolean') return v ? 'Yes' : 'No';
        if (typeof v === 'string') return v;
        switch (fmt.kind) {
          case 'integer':
            return nf(0).format(Math.round(v));
          case 'decimal':
            return nf(fmt.decimals ?? 2).format(v);
          case 'percent':
            return `${nf(fmt.decimals ?? 1).format(v)}%`;
          case 'duration':
          case 'time':
            return formatDuration(v);
          case 'date':
            return isoDate(v);
          case 'datetime':
            return isoDateTime(v);
          default:
            return Number.isInteger(v) ? nf(0).format(v) : nf(2).format(v);
        }
      }

      const PERCENT_TYPES = new Set(['percentage', 'percentOfTotal', 'variance', 'achievement', 'percentChange', 'periodChange']);
      const COUNT_TYPES = new Set(['recordCount', 'count', 'distinctCount', 'uniqueCount']);

      function defaultFormatKind(type, col, aKind) {
        if (COUNT_TYPES.has(type)) return 'integer';
        if (PERCENT_TYPES.has(type)) return 'percent';
        if (type === 'difference') return aKind ?? 'decimal';
        const t = col?.type;
        if (t === 'percentage') return 'percent';
        if (t === 'duration') return 'duration';
        if (t === 'time') return 'time';
        if (t === 'date') return 'date';
        if (t === 'datetime') return 'datetime';
        if (t === 'integer' && ['sum', 'min', 'max'].includes(type)) return 'integer';
        return 'decimal';
      }

      const BASE_NEEDS = {
        none: () => null,
        any: () => null,
        optional: () => null,
        numeric: (c) => (NUMERIC_TYPES.has(c.type) ? null : 'a numeric column (number, percentage or duration)'),
        optionalNumeric: (c) => (NUMERIC_TYPES.has(c.type) ? null : 'a numeric column'),
        ordered: (c) => (ORDERED_TYPES.has(c.type) ? null : 'a number, duration, time or date column'),
      };

      function validateDefinition(ds, def) {
        const errors = [];
        const warnings = [];
        const err = (title, message) => errors.push({ title, message });
        const missing = new Set();

        if (!def.calculations.length) err('No calculations yet', 'A report needs at least one calculation (for example "Count of records" or "Average score").');

        for (const g of def.groupBy) {
          const col = resolveColumn(ds, g.field);
          if (!col) missing.add(g.field);
          else if (g.bucket && !DATE_BUCKETS[g.bucket]) err('Unknown date grouping', `"${g.bucket}" is not a valid grouping for "${col.label}".`);
        }
        const ids = new Set();
        def.calculations.forEach((c, idx) => {
          const meta = CALC_TYPES[c.type];
          const name = c.name || c.id;
          if (!meta) return err(`"${name}" has an unknown calculation type`, `"${c.type}" is not supported.`);
          if (ids.has(c.id)) err('Two calculations share the same ID', `ID "${c.id}" is used twice.`);
          ids.add(c.id);
          if (meta.derived) {
            const earlier = new Set(def.calculations.slice(0, idx).map((x) => x.id));
            if (!c.a || !earlier.has(c.a)) err(`"${name}" needs a calculation to compare`, 'Pick the first value (A) from a calculation listed ABOVE this one.');
            if (c.type !== 'periodChange') {
              const b = c.b;
              const isConst = b && typeof b === 'object' && Object.hasOwn(b, 'value');
              const isCalc = b && typeof b === 'object' && b.calc;
              if (!isConst && !isCalc) err(`"${name}" needs a second value`, 'Pick the second value (B / target).');
              else if (isCalc && !earlier.has(b.calc)) err(`"${name}" refers to a calculation that is not above it`, 'Move the calculation it depends on above this one.');
              else if (isConst && !Number.isFinite(Number(b.value))) err(`"${name}" has a target that is not a number`, `"${b.value}" cannot be used.`);
            }
            return;
          }
          const needs = meta.field;
          if (needs !== 'none' && needs !== 'optional' && !c.field) {
            err(`"${name}" needs a column`, `Choose which column "${meta.label}" should be calculated on.`);
          }
          if (c.field) {
            const col = resolveColumn(ds, c.field);
            if (!col) missing.add(c.field);
            else {
              const problem = BASE_NEEDS[needs]?.(col);
              if (problem) {
                const typedCol = col.type === 'identifier' ? getTyped(ds, col) : null;
                const looksNumeric = typedCol && typedCol.length > 0 && typedCol.every((v) => v === null || v === undefined || (typeof v === 'string' && /^[+-]?\d+(\.\d+)?$/.test(v.trim())));
                const extra = looksNumeric ? `\nEvery value in "${col.label}" is all numbers, but it was read as an ID because nearly every value is different. If it is really a quantity, open Data Health, change its type to Number, and run the report again.` : '';
                const alt = col.detected?.alt;
                const mostlyNumber = !looksNumeric && alt && ['integer', 'decimal', 'percentage', 'duration'].includes(alt.type) && col.type === col.detected.type;
                const extra2 = mostlyNumber ? `\n${Math.round(alt.ratio * 100)}% of the values in "${col.label}" look like numbers, but the rest do not, so it was read as ${TYPE_LABELS[col.type].toLowerCase()} instead.\nIf the others are just errors, open Data Health and change its type to ${TYPE_LABELS[alt.type]}. Unreadable cells will then be skipped and listed in a note, never counted as zero.` : '';
                err(`"${name}" cannot use "${col.label}"`, `${meta.label} needs ${problem}, but "${col.label}" is ${TYPE_LABELS[col.type].toLowerCase()}.${extra}${extra2}${col.type === 'time' ? `\nValues like 2:30 were read as a time of day, but they could also be a length of time (2 hours 30 minutes).\nIf "${col.label}" is a length, open Data Health, change its type to Duration, and check the Duration format (hours:minutes or minutes:seconds). The app does not guess for you.` : ''}`);
              }
              else if (c.type === 'average' && col.type === 'percentage') {
                warnings.push({ title: `"${name}" averages a percentage column`, message: `This is a simple mean of the row values in "${col.label}". If each row represents a different volume, use "Weighted average" or "Percentage meeting a condition" instead.` });
              }
            }
          }
          if (meta.weight) {
            const wc = resolveColumn(ds, c.weightField);
            if (!c.weightField) err(`"${name}" needs a weight column`, 'Choose the column that says how much each row counts.');
            else if (!wc) missing.add(c.weightField);
            else if (!NUMERIC_TYPES.has(wc.type)) err(`"${name}" cannot weight by "${wc.label}"`, 'The weight column must be numeric.');
          }
          if (meta.condition === 'required' && !c.condition) {
            err(`"${name}" needs a condition`, 'Describe which rows count, for example "Score is greater than or equal to 4".');
          }
          if (c.condition && (!c.condition.field || !c.condition.op)) {
            err(`The condition of "${name}" is not finished`, 'Choose a column and a rule, or remove the condition.');
          } else if (c.condition) {
            const r = compileCondition(ds, c.condition);
            if (r.error) {
              if (!resolveColumn(ds, c.condition.field)) missing.add(c.condition.field);
              else err(`The condition of "${name}" is not valid`, r.error);
            }
          }
        });
        def.filters.conditions.forEach((c, i) => {
          if (!c.field || !c.op) return err(`Filter ${i + 1} is not finished`, 'Choose a column and a condition, or remove this filter.');
          const r = compileCondition(ds, c);
          if (r.error) {
            if (!resolveColumn(ds, c.field)) missing.add(c.field);
            else err('A filter is not valid', r.error);
          }
        });
        if (def.ranking.by && !def.calculations.some((c) => c.id === def.ranking.by)) {
          err('Ranking refers to a calculation that does not exist', 'Choose a metric from your calculations.');
        }
        if (missing.size) {
          errors.unshift({
            title: `${missing.size} column(s) from this report were not found in the dataset`,
            message: `Missing: ${[...missing].map((m) => `"${m}"`).join(', ')}. Choose the matching columns from the dropdowns.`,
          });
        }
        return { errors, warnings };
      }

      function rollup(type, partials) {
        const sum = (k) => partials.reduce((s, p) => s + (p[k] ?? 0), 0);
        switch (type) {
          case 'recordCount':
          case 'count':
          case 'sum':
            return { value: sum('sum') };
          case 'average': {
            const n = sum('n');
            return { value: n ? sum('sum') / n : null };
          }
          case 'percentage': {
            const den = sum('den');
            return { value: den ? (100 * sum('num')) / den : null };
          }
          case 'weightedAverage': {
            const w = sum('sumW');
            return { value: w ? sum('sumVW') / w : null };
          }
          case 'min': {
            const v = partials.map((p) => p.min).filter((x) => x != null);
            return { value: v.length ? Math.min(...v) : null };
          }
          case 'max': {
            const v = partials.map((p) => p.max).filter((x) => x != null);
            return { value: v.length ? Math.max(...v) : null };
          }
          default:
            return { value: null, error: `"${type}" cannot be combined from group results; it must be recalculated from the original rows.` };
        }
      }

      function prepareCalc(ds, c) {
        const col = c.field ? resolveColumn(ds, c.field) : null;
        const wcol = c.weightField ? resolveColumn(ds, c.weightField) : null;
        const cond = c.condition ? compileCondition(ds, c.condition).test : null;
        return {
          def: c,
          col,
          typed: col ? getTyped(ds, col) : null,
          raw: col ? (i) => ds.rows[i][col.index] : null,
          wcol,
          wtyped: wcol ? getTyped(ds, wcol) : null,
          wraw: wcol ? (i) => ds.rows[i][wcol.index] : null,
          cond,
        };
      }

      function evalBase(p, idxs, overall) {
        const { def, typed, raw } = p;
        const out = { value: null, details: {}, skipped: 0, blanks: 0, examples: [], divZero: false };
        const noteSkip = (i, text) => {
          out.skipped++;
          if (out.examples.length < 3) out.examples.push(String(text ?? raw(i)).trim());
        };
        const rows = p.cond && def.type !== 'percentage' ? idxs.filter(p.cond) : idxs;

        switch (def.type) {
          case 'recordCount':
            out.value = rows.length;
            out.details = { sum: rows.length };
            return out;
          case 'count': {
            let n = 0;
            for (const i of rows) if (!isBlank(raw(i))) n++;
            out.value = n;
            out.details = { sum: n };
            return out;
          }
          case 'distinctCount':
          case 'uniqueCount': {
            const counts = new Map();
            for (const i of rows) {
              const v = typed[i];
              if (v !== null) counts.set(v, (counts.get(v) ?? 0) + 1);
            }
            out.value = def.type === 'distinctCount' ? counts.size : [...counts.values()].filter((c) => c === 1).length;
            return out;
          }
          case 'sum':
          case 'average':
          case 'median':
          case 'min':
          case 'max': {
            const vals = [];
            for (const i of rows) {
              const v = typed[i];
              if (v === null) {
                if (!isBlank(raw(i))) noteSkip(i); else out.blanks++;
              } else vals.push(v);
            }
            if (def.type === 'sum') {
              const s = vals.reduce((a, b) => a + b, 0);
              out.value = s;
              out.details = { sum: s, n: vals.length };
            } else if (vals.length === 0) {
              out.value = null;
            } else if (def.type === 'average') {
              const s = vals.reduce((a, b) => a + b, 0);
              out.value = s / vals.length;
              out.details = { sum: s, n: vals.length };
            } else if (def.type === 'median') {
              const sorted = [...vals].sort((a, b) => a - b);
              const mid = Math.floor(sorted.length / 2);
              out.value = sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
            } else if (def.type === 'min') {
              out.value = vals.reduce((a, b) => (b < a ? b : a));
              out.details = { min: out.value };
            } else {
              out.value = vals.reduce((a, b) => (b > a ? b : a));
              out.details = { max: out.value };
            }
            return out;
          }
          case 'weightedAverage': {
            let sumVW = 0;
            let sumW = 0;
            for (const i of rows) {
              const v = typed[i];
              const w = p.wtyped[i];
              if (v === null || w === null) {
                if (v === null && !isBlank(raw(i))) noteSkip(i);
                else if (v === null) out.blanks++;
                else if (w === null && !isBlank(p.wraw(i))) noteSkip(i, p.wraw(i));
                else out.blanks++;
                continue;
              }
              sumVW += v * w;
              sumW += w;
            }
            out.details = { sumVW, sumW };
            if (sumW === 0) {
              out.divZero = rows.length > 0;
              out.value = null;
            } else out.value = sumVW / sumW;
            return out;
          }
          case 'percentage': {
            const den = typed ? idxs.filter((i) => typed[i] !== null) : idxs;
            if (typed) for (const i of idxs) if (typed[i] === null) { if (!isBlank(raw(i))) noteSkip(i); else out.blanks++; }
            const num = den.filter(p.cond).length;
            out.details = { num, den: den.length };
            if (den.length === 0) {
              out.divZero = idxs.length > 0;
              out.value = null;
            } else out.value = (100 * num) / den.length;
            return out;
          }
          case 'percentOfTotal': {
            const sumOf = (list) => {
              if (!typed) return list.length;
              let s = 0;
              for (const i of list) if (typed[i] !== null) s += typed[i];
              return s;
            };
            const part = sumOf(rows);
            const total = overall.get(def.id) ?? sumOf(p.cond ? overall.rows.filter(p.cond) : overall.rows);
            overall.set(def.id, total);
            out.details = { part, total };
            if (total === 0) {
              out.divZero = true;
              out.value = null;
            } else out.value = (100 * part) / total;
            return out;
          }
          default:
            return out;
        }
      }

      function evalDerived(def, values, prevValues) {
        const a = values[def.a];
        if (def.type === 'periodChange') {
          const prev = prevValues ? prevValues[def.a] : null;
          if (a === null || a === undefined || prev === null || prev === undefined) return { value: null, divZero: false };
          if (prev === 0) return { value: null, divZero: true };
          return { value: ((a - prev) / Math.abs(prev)) * 100, divZero: false };
        }
        const bRaw = def.b && typeof def.b === 'object' && def.b.calc ? values[def.b.calc] : Number(def.b?.value);
        const b = bRaw ?? null;
        if (a === null || a === undefined || b === null || !Number.isFinite(b)) return { value: null, divZero: false };
        switch (def.type) {
          case 'difference':
            return { value: a - b, divZero: false };
          case 'variance':
          case 'percentChange':
            return b === 0 ? { value: null, divZero: true } : { value: ((a - b) / Math.abs(b)) * 100, divZero: false };
          case 'achievement':
            return b === 0 ? { value: null, divZero: true } : { value: (a / b) * 100, divZero: false };
          default:
            return { value: null, divZero: false };
        }
      }

      function runReport(ds, definitionInput) {
        const norm = normalizeDefinition(definitionInput);
        if (!norm.definition) return { ok: false, errors: norm.errors.map((m) => ({ title: 'The report definition is not valid', message: m })), warnings: [] };
        const def = norm.definition;
        const check = validateDefinition(ds, def);
        if (check.errors.length) return { ok: false, errors: check.errors, warnings: check.warnings };
        const warnings = [...check.warnings];
        const warn = (title, message) => warnings.push({ title, message });

        const conds = def.filters.conditions.map((c) => compileCondition(ds, c));
        const tests = conds.map((c) => c.test);
        const all = [];
        for (let i = 0; i < ds.rows.length; i++) {
          if (ds.excluded.has(i)) continue;
          all.push(i);
        }
        const filtered = tests.length === 0 ? all : all.filter((i) => (def.filters.logic === 'OR' ? tests.some((t) => t(i)) : tests.every((t) => t(i))));
        if (ds.rows.length === 0) warn('The dataset has no records', 'The file contains a header but no data rows.');
        else if (filtered.length === 0) {
          warn('No records match the filters', `0 of ${all.length} records passed your filters.`);
        }

        const gcols = def.groupBy.map((g) => {
          const col = resolveColumn(ds, g.field);
          const isDate = DATE_TYPES.has(col.type);
          const bucket = isDate ? g.bucket ?? 'day' : null;
          return { col, bucket, typed: getTyped(ds, col), label: isDate ? `${col.label} (${DATE_BUCKETS[bucket].replace(/ \(.*\)/, '')})` : col.label };
        });
        const g_numeric = (gc, s) => (!gc.bucket && gc.col.type !== 'boolean' ? s : null);
        const groups = new Map();
        let blankGroupRows = 0;
        const overallRows = filtered;
        if (gcols.length === 0) {
          groups.set('', { labels: [], sorts: [], raws: [], idxs: overallRows.slice() });
        } else {
          for (const i of filtered) {
            const labels = [];
            const sorts = [];
            const raws = [];
            let blank = false;
            for (const g of gcols) {
              const v = g.typed[i];
              if (v === null || v === undefined) {
                labels.push(BLANK_LABEL);
                sorts.push(null);
                raws.push(null);
                blank = true;
              } else if (g.bucket) {
                const b = bucketDate(v, g.bucket);
                labels.push(b.label);
                sorts.push(b.sort);
                raws.push(b.raw);
              } else if (typeof v === 'number') {
                labels.push(formatValue(v, { kind: g.col.type === 'duration' ? 'duration' : g.col.type === 'percentage' ? 'percent' : 'auto' }));
                sorts.push(v);
                raws.push(null);
              } else if (typeof v === 'boolean') {
                labels.push(v ? 'Yes' : 'No');
                sorts.push(v ? 1 : 0);
                raws.push(null);
              } else {
                labels.push(v);
                sorts.push(v);
                raws.push(null);
              }
            }
            if (blank) blankGroupRows++;
            // Numbers are keyed by their exact value, because their printed label can round different values to the same text.
            const key = labels.map((l, k) => (typeof g_numeric(gcols[k], sorts[k]) === 'number' ? `#${sorts[k]}` : l)).join('\u0001');
            let g = groups.get(key);
            if (!g) groups.set(key, (g = { labels, sorts, raws, idxs: [] }));
            g.idxs.push(i);
          }
        }
        {
          const byLabel = new Map();
          for (const g of groups.values()) {
            const k = g.labels.join('\u0001');
            byLabel.set(k, (byLabel.get(k) ?? 0) + 1);
          }
          const same = [...byLabel.entries()].filter(([, n]) => n > 1).map(([k]) => k.split('\u0001').join(' / '));
          if (same.length) {
            warn('Some different values look the same on the report', `These labels each stand for more than one distinct value, because the number display rounds them: ${same.slice(0, 3).join(', ')}${same.length > 3 ? ', …' : ''}.\nThey are kept as separate rows, not merged.`);
          }
        }
        if (blankGroupRows > 0) {
          const names = gcols.map((g) => `"${g.col.label}"`).join(', ');
          warn(`${blankGroupRows} record(s) have no usable value to group by`, `They have an empty or unreadable value in ${names}, so they are listed under "${BLANK_LABEL}".`);
        }

        // Problems that Data Health already knows about must also be visible on the report itself. Nothing is changed here.
        {
          const seenRows = new Set();
          let copies = 0;
          for (const i of filtered) {
            const k = ds.rows[i].join('\u0001');
            if (seenRows.has(k)) copies++; else seenRows.add(k);
          }
          if (copies > 0) {
            warn(`${copies} record(s) in this report are exact copies of another record`, 'They are counted like any other record, so totals may be inflated if they are mistakes. They could also be genuine repeats. Nothing was removed; use the Data Health tab to exclude the copies or keep them.');
          }
          gcols.forEach((g, gi) => {
            if (g.bucket || !TEXT_TYPES.has(g.col.type)) return;
            const families = new Map();
            for (const grp of groups.values()) {
              const label = grp.labels[gi];
              if (typeof label !== 'string' || label === BLANK_LABEL) continue;
              const key = label.trim().replace(/\s+/g, ' ').toLowerCase();
              if (!families.has(key)) families.set(key, []);
              families.get(key).push(label);
            }
            const variants = [...families.values()].filter((list) => list.length > 1);
            if (variants.length) {
              warn(`"${g.col.label}" has values spelled in different ways`, `${variants.slice(0, 4).map((list) => list.map((v) => `"${v}"`).join(', ')).join('\n')}\nThey look like the same thing but are shown as separate groups. Nothing was merged; use the Data Health tab to merge them or keep them separate.`);
            }
            // Words that usually mean "no real value". They are still grouped as written; the person decides what they mean.
            const PLACEHOLDER = /^(n\/?a|#n\/a|na|none|null|nil|unknown|unspecified|tbd|tba|-+|\?+)$/i;
            const holders = [...groups.values()].filter((grp) => typeof grp.labels[gi] === 'string' && PLACEHOLDER.test(grp.labels[gi].trim()));
            if (holders.length) {
              warn(`"${g.col.label}" contains placeholder values that are counted as groups`, `${holders.slice(0, 4).map((grp) => `"${grp.labels[gi]}" (${grp.idxs.length} record${grp.idxs.length === 1 ? '' : 's'})`).join(', ')}${holders.length > 4 ? ', …' : ''}\nThese words usually mean "no real value", but they are listed as groups like any other and are included in totals. Nothing was changed; use filters if you want them left out.`);
            }
          });
        }

        // Dates such as 04/03/2026 can mean two different days; say so on the report until the user has chosen an order.
        {
          const used = new Set();
          gcols.forEach((g) => used.add(g.col));
          const addByName = (name) => { const c = name ? resolveColumn(ds, name) : null; if (c) used.add(c); };
          def.filters.conditions.forEach((c) => addByName(c.field));
          def.calculations.forEach((c) => { addByName(c.field); addByName(c.condition?.field); });
          for (const col of used) {
            if (!DATE_TYPES.has(col.type) || !col.detected?.ambiguousDate || col.dateOrderConfirmed) continue;
            const examples = [];
            for (let i = 0; i < ds.rows.length && examples.length < 3; i++) {
              if (ds.excluded.has(i)) continue;
              const m = /^\s*(\d{1,2})[/.-](\d{1,2})[/.-]\d{2,4}/.exec(String(ds.rows[i][col.index] ?? ''));
              if (m && +m[1] <= 12 && +m[2] <= 12 && m[1] !== m[2]) examples.push(String(ds.rows[i][col.index]).trim());
            }
            const reading = col.dateOrder === 'DMY' ? 'day/month/year' : 'month/day/year';
            warn(`Dates in "${col.label}" could be read two ways`, `Values like ${examples.map((e) => `"${e}"`).join(', ')} can mean two different days, and nothing in the file settles which.\nThis report read them as ${reading}.\nIf that is wrong, choose the correct "Date order" for this column in Column Types and run the report again.`);
          }
        }

        // A plain number in a duration column (no colon, no h/m/s) is read as SECONDS. Say so instead of doing it quietly.
        {
          const used = new Set();
          gcols.forEach((g) => used.add(g.col));
          const addByName = (name) => { const c = name ? resolveColumn(ds, name) : null; if (c) used.add(c); };
          def.filters.conditions.forEach((c) => addByName(c.field));
          def.calculations.forEach((c) => { addByName(c.field); addByName(c.condition?.field); addByName(c.weightField); });
          for (const col of used) {
            if (col.type !== 'duration') continue;
            const bare = [];
            for (let i = 0; i < ds.rows.length; i++) {
              if (ds.excluded.has(i)) continue;
              const raw = ds.rows[i][col.index];
              if (isBlank(raw)) continue;
              const s = String(raw).trim();
              if (ns.parseDuration(s, col.durationTwoPart) === null && ns.parseNumber(s) !== null) bare.push(s);
            }
            if (bare.length) {
              warn(`${bare.length} value(s) in "${col.label}" are plain numbers read as seconds`, `Values like ${[...new Set(bare)].slice(0, 3).map((v) => `"${v}"`).join(', ')} have no unit, so they were counted as seconds ("7.5" is 7.5 seconds, not 7.5 hours).\nIf they are hours or minutes, write them as H:MM in the source file (for example 7:30) and upload again.`);
            }
          }
        }

        const prepared = def.calculations.map((c) => (CALC_TYPES[c.type].derived ? { def: c, derived: true } : prepareCalc(ds, c)));
        const overallStore = new Map();
        overallStore.rows = overallRows;
        const skipTotals = new Map();
        const blankTotals = new Map();
        const divZeroCount = new Map();
        const examples = new Map();
        let counting = true;
        const note = (id, r) => {
          if (!counting) return;
          if (r.skipped) skipTotals.set(id, (skipTotals.get(id) ?? 0) + r.skipped);
          if (r.blanks) blankTotals.set(id, (blankTotals.get(id) ?? 0) + r.blanks);
          if (r.divZero) divZeroCount.set(id, (divZeroCount.get(id) ?? 0) + 1);
          for (const ex of r.examples ?? []) {
            const list = examples.get(id) ?? [];
            if (list.length < 3 && !list.includes(ex)) list.push(ex);
            examples.set(id, list);
          }
        };

        const entries = [...groups.values()];
        const computeRow = (idxs) => {
          const values = {};
          const details = {};
          for (const p of prepared) {
            if (p.derived) continue;
            const r = evalBase(p, idxs, overallStore);
            values[p.def.id] = r.value;
            details[p.def.id] = r.details;
            note(p.def.id, r);
          }
          return { values, details };
        };
        entries.forEach((g) => Object.assign(g, computeRow(g.idxs)));
        counting = false;
        const totalsRaw = gcols.length ? computeRow(overallRows) : null;
        counting = true;

        const cmp = (a, b) => {
          for (let k = 0; k < Math.max(a.length, b.length); k++) {
            const x = a[k];
            const y = b[k];
            if (x === y) continue;
            if (x === null) return 1;
            if (y === null) return -1;
            if (typeof x === 'number' && typeof y === 'number') return x - y;
            return collator.compare(String(x), String(y));
          }
          return 0;
        };
        entries.sort((a, b) => cmp(a.sorts, b.sorts));

        const ordering = entries;
        const applyDerived = (g, prev, count = true) => {
          for (const p of prepared) {
            if (!p.derived) continue;
            const r = evalDerived(p.def, g.values, prev?.values);
            g.values[p.def.id] = r.value;
            g.details[p.def.id] = {};
            if (r.divZero && count) divZeroCount.set(p.def.id, (divZeroCount.get(p.def.id) ?? 0) + 1);
          }
        };
        // "Previous row" must come from the same group. The comparison runs along the last date-bucketed grouping
        // (or the last grouping when none is a date); every other grouping level identifies who is being compared.
        let axis = gcols.length - 1;
        gcols.forEach((g, i) => { if (g.bucket) axis = i; });
        const lastInSameGroup = new Map();
        const gapNotes = [];
        const checkGaps = prepared.some((p) => p.def.type === 'periodChange') && gcols[axis]?.bucket && gcols[axis].bucket !== 'day';
        ordering.forEach((g) => {
          const who = g.labels.filter((_, i) => i !== axis).join('\u0001');
          const before = lastInSameGroup.get(who) ?? null;
          applyDerived(g, before);
          if (checkGaps && before && nextBucketStart(before.sorts[axis], gcols[axis].bucket) !== g.sorts[axis]) {
            const skipped = bucketDate(nextBucketStart(before.sorts[axis], gcols[axis].bucket), gcols[axis].bucket).label;
            gapNotes.push(`${g.labels[axis]} was compared with ${before.labels[axis]} because ${skipped} has no records${gcols.length > 1 ? ` (${g.labels.filter((_, i) => i !== axis).join(', ')})` : ''}.`);
          }
          lastInSameGroup.set(who, g);
        });
        if (gapNotes.length) {
          warn('Some periods have no records, so a change spans more than one period', `${gapNotes.slice(0, 3).join('\n')}${gapNotes.length > 3 ? `\n…and ${gapNotes.length - 3} more.` : ''}\nA change across a gap covers several periods, not one.`);
        }
        const totals = totalsRaw ?? (entries[0] ? { values: { ...entries[0].values }, details: { ...entries[0].details } } : { values: {}, details: {} });
        if (gcols.length) applyDerived(totals, null, false);
        for (const p of prepared) if (p.def.type === 'periodChange') totals.values[p.def.id] = null;

        for (const p of prepared) {
          const id = p.def.id;
          const name = p.def.name || id;
          if (skipTotals.get(id)) {
            // Blank cells are only mentioned when something else was skipped too, so ordinary gaps stay quiet.
            const nonNumeric = skipTotals.get(id);
            const blank = blankTotals.get(id) ?? 0;
            warn(`"${name}": ${nonNumeric + blank} non-numeric or blank value(s) were skipped`, `${nonNumeric} non-numeric and ${blank} blank.\nSkipped values are never counted as zero.`);
          }
          if (divZeroCount.get(id)) {
            warn(`"${name}": division by zero in ${divZeroCount.get(id)} row(s)`, 'Those cells are left empty instead of showing a made-up number.');
          }
        }
        if (ds.excluded.size > 0) warn(`${ds.excluded.size} record(s) excluded`, 'You excluded these rows in Data Health.');

        const rk = def.ranking;
        let rowsOut = ordering.map((g) => ({ g, rank: null }));
        let limitApplied = false;
        if (rk.by) {
          const dir = rk.direction === 'asc' ? 1 : -1;
          // Values are compared to 12 significant digits so 0.1+0.2 and 0.3 tie; the displayed numbers are not changed.
          const val = (g) => {
            const v = g.values[rk.by];
            return typeof v === 'number' && Number.isFinite(v) ? Number(v.toPrecision(12)) : v;
          };
          const sorted = rowsOut.slice().sort((a, b) => {
            const x = val(a.g);
            const y = val(b.g);
            if (x === null || x === undefined) return y === null || y === undefined ? 0 : 1;
            if (y === null || y === undefined) return -1;
            return x === y ? 0 : dir * (x - y);
          });
          const rankOf = (list) => {
            let rank = 0;
            let seen = 0;
            let prev;
            return list.map((r) => {
              const v = val(r.g);
              if (v === null || v === undefined) return null;
              seen++;
              if (prev === undefined || v !== prev) rank = rk.method === 'dense' ? rank + 1 : seen;
              prev = v;
              return rank;
            });
          };
          const ranks = rankOf(sorted);
          sorted.forEach((r, i) => (r.rank = ranks[i]));
          rowsOut = sorted;
          if (rk.limit.mode !== 'all') {
            const n = rk.limit.n;
            let keep;
            // 'top' always means the highest values and 'bottom' the lowest, whichever way the rows are displayed.
            // With highest-first order the highest values sit at the start of the list; with lowest-first they sit at the end.
            const selectFromStart = (rk.limit.mode === 'top') === (dir === -1);
            if (selectFromStart) keep = new Set(rowsOut.filter((r) => r.rank !== null && r.rank <= n).map((r) => r.g));
            else {
              const rev = rowsOut.slice().reverse();
              const revRanks = rankOf(rev);
              keep = new Set(rev.filter((_, i) => revRanks[i] !== null && revRanks[i] <= n).map((r) => r.g));
            }
            const before = rowsOut.length;
            const kept = rowsOut.filter((r) => keep.has(r.g));
            if (kept.length > n) {
              warn(`${rk.limit.mode === 'top' ? 'Top' : 'Bottom'} ${n} shows ${kept.length} rows because of ties`, 'Tied rows at the cutoff are all kept.');
            }
            if (kept.length < before) limitApplied = true;
            rowsOut = kept;
          }
        }

        const calcColumns = def.calculations.map((c) => {
          const meta = CALC_TYPES[c.type];
          const p = prepared.find((x) => x.def.id === c.id);
          let aKind = null;
          if (meta.derived) {
            const ac = def.calculations.find((x) => x.id === c.a);
            aKind = ac ? (ac.format?.kind && ac.format.kind !== 'auto' ? ac.format.kind : defaultFormatKind(ac.type, ac.field ? resolveColumn(ds, ac.field) : null, null)) : null;
          }
          const kind = c.format?.kind && c.format.kind !== 'auto' ? c.format.kind : defaultFormatKind(c.type, p.col, aKind);
          return { id: c.id, label: c.name || c.id, kind: 'calc', calcType: c.type, format: { kind, decimals: c.format?.decimals ?? (kind === 'decimal' ? 2 : 1) } };
        });
        const columns = [];
        if (rk.by) columns.push({ id: '__rank', label: 'Rank', kind: 'rank', format: { kind: 'integer' } });
        gcols.forEach((g, i) => columns.push({ id: `g${i}`, label: g.label, kind: 'group', format: { kind: 'text' }, bucket: g.bucket, colName: g.col.name }));
        if (gcols.length === 0) columns.push({ id: 'g0', label: 'Scope', kind: 'group', format: { kind: 'text' }, bucket: null, colName: null });
        columns.push(...calcColumns);
        const rows = rowsOut.map((r) => {
          const cells = [];
          if (rk.by) cells.push(r.rank);
          if (gcols.length === 0) cells.push('All records');
          else r.g.labels.forEach((l) => cells.push(l));
          def.calculations.forEach((c) => cells.push(r.g.values[c.id] ?? null));
          return cells;
        });
        const groupRaw = rowsOut.map((r) => r.g.raws);
        const details = rowsOut.map((r) => r.g.details);
        let totalsRow = null;
        if (gcols.length > 0) {
          totalsRow = [];
          if (rk.by) totalsRow.push(null);
          gcols.forEach((_, i) => totalsRow.push(i === 0 ? 'Overall' : ''));
          def.calculations.forEach((c) => totalsRow.push(totals.values[c.id] ?? null));
        }

        const dateCol = gcols.find((g) => DATE_TYPES.has(g.col.type))?.col ?? def.filters.conditions.map((c) => resolveColumn(ds, c.field)).find((c) => c && DATE_TYPES.has(c.type));
        let dateRange = null;
        if (dateCol) {
          const t = getTyped(ds, dateCol);
          let mn = Infinity;
          let mx = -Infinity;
          for (const i of filtered) {
            const v = t[i];
            if (v !== null) {
              if (v < mn) mn = v;
              if (v > mx) mx = v;
            }
          }
          dateRange = { field: dateCol.label, from: Number.isFinite(mn) ? isoDate(mn) : null, to: Number.isFinite(mx) ? isoDate(mx) : null };
        }
        const meta = {
          name: def.name,
          source: ds.filename,
          inputRows: ds.rows.length,
          excludedRows: ds.excluded.size,
          filteredRows: filtered.length,
          groupCount: gcols.length ? rowsOut.length : 1,
          groupBy: gcols.map((g) => g.label),
          filterSummary: def.filters.conditions.map((c) => describeCondition(ds, c)),
          filterLogic: def.filters.logic,
          ranking: rk.by ? { by: def.calculations.find((c) => c.id === rk.by)?.name ?? rk.by, direction: rk.direction, method: rk.method, limit: rk.limit } : null,
          limitApplied,
          dateRange,
          calculations: def.calculations.map((c) => ({
            id: c.id,
            name: c.name || c.id,
            type: c.type,
            typeLabel: CALC_TYPES[c.type].label,
            field: c.field ? resolveColumn(ds, c.field)?.label ?? c.field : null,
            weightField: c.weightField ? resolveColumn(ds, c.weightField)?.label ?? c.weightField : null,
            condition: c.condition ? describeCondition(ds, c.condition) : null,
            a: c.a ?? null,
            b: c.b ?? null,
          })),
        };
        const result = { ok: true, definition: def, columns, rows, groupRaw, totals: totalsRow, totalsValues: totals.values, warnings, meta, details, errors: [] };
        result.kpis = buildKpis(result);
        return result;
      }

      function buildKpis(result) {
        const { definition: def, columns, rows, meta } = result;
        const kpis = [{ id: 'records', label: 'Records used', value: meta.filteredRows, format: { kind: 'integer' }, note: meta.excludedRows ? `${meta.excludedRows} excluded` : null }];
        if (meta.groupBy.length) kpis.push({ id: 'groups', label: meta.groupBy.length > 1 ? 'Groups' : `${meta.groupBy[0]} groups`, value: rows.length, format: { kind: 'integer' } });
        const calcCols = columns.filter((c) => c.kind === 'calc');
        calcCols.forEach((c, idx) => {
          const v = result.totalsValues[c.id];
          kpis.push({ id: `calc:${c.id}`, label: meta.groupBy.length ? `Overall ${c.label}` : c.label, value: v ?? null, format: c.format, note: null, calcIndex: idx });
        });
        const rankCol = def.ranking.by ? calcCols.find((c) => c.id === def.ranking.by) : null;
        const metricCol = rankCol ?? (calcCols.length ? calcCols[0] : null);
        if (metricCol && meta.groupBy.length && rows.length > 0) {
          const ci = columns.findIndex((c) => c.id === metricCol.id);
          const gi = columns.findIndex((c) => c.kind === 'group');
          const cand = rows.map((r) => ({ name: columns.filter((c) => c.kind === 'group').map((c) => r[columns.indexOf(c)]).join(' / '), v: r[ci] })).filter((x) => x.v !== null && x.v !== undefined);
          if (cand.length > 1 && gi >= 0) {
            const best = cand.reduce((a, b) => (b.v > a.v ? b : a));
            const worst = cand.reduce((a, b) => (b.v < a.v ? b : a));
            kpis.push({ id: 'best', label: `Highest ${metricCol.label}`, value: best.v, format: metricCol.format, note: best.name });
            kpis.push({ id: 'worst', label: `Lowest ${metricCol.label}`, value: worst.v, format: metricCol.format, note: worst.name });
          }
        }
        return kpis;
      }
