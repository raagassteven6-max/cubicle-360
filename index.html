            { key: 'date', label: 'Date (for trends)', required: false, accepts: 'date', hints: ['date', 'day', 'week', 'month'] },
          ],
          build(ds, map) {
            const gCol = map.group ? resolveColumn(ds, map.group) : null;
            const oCol = map.output ? resolveColumn(ds, map.output) : null;
            const dCol = map.date ? resolveColumn(ds, map.date) : null;
            const calcs = [rc('records', 'Records', 'recordCount', { format: { kind: 'integer' } })];
            if (oCol) calcs.push(rc('totalOut', `Total ${oCol.label}`, 'sum', { field: oCol.name }));
            if (oCol) calcs.push(rc('avgOut', `Average ${oCol.label}`, 'average', { field: oCol.name, format: { kind: 'decimal', decimals: 2 } }));
            if (oCol) calcs.push(rc('shareOut', 'Share of total', 'percentOfTotal', { field: oCol.name, format: { kind: 'percent', decimals: 1 } }));
            const queries = [{ id: PRIMARY, name: 'Productivity summary', groupBy: gCol ? [{ field: gCol.name }] : [], calculations: calcs, ranking: { by: oCol ? 'totalOut' : 'records', direction: 'desc', method: 'competition', limit: { mode: 'all', n: 10 } } }];
            if (dCol) queries.push({ id: 'trend', name: 'Monthly trend', groupBy: [{ field: dCol.name, bucket: 'month' }], calculations: oCol ? [calcs[0], calcs[1]] : [calcs[0]] });
            return { queries, info: { metricLabel: oCol ? oCol.label : 'records' } };
          },
          visual: [
            { type: 'heading', text: 'Key Performance Indicators' },
            { type: 'kpi', items: [
              { label: 'Total {metric}', q: PRIMARY, calc: 'totalOut', total: true },
              { label: 'Average {metric}', q: PRIMARY, calc: 'avgOut', total: true },
              { label: 'Records', q: PRIMARY, calc: 'records', total: true },
              { label: 'Groups', fact: 'groups' },
            ] },
            { type: 'summary' },
            { type: 'heading', text: 'Output by Group' },
            { type: 'comparison', title: 'Total output: highest vs lowest', query: PRIMARY, calc: 'totalOut' },
            { type: 'leaderboard', title: 'Ranked by total output', query: PRIMARY, value: 'totalOut', limit: 10 },
            { type: 'table', title: 'Productivity details', query: PRIMARY, searchable: true, limit: 50 },
            { type: 'chart', chart: 'bar', title: 'Monthly output', query: 'trend', series: ['totalOut'], ifRole: 'date' },
            { type: 'chart', chart: 'line', title: 'Monthly record volume', query: 'trend', series: ['records'], ifRole: 'date', detail: true },
          ],
        },

        /* ============ 8. GENERAL KPI DASHBOARD ============ */
        't2-general-kpi': {
          id: 't2-general-kpi',
          name: 'General KPI Dashboard',
          category: 'General Reports',
          difficulty: 'Beginner',
          description: 'A flexible overview that works with almost any file: counts, totals and averages by any category.',
          produces: 'Record counts, totals and averages per group, a ranked table, and highest/lowest comparison.',
          previewColor: '#4C505B',
          roles: [
            { key: 'group', label: 'Category to summarize by (optional)', required: false, accepts: 'text', hints: ['team', 'department', 'category', 'status', 'agent', 'employee', 'name', 'type', 'group'] },
            { key: 'metric', label: 'Number to summarize (optional)', required: false, accepts: 'durationOrNumber', hints: ['score', 'amount', 'total', 'sales', 'count', 'qty', 'rating', 'duration', 'hours'] },
          ],
          build(ds, map) {
            const gCol = map.group ? resolveColumn(ds, map.group) : null;
            const mCol = map.metric ? resolveColumn(ds, map.metric) : null;
            const calcs = [rc('records', 'Record count', 'recordCount', { format: { kind: 'integer' } })];
            if (mCol) calcs.push(rc('sumVal', `Total ${mCol.label}`, 'sum', { field: mCol.name }));
            if (mCol) calcs.push(rc('avgVal', `Average ${mCol.label}`, 'average', { field: mCol.name, format: { kind: 'decimal', decimals: 2 } }));
            const queries = [{ id: PRIMARY, name: 'KPI summary', groupBy: gCol ? [{ field: gCol.name }] : [], calculations: calcs, ranking: { by: mCol ? 'sumVal' : 'records', direction: 'desc', method: 'competition', limit: { mode: 'all', n: 10 } } }];
            return { queries, info: { metricLabel: mCol ? mCol.label : 'records' } };
          },
          visual: [
            { type: 'heading', text: 'Key Performance Indicators' },
            { type: 'kpi', items: [
              { label: 'Record count', q: PRIMARY, calc: 'records', total: true },
              { label: 'Total {metric}', q: PRIMARY, calc: 'sumVal', total: true },
              { label: 'Average {metric}', q: PRIMARY, calc: 'avgVal', total: true },
              { label: 'Groups', fact: 'groups' },
            ] },
            { type: 'summary' },
            { type: 'heading', text: 'Breakdown' },
            { type: 'comparison', title: 'Highest vs lowest', query: PRIMARY, calc: 'sumVal' },
            { type: 'leaderboard', title: 'Ranked groups', query: PRIMARY, value: 'records', limit: 10 },
            { type: 'table', title: 'Details', query: PRIMARY, searchable: true, limit: 50 },
            { type: 'text', text: 'This general dashboard adapts to whatever columns you mapped. Add a numeric column in the setup step to unlock totals and averages.' },
          ],
        },
      };

      const T2_LEGACY_MAP = {
        monthly_csat: 't2-monthly-csat', agent_ranking: 't2-agent-performance', qa_performance: 't2-qa-performance',
        attendance_overview: 't2-attendance', leave_summary: 't2-leave-summary', sla_ticket_aging: 't2-sla',
        productivity_summary: 't2-productivity', general_kpi: 't2-general-kpi',
      };

      /* ---------------- execution: run every query through the existing calc engine ---------------- */
      function t2RunAll(ds, recipeId, mapping, opts = {}) {
        const recipe = T2_RECIPES[recipeId];
        if (!recipe) throw new Error(`Unknown template "${recipeId}".`);
        const built = recipe.build(ds, mapping, opts);
        const conds = [];
        const dCol = mapping.date ? resolveColumn(ds, mapping.date) : null;
        if (dCol && (opts.dateFrom || opts.dateTo)) {
          if (opts.dateFrom && opts.dateTo) conds.push({ field: dCol.name, op: 'between', value: opts.dateFrom, value2: opts.dateTo });
          else if (opts.dateFrom) conds.push({ field: dCol.name, op: 'gte', value: opts.dateFrom });
          else conds.push({ field: dCol.name, op: 'lte', value: opts.dateTo });
        }
        const rCol = opts.restrictRole && mapping[opts.restrictRole] ? resolveColumn(ds, mapping[opts.restrictRole]) : null;
        if (rCol && opts.restrictValue) conds.push({ field: rCol.name, op: 'eq', value: opts.restrictValue });
        const filters = conds.length ? { logic: 'AND', conditions: conds } : { logic: 'AND', conditions: [] };
        const results = {};
        for (const q of built.queries) {
          results[q.id] = runReport(ds, { name: q.name, groupBy: q.groupBy, calculations: q.calculations, filters, ranking: q.ranking });
        }
        // Assumptions made while building the report are shown with the other notes about the data behind it.
        for (const n of [...(built.info?.notices ?? []), ...(recipe.reconcile ? recipe.reconcile(results, built) : [])]) if (Array.isArray(results[PRIMARY]?.warnings)) results[PRIMARY].warnings.push(n);
        const available = {};
        for (const role of recipe.roles) available[role.key] = Boolean(mapping[role.key] && resolveColumn(ds, mapping[role.key]));
        return { recipe, info: built.info || {}, results, mapping, opts, ds, dsName: ds.filename, available };
      }

      /* ---------------- output accessors ---------------- */
      function t2Facts(t2) {
        const p = t2.results[PRIMARY];
        const groups = p?.meta?.groupBy?.length ? p.rows.length : 1;
        let period = null;
        const dCol = t2.mapping?.date ? resolveColumn(t2.ds, t2.mapping.date) : null;
        if (dCol) {
          const typed = getTyped(t2.ds, dCol);
          let mn = Infinity, mx = -Infinity;
          for (let i = 0; i < t2.ds.rows.length; i++) {
            if (t2.ds.excluded.has(i)) continue;
            const v = typed[i];
            if (v != null) { if (v < mn) mn = v; if (v > mx) mx = v; }
          }
          if (Number.isFinite(mn) && Number.isFinite(mx)) period = { field: dCol.label, from: isoDate(mn), to: isoDate(mx) };
        }
        return { groups, period };
      }
      function t2Val(t2, ref) {
        const res = t2.results[ref.q || PRIMARY];
        if (!res || !res.ok) return null;
        const col = res.columns.find((c) => c.id === ref.calc);
        if (!col) return null;
        return { value: ref.total ? res.totalsValues[ref.calc] ?? null : null, format: col.format, label: col.label };
      }
      function chartData(res, calcId, limit) {
        if (!res || !res.ok || !res.rows?.length) return null;
        const gi = res.columns.map((c, i) => (c.kind === 'group' ? i : -1)).filter((i) => i >= 0);
        let idxs = res.rows.map((_, i) => i);
        if (limit && idxs.length > limit) idxs = idxs.slice(0, limit);
        const ci = res.columns.findIndex((c) => c.id === calcId);
        if (ci < 0) return null;
        const col = res.columns[ci];
        return {
          fmt: col.format, label: col.label,
          pts: idxs.map((i) => ({ label: gi.map((k) => res.rows[i][k]).join(' / '), v: res.rows[i][ci] })).filter((p) => p.v !== null && p.v !== undefined && Number.isFinite(p.v)),
        };
      }

      /* ---------------- SVG charts ---------------- */
      function t2svg(data, kind) {
        if (!data || !data.pts.length) return '<p class="hint">No data available for this chart.</p>';
        const fmt = (v) => formatValue(v, data.fmt);
        const pts = data.pts;
        const short = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);
        const W = 760;
        if (kind === 'pie' || kind === 'donut') {
          const use = pts.filter((p) => p.v > 0);
          if (!use.length) return '<p class="hint">This chart needs positive values.</p>';
          const total = use.reduce((s, p) => s + p.v, 0);
          const cx = 165, cy = 150, R = 128, r0 = kind === 'donut' ? 68 : 0;
          let a = -Math.PI / 2;
          const slices = use.map((p, i) => {
            const frac = p.v / total;
            const a2 = a + frac * 2 * Math.PI;
            const large = frac > 0.5 ? 1 : 0;
            const pt = (ang, rad) => `${(cx + rad * Math.cos(ang)).toFixed(2)},${(cy + rad * Math.sin(ang)).toFixed(2)}`;
            const dpath = frac > 0.9999
              ? `M${cx - R},${cy} A${R},${R} 0 1 1 ${cx + R},${cy} A${R},${R} 0 1 1 ${cx - R},${cy}${r0 ? ` M${cx - r0},${cy} A${r0},${r0} 0 1 0 ${cx + r0},${cy} A${r0},${r0} 0 1 0 ${cx - r0},${cy}` : ''}Z`
              : `M${pt(a, R)} A${R},${R} 0 ${large} 1 ${pt(a2, R)} ${r0 ? `L${pt(a2, r0)} A${r0},${r0} 0 ${large} 0 ${pt(a, r0)}` : `L${cx},${cy}`} Z`;
            a = a2;
            return `<path d="${dpath}" fill="${COLORS[i % COLORS.length]}" fill-rule="evenodd" stroke="#17191D" stroke-width="1"><title>${esc(p.label)}: ${esc(fmt(p.v))}</title></path>`;
          });
          const legend = use.map((p, i) => `<g transform="translate(340,${26 + i * 22})"><rect width="12" height="12" y="-10" rx="2" fill="${COLORS[i % COLORS.length]}"/><text x="18" y="0" font-size="13" fill="#17191D">${esc(short(p.label, 30))} — ${esc(fmt(p.v))} (${((p.v / total) * 100).toFixed(1)}%)</text></g>`).join('');
          return `<svg viewBox="0 0 ${W} ${Math.max(300, 44 + use.length * 22)}" role="img">${slices.join('')}${legend}</svg>`;
        }
        const maxV = Math.max(0, ...pts.map((p) => p.v));
        const minV = Math.min(0, ...pts.map((p) => p.v));
        const span = maxV - minV || 1;
        const raw = span / 5;
        const pow = 10 ** Math.floor(Math.log10(raw));
        const fr = raw / pow;
        const step = (fr <= 1 ? 1 : fr <= 2 ? 2 : fr <= 5 ? 5 : 10) * pow;
        const top = Math.ceil(maxV / step) * step;
        const bot = Math.floor(minV / step) * step;
        const ticks = [];
        for (let t = bot; t <= top + step / 2; t += step) ticks.push(t);
        if (kind === 'hbar') {
          const rowH = 26, L = 190, H = 30 + pts.length * rowH + 30;
          const x = (v) => L + ((v - bot) / (top - bot || 1)) * (W - L - 70);
          return `<svg viewBox="0 0 ${W} ${H}" role="img">${ticks.map((t) => `<line x1="${x(t)}" x2="${x(t)}" y1="10" y2="${H - 28}" stroke="#E2DECF"/><text x="${x(t)}" y="${H - 12}" font-size="11" text-anchor="middle" fill="#4C505B">${esc(fmt(t))}</text>`).join('')}${pts.map((p, i) => `<text x="${L - 8}" y="${20 + i * rowH + 14}" font-size="12" text-anchor="end" fill="#17191D">${esc(short(p.label, 26))}</text><rect x="${Math.min(x(0), x(p.v))}" y="${20 + i * rowH}" width="${Math.abs(x(p.v) - x(0))}" height="${rowH - 8}" fill="${COLORS[0]}" stroke="#17191D" stroke-width="1.25" rx="2"><title>${esc(p.label)}: ${esc(fmt(p.v))}</title></rect><text x="${x(p.v) + (p.v >= 0 ? 5 : -5)}" y="${20 + i * rowH + 13}" font-size="11" text-anchor="${p.v >= 0 ? 'start' : 'end'}" fill="#17191D">${esc(fmt(p.v))}</text>`).join('')}</svg>`;
        }
        const H = 340, L = 64, B = 90, T = 16;
        const plotW = Math.max(W, L + pts.length * 40 + 20);
        const y = (v) => T + (1 - (v - bot) / (top - bot || 1)) * (H - T - B);
        const bw = (plotW - L - 20) / pts.length;
        const grid = ticks.map((t) => `<line x1="${L}" x2="${plotW - 10}" y1="${y(t)}" y2="${y(t)}" stroke="#E2DECF"/><text x="${L - 6}" y="${y(t) + 4}" font-size="11" text-anchor="end" fill="#4C505B">${esc(fmt(t))}</text>`).join('');
        const labels = pts.map((p, i) => `<text transform="translate(${L + bw * i + bw / 2},${H - B + 12}) rotate(-40)" font-size="11" text-anchor="end" fill="#17191D">${esc(short(p.label, 22))}</text>`).join('');
        if (kind === 'line') {
          const px = (i) => L + bw * i + bw / 2;
          const path = pts.map((p, i) => `${i ? 'L' : 'M'}${px(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
          return `<svg viewBox="0 0 ${plotW} ${H}" width="${plotW}" role="img">${grid}<path d="${path}" fill="none" stroke="#17191D" stroke-width="2.25" stroke-linejoin="round"/>${pts.map((p, i) => `<circle cx="${px(i)}" cy="${y(p.v)}" r="5" fill="${COLORS[0]}" stroke="#17191D" stroke-width="1.75"><title>${esc(p.label)}: ${esc(fmt(p.v))}</title></circle>`).join('')}${labels}</svg>`;
        }
        return `<svg viewBox="0 0 ${plotW} ${H}" width="${plotW}" role="img">${grid}${pts.map((p, i) => `<rect x="${L + bw * i + bw * 0.15}" y="${Math.min(y(p.v), y(0))}" width="${bw * 0.7}" height="${Math.abs(y(p.v) - y(0))}" fill="${COLORS[0]}" stroke="#17191D" stroke-width="1.25" rx="2"><title>${esc(p.label)}: ${esc(fmt(p.v))}</title></rect>`).join('')}<line x1="${L}" x2="${plotW - 10}" y1="${y(0)}" y2="${y(0)}" stroke="#4C505B"/>${labels}</svg>`;
      }

      /* ---------------- components ---------------- */
      function renderComp(c, idx, t2, st, ui) {
        const facts = t2._facts || (t2._facts = t2Facts(t2));
        const ph = (s) => String(s)
          .replaceAll('{name}', t2.recipe.name)
          .replaceAll('{file}', t2.dsName || '')
          .replaceAll('{metric}', t2.info?.metricLabel || 'metric')
          .replaceAll('{from}', facts.period?.from ?? '')
          .replaceAll('{to}', facts.period?.to ?? '');
        switch (c.type) {
          case 'heading':
            return `<h2>${esc(ph(c.text))}</h2>${c.sub ? `<p class="sub" style="margin:-2px 0 8px">${esc(ph(c.sub))}</p>` : ''}`;
          case 'text':
            return `<div class="card"><p style="margin:0">${esc(ph(c.text))}</p></div>`;
          case 'kpi': {
            const items = (c.items || []).map((it) => {
              let val = null, fmt = it.fmt ? { kind: it.fmt } : { kind: 'integer' };
              if (it.fact) {
                val = facts[it.fact];
              } else {
                const r = t2Val(t2, it);
                if (!r) return '';
                val = r.value;
                if (!it.fmt) fmt = r.format;
              }
              let cmp = '';
              if (it.compare) {
                const cd = chartData(t2.results[it.compare.q || 'trend'], it.compare.calc);
                if (cd && cd.pts.length >= 2) {
                  const b = cd.pts[cd.pts.length - 1].v, a = cd.pts[cd.pts.length - 2].v;
                  const d = b - a;
                  if (Number.isFinite(d) && d !== 0) {
                    const up = d > 0;
                    cmp = `<div class="nt" style="color:${up ? 'var(--ok)' : 'var(--err)'}">${up ? '▲' : '▼'} ${esc(ns.formatDelta(Math.abs(d), cd.fmt))} vs previous period</div>`;
                  }
                }
              }
              return `<div class="stat kpi"><div class="l">${esc(ph(it.label))}</div><div class="n">${val === null || val === undefined ? '—' : esc(formatValue(val, fmt))}</div>${cmp}</div>`;
            }).join('');
            return items ? `<div class="grid g4" style="margin-bottom:14px">${items}</div>` : '';
          }
          case 'chart': {
            const res = t2.results[c.query];
            if (!res || !res.ok) return '';
            let calcId = c.series[0];
            let switcher = '';
            const calcCols = res.columns.filter((x) => x.kind === 'calc');
            if (st.interactive && calcCols.length > 1) {
              const key = 'c' + idx;
              calcId = (ui.chart || {})[key] || calcId;
              switcher = `<select data-chg="t2chartmet" data-k="${key}" style="width:auto;margin-left:8px">${calcCols.map((x) => `<option value="${esc(x.id)}"${x.id === calcId ? ' selected' : ''}>${esc(x.label)}</option>`).join('')}</select>`;
            }
            const d = chartData(res, calcId, c.limit);
            return `<div class="card"><div class="row noprint" style="margin-bottom:6px"><h3 style="margin:0">${esc(ph(c.title || ''))}</h3>${switcher}</div><div class="chartbox">${t2svg(d, c.chart)}</div></div>`;
          }
          case 'table':
            return t2Table(t2, c, idx, st, ui);
          case 'leaderboard':
            return t2Leaderboard(t2, c);
          case 'comparison':
            return t2Comparison(t2, c);
          case 'summary':
            return t2SummaryHtml(t2);
          default:
            return '';
        }
      }

      function t2Table(t2, c, idx, st, ui) {
        const res = t2.results[c.query || PRIMARY];
        if (!res || !res.ok || !res.rows.length) return '';
        const key = 't' + idx;
        let rows = res.rows.map((r, i) => ({ r, i }));
        const srt = (ui.sort || {})[key];
        if (srt) {
          const ci = res.columns.findIndex((col) => col.id === srt.col);
          if (ci >= 0) {
            rows.sort((a, b) => {
              const x = a.r[ci], y = b.r[ci];
              if (x === null || x === '') return y === null || y === '' ? 0 : 1;
              if (y === null || y === '') return -1;
              const d = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'en', { numeric: true });
              return d * (srt.dir || 1);
            });
          }
        }
        const limit = c.limit || 20;
        const gi = res.columns.findIndex((col) => col.kind === 'group');
        const head = res.columns.map((col) => {
          const num = col.kind === 'calc' || col.kind === 'rank';
          const arrow = srt?.col === col.id ? (srt.dir === 1 ? ' ▲' : ' ▼') : '';
          return `<th class="${num ? 'num' : ''}${st.interactive ? ' sortable' : ''}"${st.interactive ? ` data-act="t2sort" data-k="${key}" data-col="${esc(col.id)}"` : ''}>${esc(col.label)}${arrow}</th>`;
        }).join('');
        const tblId = 't2t' + idx;
        const cellHtml = (v, col) => (v === null || v === undefined || v === '')
          ? '<td class="empty num">—</td>'
          : col.kind === 'group' ? `<td title="${esc(v)}">${esc(v)}</td>` : `<td class="num">${esc(formatValue(v, col.format))}</td>`;
        const bodyRows = rows.map(({ r }, n) => `<tr class="${n >= limit ? 't2-extra' : ''}" data-s="${esc(res.columns.map((col, i) => String(r[i] ?? '')).join(' ').toLowerCase())}">${res.columns.map((col, i) => cellHtml(r[i], col)).join('')}</tr>`).join('');
        const totals = res.totals
          ? `<tr class="total">${res.columns.map((col, i) => (col.kind === 'rank' ? '<td></td>' : col.kind === 'group' ? `<td>${i === gi ? esc(res.totals[i] ?? '') : ''}</td>` : cellHtml(res.totals[i], col))).join('')}</tr>`
          : '';
        const more = rows.length > limit ? `<button class="btn small" data-act="t2more" style="margin-top:8px">Show all ${rows.length} rows</button>` : '';
        const search = c.searchable && st.interactive ? `<input type="text" data-live="1" data-chg="t2search" data-tbl="${tblId}" placeholder="Search this table…" style="max-width:260px;margin-bottom:8px">` : '';
        return `<div class="card">${c.title ? `<h3>${esc(c.title)}</h3>` : ''}${search}<div class="tbl-wrap"><table id="${tblId}"><thead><tr>${head}</tr></thead><tbody>${bodyRows}${totals}</tbody></table></div>${more}</div>`;
      }

      function t2Leaderboard(t2, c) {
        const res = t2.results[c.query || PRIMARY];
        if (!res || !res.ok || !res.rows.length) return '';
        const gi = res.columns.findIndex((x) => x.kind === 'group');
        const vi = res.columns.findIndex((x) => x.id === c.value);
        if (gi < 0 || vi < 0) return '';
        const vcol = res.columns[vi];
        const subi = res.columns.findIndex((x) => ['surveys', 'records', 'evals', 'days', 'tickets', 'entries', 'responses'].includes(x.id));
        const hasRank = res.columns[0]?.kind === 'rank';
        const rows = res.rows.slice(0, c.limit || 10).map((r, i) => {
          const medal = i < 3 ? `top${i + 1}` : '';
          const sub = subi >= 0 && subi !== vi ? `<span class="lb-sub">${esc(formatValue(r[subi], res.columns[subi].format))} ${esc(res.columns[subi].label.toLowerCase())}</span>` : '';
          return `<div class="lb-row"><span class="lb-rank ${medal}">${hasRank && r[0] != null ? r[0] : i + 1}</span><span class="lb-name" title="${esc(r[gi])}">${esc(r[gi])}</span>${sub}<span class="lb-val">${esc(formatValue(r[vi], vcol.format))}</span></div>`;
        }).join('');
        return `<div class="card"><h3>${esc(c.title || 'Leaderboard')}</h3>${rows}</div>`;
      }

      function t2Comparison(t2, c) {
        const res = t2.results[c.query || PRIMARY];
        if (!res || !res.ok || !res.rows.length) return '';
        const gi = res.columns.findIndex((x) => x.kind === 'group');
        const vi = res.columns.findIndex((x) => x.id === c.calc);
        if (gi < 0 || vi < 0) return '';
        const col = res.columns[vi];
        const vals = res.rows.map((r) => ({ n: r[gi], v: r[vi] })).filter((x) => x.v !== null && x.v !== undefined && Number.isFinite(x.v));
        if (vals.length < 2) return '';
        const best = vals.reduce((a, b) => (b.v > a.v ? b : a));
        const worst = vals.reduce((a, b) => (b.v < a.v ? b : a));
        const card = (lbl, x, cls) => `<div class="stat"><div class="l">${lbl}</div><div class="n" style="color:${cls}">${esc(formatValue(x.v, col.format))}</div><div class="nt">${esc(x.n)}</div></div>`;
        return `<div class="card"><h3>${esc(c.title || 'Comparison')}</h3><div class="grid g4">${card('Highest', best, 'var(--ok)')}${card('Lowest', worst, 'var(--err)')}<div class="stat"><div class="l">Gap between them</div><div class="n">${esc(formatValue(best.v - worst.v, col.format))}</div><div class="nt">Highest − lowest</div></div></div></div>`;
      }

      /* A comparison or ranking built on very few responses can look dramatic and mean little. Below this many responses
         the report adds a caution (it never hides the figure). 30 is a common rule-of-thumb starting point, not a statistical
         rule: change this one number if your team uses a different level. */
      const SMALL_SAMPLE_CAUTION = 30;

      const t2CountColumn = (res, exceptIndex) => res.columns.findIndex((c, i) => c.kind === 'calc' && c.calcType === 'recordCount' && i !== exceptIndex);

      function t2TrendSentence(tr, cc, ci) {
        const ni = t2CountColumn(tr, ci);
        const noun = ni >= 0 ? tr.columns[ni].label.toLowerCase() : 'records';
        const pts = tr.rows.map((r) => ({ v: r[ci], n: ni >= 0 ? r[ni] : null })).filter((x) => x.v !== null && Number.isFinite(x.v));
        const first = pts[0], last = pts[pts.length - 1];
        const show = (x) => `${formatValue(x.v, cc.format)}${x.n != null ? ` (${fmtN(x.n)} ${noun})` : ''}`;
        const small = [first, last].filter((x) => x.n != null && x.n < SMALL_SAMPLE_CAUTION);
        const d = last.v - first.v;
        const verb = small.length ? 'moved' : d > 0 ? 'improved' : d < 0 ? 'declined' : 'held steady';
        let text = `Over the period, ${cc.label.toLowerCase()} ${verb} from ${show(first)} to ${show(last)}.`;
        if (small.length) text += ` One end of this comparison rests on fewer than ${SMALL_SAMPLE_CAUTION} ${noun} (${small.map((x) => fmtN(x.n)).join(' and ')}), so the change may reflect chance rather than a real shift.`;
        return text;
      }

      function t2LeadersSentence(res, best, worst, ri) {
        const ni = t2CountColumn(res, ri);
        const noun = ni >= 0 ? res.columns[ni].label.toLowerCase() : 'records';
        const fmt = res.columns[ri].format;
        const withN = (x) => `${formatValue(x.v, fmt)}${x.c != null ? ` (${fmtN(x.c)} ${noun})` : ''}`;
        let text = `${best.n} leads at ${withN(best)}; ${worst.n} is lowest at ${withN(worst)}.`;
        const small = [best, worst].filter((x) => x.c != null && x.c < SMALL_SAMPLE_CAUTION);
        if (small.length) text += ` ${small.map((x) => x.n).join(' and ')} ${small.length > 1 ? 'have' : 'has'} fewer than ${SMALL_SAMPLE_CAUTION} ${noun}, so ${small.length > 1 ? 'their positions' : 'its position'} may change with more responses.`;
        return text;
      }

      function t2SummaryHtml(t2) {
        const p = t2.results[PRIMARY];
        const facts = t2Facts(t2);
        const parts = [];
        const periodTxt = facts.period?.from ? ` (${facts.period.from} to ${facts.period.to})` : '';
        parts.push(`This report is based on ${fmtN(p.meta.filteredRows)} of ${fmtN(p.meta.inputRows)} records from ${t2.dsName}${periodTxt}${p.meta.excludedRows ? `, excluding ${fmtN(p.meta.excludedRows)} row(s) removed in Data Health` : ''}.`);
        const rateCol = p.columns.find((c) => c.kind === 'calc' && c.calcType === 'percentage');
        const cntCol = p.columns.find((c) => c.kind === 'calc' && c.calcType === 'recordCount');
        if (rateCol) {
          const v = p.totalsValues[rateCol.id];
          if (v != null) parts.push(`Overall ${rateCol.label.toLowerCase()} is ${formatValue(v, rateCol.format)}${cntCol && p.totalsValues[cntCol.id] != null ? ` across ${fmtN(p.totalsValues[cntCol.id])} records` : ''}.`);
        } else if (cntCol && p.totalsValues[cntCol.id] != null) {
          parts.push(`Overall ${cntCol.label.toLowerCase()}: ${fmtN(p.totalsValues[cntCol.id])}.`);
        }
        const gcols = p.columns.filter((c) => c.kind === 'group');
        if (gcols.length && p.rows.length > 1) {
          const ri = p.definition.ranking?.by ? p.columns.findIndex((c) => c.id === p.definition.ranking.by) : p.columns.findIndex((c) => c.kind === 'calc');
          if (ri > 0) {
            const gi = p.columns.findIndex((c) => c.kind === 'group');
            const ci = t2CountColumn(p, ri);
            const valid = p.rows.map((r) => ({ n: r[gi], v: r[ri], c: ci >= 0 ? r[ci] : null })).filter((x) => x.v !== null && Number.isFinite(x.v));
            if (valid.length >= 2) {
              const best = valid[0], worst = valid[valid.length - 1];
              parts.push(t2LeadersSentence(p, best, worst, ri));
            }
          }
        }
        const tr = t2.results.trend;
        if (tr && tr.ok && tr.rows.length >= 2) {
          const cands = tr.columns.filter((c) => c.kind === 'calc');
          const cc = cands.find((c) => c.calcType === 'percentage') ?? cands[0];
          if (cc) {
            const ci = tr.columns.indexOf(cc);
            const vals = tr.rows.map((r) => r[ci]).filter((v) => v !== null && Number.isFinite(v));
            if (vals.length >= 2) {
              const d = vals[vals.length - 1] - vals[0];
              parts.push(t2TrendSentence(tr, cc, ci));
            }
          }
        }
        const avgC = p.columns.find((c) => c.kind === 'calc' && c.calcType === 'average');
        if (avgC && p.totalsValues[avgC.id] != null) parts.push(`The average ${avgC.label.toLowerCase().replace(/^average\s+/, '')} is ${formatValue(p.totalsValues[avgC.id], avgC.format)}.`);
        return `<div class="card"><h2>Executive Summary</h2><p style="margin:0;font-size:14px;line-height:1.65">${parts.map(esc).join(' ')}</p></div>`;
      }

      /* ---------------- report header + main render ---------------- */
      function t2Render(t2, styleId, ui = {}) {
        const model = buildReportModel(t2, styleId, ui);
        model.meta.styleKey = styleId;
        return renderReportModel(model, t2, ui);
      }

      /* ---------------- abstract visual previews for the library ---------------- */
      function t2PreviewSvg(recipe, large) {
        const c = recipe.previewColor || '#7470F5';
        const w = large ? 300 : 260, hgt = large ? 180 : 150;
        const bars = [40, 58, 34, 66, 48, 60].map((v, i) => `<rect x="${16 + i * 20}" y="${118 - v * 0.7}" width="13" height="${v * 0.7}" rx="2" fill="${c}" opacity="${0.5 + i * 0.08}"/>`).join('');
        const cx = w - 62, cy = 62;
        return `<svg viewBox="0 0 ${w} ${hgt}" style="width:100%;height:auto;background:#FBFAF6;border:1px solid var(--line);border-radius:6px" role="img" aria-label="Layout preview">
          <rect x="12" y="12" width="${w * 0.45}" height="11" rx="3" fill="#17191D"/>
          <rect x="12" y="30" width="${w * 0.3}" height="7" rx="3" fill="#E2DECF"/>
          ${bars}
          <circle cx="${cx}" cy="${cy}" r="26" fill="none" stroke="#E2DECF" stroke-width="13"/>
          <circle cx="${cx}" cy="${cy}" r="26" fill="none" stroke="${c}" stroke-width="13" stroke-dasharray="82 164" transform="rotate(-90 ${cx} ${cy})"/>
          <polyline points="${cx - 30},${cy + 46} ${cx - 12},${cy + 34} ${cx + 4},${cy + 40} ${cx + 20},${cy + 22} ${cx + 34},${cy + 30}" fill="none" stroke="${c}" stroke-width="2.5"/>
        </svg>`;
      }

      /* ---------------- shared report definition / multiple renderers ----------------
         The template's visual recipe is compiled once into this destination-neutral
         model. The browser renderer and XLSX renderer both consume this structure. */
      function t2SummaryText(t2) {
        const p = t2.results[PRIMARY];
        const facts = t2Facts(t2);
        const parts = [];
        const periodTxt = facts.period?.from ? ` (${facts.period.from} to ${facts.period.to})` : '';
        parts.push(`This report is based on ${fmtN(p.meta.filteredRows)} of ${fmtN(p.meta.inputRows)} records from ${t2.dsName}${periodTxt}${p.meta.excludedRows ? `, excluding ${fmtN(p.meta.excludedRows)} row(s) removed in Data Health` : ''}.`);
        const rateCol = p.columns.find((c) => c.kind === 'calc' && c.calcType === 'percentage');
        const cntCol = p.columns.find((c) => c.kind === 'calc' && c.calcType === 'recordCount');
        if (rateCol) {
          const v = p.totalsValues[rateCol.id];
          if (v != null) parts.push(`Overall ${rateCol.label.toLowerCase()} is ${formatValue(v, rateCol.format)}${cntCol && p.totalsValues[cntCol.id] != null ? ` across ${fmtN(p.totalsValues[cntCol.id])} records` : ''}.`);
        } else if (cntCol && p.totalsValues[cntCol.id] != null) {
          parts.push(`Overall ${cntCol.label.toLowerCase()}: ${fmtN(p.totalsValues[cntCol.id])}.`);
        }
        const gcols = p.columns.filter((c) => c.kind === 'group');
        if (gcols.length && p.rows.length > 1) {
          const ri = p.definition.ranking?.by ? p.columns.findIndex((c) => c.id === p.definition.ranking.by) : p.columns.findIndex((c) => c.kind === 'calc');
          if (ri > 0) {
            const gi = p.columns.findIndex((c) => c.kind === 'group');
            const ci = t2CountColumn(p, ri);
            const valid = p.rows.map((r) => ({ n: r[gi], v: r[ri], c: ci >= 0 ? r[ci] : null })).filter((x) => x.v !== null && Number.isFinite(x.v));
            if (valid.length >= 2) parts.push(t2LeadersSentence(p, valid[0], valid[valid.length - 1], ri));
          }
        }
        const tr = t2.results.trend;
        if (tr && tr.ok && tr.rows.length >= 2) {
          const cc = tr.columns.find((c) => c.kind === 'calc' && c.calcType === 'percentage') ?? tr.columns.find((c) => c.kind === 'calc');
          if (cc) {
            const ci = tr.columns.indexOf(cc);
            const vals = tr.rows.map((r) => r[ci]).filter((v) => v !== null && Number.isFinite(v));
            if (vals.length >= 2) {
              const d = vals[vals.length - 1] - vals[0];
              parts.push(t2TrendSentence(tr, cc, ci));
            }
          }
        }
        const avgC = p.columns.find((c) => c.kind === 'calc' && c.calcType === 'average');
        if (avgC && p.totalsValues[avgC.id] != null) parts.push(`The average ${avgC.label.toLowerCase().replace(/^average\s+/, '')} is ${formatValue(p.totalsValues[avgC.id], avgC.format)}.`);
        return parts.join(' ');
      }

      const modelText = (value, t2, facts) => String(value ?? '')
        .replaceAll('{name}', t2.recipe.name)
        .replaceAll('{file}', t2.dsName || '')
        .replaceAll('{metric}', t2.info?.metricLabel || 'metric')
        .replaceAll('{from}', facts.period?.from ?? '')
        .replaceAll('{to}', facts.period?.to ?? '');

      function buildReportModel(t2, styleId = 'executive', ui = {}) {
        const style = T2_STYLES[styleId] || T2_STYLES.executive;
        const facts = t2._facts || (t2._facts = t2Facts(t2));
        const primary = t2.results[PRIMARY];
        const period = facts.period ? `${facts.period.field}: ${facts.period.from} to ${facts.period.to}` : 'All records in file';
        const model = {
          schemaVersion: '1.0',
          meta: {
            title: t2.recipe.name,
            subtitle: t2.recipe.description || 'Cubicle360 presentation-ready report',
            source: t2.dsName,
            reportingPeriod: period,
            periodFrom: facts.period?.from || '',
            periodTo: facts.period?.to || '',
            generatedAt: new Date().toISOString(),
            recordsInFile: primary.meta.inputRows,
            recordsExcluded: primary.meta.excludedRows,
            recordsUsed: primary.meta.filteredRows,
            groups: facts.groups,
            sampleData: Boolean(t2.ds?.isSample),
            presentationStyle: style.label,
            styleKey: styleId,
            templateId: t2.recipe.id,
            category: t2.recipe.category,
          },
          theme: { primary: '#1F3A5F', accent: '#2F6FB0', positive: '#1D7A4D', negative: '#B3261E', border: '#DDE2EA' },
          sections: [],
        };
        const components = t2.recipe.visual
          .filter((c) => !c.ifRole || t2.available[c.ifRole])
          .filter((c) => !(style.hide && style.hide(c)));
        components.forEach((c, idx) => {
          if (c.type === 'heading') {
            model.sections.push({ type: 'heading', title: modelText(c.text, t2, facts), subtitle: modelText(c.sub || '', t2, facts) });
            return;
          }
          if (c.type === 'text') {
            model.sections.push({ type: 'text', text: modelText(c.text, t2, facts) });
            return;
          }
          if (c.type === 'summary') {
            model.sections.push({ type: 'summary', title: 'Executive Summary', text: t2SummaryText(t2) });
            return;
          }
          if (c.type === 'kpi') {
            const items = (c.items || []).map((it) => {
              let value = null;
              let format = it.fmt ? { kind: it.fmt } : { kind: 'integer' };
              if (it.fact) value = facts[it.fact];
              else {
                const v = t2Val(t2, it);
                if (!v) return null;
                value = v.value;
                if (!it.fmt) format = v.format;
              }
              let compareNote = '';
              if (it.compare) {
                const trend = chartData(t2.results[it.compare.q || 'trend'], it.compare.calc);
                if (trend?.pts?.length >= 2) {
                  const a = trend.pts[trend.pts.length - 2].v;
                  const b = trend.pts[trend.pts.length - 1].v;
                  const delta = b - a;
                  if (Number.isFinite(delta) && delta !== 0) compareNote = `${delta > 0 ? '▲' : '▼'} ${ns.formatDelta(Math.abs(delta), trend.fmt)} vs previous period`;
                }
              }
              return { label: modelText(it.label, t2, facts), value, formattedValue: value == null ? '—' : formatValue(value, format), format, note: compareNote };
            }).filter(Boolean);
            if (items.length) model.sections.push({ type: 'kpi', title: model.sections[model.sections.length - 1]?.type === 'heading' ? '' : 'Key Performance Indicators', items, columns: Math.min(4, items.length) });
            return;
          }
          if (c.type === 'chart') {
            const res = t2.results[c.query];
            if (!res?.ok) return;
            const calcCols = res.columns.filter((x) => x.kind === 'calc');
            const switchKey = 'c' + idx;
            let calcId = c.series[0];
            if (style.interactive && calcCols.length > 1) calcId = (ui.chart || {})[switchKey] || calcId;
            const data = chartData(res, calcId, c.limit);
            if (!data?.pts?.length) return;
            const col = res.columns.find((x) => x.id === calcId);
            model.sections.push({
              type: 'chart', title: modelText(c.title || col?.label || 'Chart', t2, facts), chartType: c.chart,
              query: c.query, metricId: calcId, seriesName: col?.label || data.label,
              categories: data.pts.map((p) => String(p.label)), values: data.pts.map((p) => p.v), format: data.fmt,
              formatCode: (data.fmt?.kind === 'percent' ? `0.${'0'.repeat(data.fmt.decimals ?? 1)}%` : data.fmt?.kind === 'integer' ? '#,##0' : `#,##0.${'0'.repeat(data.fmt?.decimals ?? 2)}`),
              xAxisTitle: res.columns.filter((x) => x.kind === 'group').map((x) => x.label).join(' / ') || 'Category',
              yAxisTitle: col?.label || data.label,
              showLegend: ['pie', 'donut'].includes(c.chart),
              showDataLabels: ['pie', 'donut', 'bar', 'hbar'].includes(c.chart),
              trendline: c.chart === 'line' && data.pts.length >= 3,
              metricOptions: style.interactive && calcCols.length > 1 ? calcCols.map((x) => ({ id: x.id, label: x.label })) : [],
              switchKey,
            });
            return;
          }
          if (c.type === 'table') {
            const res = t2.results[c.query || PRIMARY];
            if (!res?.ok || !res.rows?.length) return;
            model.sections.push({
              type: 'table', title: modelText(c.title || 'Details', t2, facts), searchable: Boolean(c.searchable),
              previewLimit: c.limit || 20,
              columns: res.columns.map((col) => ({ id: col.id, label: col.label, kind: col.kind, format: col.format })),
              rows: res.rows.map((row) => row.slice()), totals: res.totals ? res.totals.slice() : null,
            });
            return;
          }
          if (c.type === 'leaderboard') {
            const res = t2.results[c.query || PRIMARY];
            if (!res?.ok || !res.rows?.length) return;
            const gi = res.columns.findIndex((x) => x.kind === 'group');
            const vi = res.columns.findIndex((x) => x.id === c.value);
            if (gi < 0 || vi < 0) return;
            const subi = res.columns.findIndex((x) => ['surveys', 'records', 'evals', 'days', 'tickets', 'entries', 'responses'].includes(x.id) && x.id !== c.value);
            const hasRank = res.columns[0]?.kind === 'rank';
            const rows = res.rows.slice(0, c.limit || 10).map((r, i) => ({
              rank: hasRank && r[0] != null ? r[0] : i + 1,
              name: r[gi], value: r[vi], formattedValue: formatValue(r[vi], res.columns[vi].format),
              sub: subi >= 0 ? `${formatValue(r[subi], res.columns[subi].format)} ${res.columns[subi].label.toLowerCase()}${r[subi] < SMALL_SAMPLE_CAUTION ? ' · small sample' : ''}` : '',
            }));
            model.sections.push({ type: 'leaderboard', title: modelText(c.title || 'Leaderboard', t2, facts), columns: [ 'Rank', 'Group', res.columns[vi].label, ...(subi >= 0 ? [res.columns[subi].label] : []) ], rows, valueFormat: res.columns[vi].format });
            return;
          }
          if (c.type === 'comparison') {
            const res = t2.results[c.query || PRIMARY];
            if (!res?.ok || !res.rows?.length) return;
            const gi = res.columns.findIndex((x) => x.kind === 'group');
            const vi = res.columns.findIndex((x) => x.id === c.calc);
            if (gi < 0 || vi < 0) return;
            const vals = res.rows.map((r) => ({ name: r[gi], value: r[vi] })).filter((x) => Number.isFinite(x.value));
            if (vals.length < 2) return;
            const best = vals.reduce((a, b) => (b.value > a.value ? b : a));
            const worst = vals.reduce((a, b) => (b.value < a.value ? b : a));
            model.sections.push({ type: 'comparison', title: modelText(c.title || 'Comparison', t2, facts), format: res.columns[vi].format, cards: [
              { label: 'Highest', name: best.name, value: best.value, formattedValue: formatValue(best.value, res.columns[vi].format) },
              { label: 'Lowest', name: worst.name, value: worst.value, formattedValue: formatValue(worst.value, res.columns[vi].format) },
              { label: 'Gap between them', name: 'Highest − lowest', value: best.value - worst.value, formattedValue: formatValue(best.value - worst.value, res.columns[vi].format) },
            ] });
          }
        });
        model.layout = {
          flow: 'vertical',
          gridColumns: 8,
          kpiColumns: 4,
          sectionSpacing: 1,
          chart: { widthColumns: 8, heightRows: 16, placement: 'after-section-heading' },
          table: { width: 'full', header: true, filters: true },
        };
        model.sections.forEach((section, index) => {
          section.position = { order: index, width: 'full' };
          if (section.type === 'kpi') section.layout = { columns: 4, cardStyle: 'metric' };
          else if (section.type === 'chart') section.layout = { widthColumns: 8, heightRows: 16, aspectRatio: '16:9' };
          else if (section.type === 'table') section.layout = { width: 'full', header: true, filters: true };
        });
        return model;
      }

      function renderModelTable(section, idx, style, ui) {
        const key = 'modelTable' + idx;
        let rows = section.rows.map((row, i) => ({ row, i }));
        const sort = (ui.sort || {})[key];
        if (sort) {
          const ci = section.columns.findIndex((c) => c.id === sort.col);
          if (ci >= 0) rows.sort((a, b) => {
            const x = a.row[ci], y = b.row[ci];
            if (x == null || x === '') return y == null || y === '' ? 0 : 1;
            if (y == null || y === '') return -1;
            const d = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'en', { numeric: true });
            return d * (sort.dir || 1);
          });
        }
        const header = section.columns.map((c) => {
          const num = c.kind === 'calc' || c.kind === 'rank';
          const arrow = sort?.col === c.id ? (sort.dir === 1 ? ' ▲' : ' ▼') : '';
          return `<th class="${num ? 'num' : ''}${style.interactive ? ' sortable' : ''}"${style.interactive ? ` data-act="t2sort" data-k="${key}" data-col="${esc(c.id)}"` : ''}>${esc(c.label)}${arrow}</th>`;
        }).join('');
        const tableId = 'modelTbl' + idx;
        const cell = (v, col) => v == null || v === '' ? '<td class="empty">—</td>' : col.kind === 'group' ? `<td title="${esc(v)}">${esc(v)}</td>` : `<td class="num">${esc(formatValue(v, col.format || { kind: 'integer' }))}</td>`;
        const displayRows = rows.map(({ row }, n) => `<tr class="${n >= section.previewLimit ? 't2-extra' : ''}" data-s="${esc(row.map((v) => String(v ?? '')).join(' ').toLowerCase())}">${section.columns.map((c, i) => cell(row[i], c)).join('')}</tr>`).join('');
        const totals = section.totals ? `<tr class="total">${section.columns.map((c, i) => cell(section.totals[i], c)).join('')}</tr>` : '';
        const showMore = rows.length > section.previewLimit ? `<button class="btn small" data-act="t2more" style="margin-top:8px">Show all ${rows.length} rows</button>` : '';
        const search = section.searchable && style.interactive ? `<input type="text" data-live="1" data-chg="t2search" data-tbl="${tableId}" placeholder="Search this table…" style="max-width:260px;margin-bottom:8px">` : '';
        return `<div class="card">${section.title ? `<h3>${esc(section.title)}</h3>` : ''}${search}<div class="tbl-wrap"><table id="${tableId}"><thead><tr>${header}</tr></thead><tbody>${displayRows}${totals}</tbody></table></div>${showMore}</div>`;
      }

      function renderModelSection(section, idx, model, t2, ui) {
        const style = T2_STYLES[model.meta.styleKey] || T2_STYLES[model.meta.presentationStyle?.toLowerCase()] || T2_STYLES.executive;
        if (section.type === 'heading') return `<h2>${esc(section.title)}</h2>${section.subtitle ? `<p class="sub" style="margin:-2px 0 8px">${esc(section.subtitle)}</p>` : ''}`;
        if (section.type === 'text') return `<div class="card"><p style="margin:0">${esc(section.text)}</p></div>`;
        if (section.type === 'summary') return `<div class="card"><h2>${esc(section.title)}</h2><p style="margin:0;font-size:14px;line-height:1.65">${esc(section.text)}</p></div>`;
        if (section.type === 'kpi') return `<div class="grid g4" style="margin-bottom:14px">${section.items.map((it) => `<div class="stat kpi"><div class="l">${esc(it.label)}</div><div class="n">${esc(it.formattedValue)}</div>${it.note ? `<div class="nt">${esc(it.note)}</div>` : ''}</div>`).join('')}</div>`;
        if (section.type === 'chart') {
          const d = { fmt: section.format, label: section.seriesName, pts: section.categories.map((label, i) => ({ label, v: section.values[i] })) };
          const switcher = section.metricOptions?.length ? `<select data-chg="t2chartmet" data-k="${section.switchKey}" style="width:auto;margin-left:8px">${section.metricOptions.map((x) => `<option value="${esc(x.id)}"${x.id === section.metricId ? ' selected' : ''}>${esc(x.label)}</option>`).join('')}</select>` : '';
          return `<div class="card"><div class="row noprint" style="margin-bottom:6px"><h3 style="margin:0">${esc(section.title)}</h3>${switcher}</div><div class="chartbox">${t2svg(d, section.chartType)}</div></div>`;
        }
        if (section.type === 'table') return renderModelTable(section, idx, style, ui);
        if (section.type === 'leaderboard') {
          return `<div class="card"><h3>${esc(section.title)}</h3>${section.rows.map((r, i) => `<div class="lb-row"><span class="lb-rank ${i < 3 ? `top${i + 1}` : ''}">${esc(r.rank)}</span><span class="lb-name" title="${esc(r.name)}">${esc(r.name)}</span>${r.sub ? `<span class="lb-sub">${esc(r.sub)}</span>` : ''}<span class="lb-val">${esc(r.formattedValue)}</span></div>`).join('')}</div>`;
        }
        if (section.type === 'comparison') {
          const colors = ['var(--ok)', 'var(--err)', 'var(--navy)'];
          return `<div class="card"><h3>${esc(section.title)}</h3><div class="grid g4">${section.cards.map((c, i) => `<div class="stat"><div class="l">${esc(c.label)}</div><div class="n" style="color:${colors[i]}">${esc(c.formattedValue)}</div><div class="nt">${esc(c.name)}</div></div>`).join('')}</div></div>`;
        }
        return '';
      }

      function renderReportModel(model, t2, ui = {}) {
        const style = T2_STYLES[model.meta.styleKey] || T2_STYLES.executive;
        const periodTxt = model.meta.reportingPeriod || 'All records in file';
        const head = `<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2 style="font-size:20px;margin:0 0 6px">${esc(model.meta.title)}</h2><div class="hint">Source: ${esc(model.meta.source)} · Records used: ${fmtN(model.meta.recordsUsed)} of ${fmtN(model.meta.recordsInFile)} · Reporting period: ${esc(periodTxt)}</div><div class="hint">Generated ${new Date(model.meta.generatedAt).toLocaleString()} · Calculations verified by the built-in engine${model.meta.sampleData ? ' · SAMPLE DATA' : ''}</div></div><span class="tag">${esc(model.meta.presentationStyle)}</span></div></div>`;
        return head + model.sections.map((section, idx) => renderModelSection(section, idx, model, t2, ui)).filter(Boolean).join('');
      }

      /* ---------------- spreadsheet-native renderer ---------------- */
      function buildTemplateWorkbook(ds, t2, model, opts = {}) {
        const { includeSource = false, generatedAt = new Date(), source = true } = opts;
        const styles = new StyleBook();
        const warnings = [];
        const NAVY = '1F3A5F';
        const widths = Array(12).fill(17);
        widths[0] = 22; widths[1] = 18;
        const rows = [], merges = [], rowHeights = {}, charts = [], tables = [];
        const titleStyle = styles.get({ bold: true, size: 20, color: 'FFFFFF', fill: NAVY, h: 'left', v: 'center' });
        const subStyle = styles.get({ color: '475467', italic: true, fill: 'F3F6FA', wrap: true, v: 'center' });
        const metaStyle = styles.get({ color: '667085', italic: true, size: 10, fill: 'F3F6FA', wrap: true, v: 'center' });
        const sectionStyle = styles.get({ bold: true, size: 12, color: 'FFFFFF', fill: NAVY, h: 'left', v: 'center' });
        const kpiLabel = styles.get({ bold: true, color: '475467', fill: 'EAF0F7', border: 'all', h: 'center', v: 'center', wrap: true });
        const kpiValue = styles.get({ bold: true, size: 18, color: NAVY, fill: 'F6F9FC', border: 'all', h: 'center', v: 'center', wrap: true });
        const kpiNote = styles.get({ italic: true, size: 9, color: '667085', fill: 'F6F9FC', border: 'all', h: 'center', v: 'center', wrap: true });
        const headerStyle = styles.get({ bold: true, color: 'FFFFFF', fill: '2F6FB0', border: 'all', wrap: true, v: 'center' });
        const bodyText = styles.get({ border: 'all', wrap: true, v: 'center' });
        const summaryText = styles.get({ size: 11, color: '344054', fill: 'F8FAFC', border: 'all', wrap: true, v: 'top' });
        const smallMuted = styles.get({ size: 9, color: '667085', italic: true, wrap: true });
        const totalStyle = styles.get({ bold: true, fill: 'EEF2F7', border: 'top', wrap: true });
        const push = (cells = []) => { rows.push(cells); return rows.length; };
        const blankRow = () => push([]);
        const mergeRow = (text, style, startCol = 0, endCol = 7, height = 22) => {
          const rowNo = push(Array.from({ length: endCol + 1 }, (_, c) => c === startCol ? S(text, style) : BLANK(style)));
          if (endCol > startCol) merges.push(`${colLetter(startCol)}${rowNo}:${colLetter(endCol)}${rowNo}`);
          rowHeights[rowNo - 1] = height;
          return rowNo;
        };
        const sectionRow = (text) => mergeRow(text, sectionStyle, 0, 7, 24);
        const fmtCode = (fmt = {}) => {
          if (fmt.kind === 'integer') return '#,##0';
          if (fmt.kind === 'percent') return `0${(fmt.decimals ?? 1) ? `.${'0'.repeat(fmt.decimals ?? 1)}` : ''}%`;
          if (fmt.kind === 'date') return 'yyyy-mm-dd';
          if (fmt.kind === 'datetime') return 'yyyy-mm-dd hh:mm:ss';
          if (fmt.kind === 'duration') return '[h]:mm:ss';
          if (fmt.kind === 'time') return 'hh:mm:ss';
          if (fmt.kind === 'text') return 'General';
          const d = fmt.decimals ?? 2;
          return d === 0 ? '#,##0' : `#,##0.${'0'.repeat(d)}`;
        };
        const numCell = (v, fmt = {}, style = bodyText) => {
          if (v === null || v === undefined || !Number.isFinite(Number(v))) return BLANK(style);
          const n = fmt.kind === 'percent' ? Number(v) / 100 : fmt.kind === 'duration' || fmt.kind === 'time' ? Number(v) / 86400 : Number(v);
          return N(n, style);
        };
        const tableHeaderRow = (columns) => push(columns.map((c) => S(c.label || c, headerStyle)));
        const addTable = (name, columns, dataRows, formats = []) => {
          if (!columns.length) return null;
          const hRow = tableHeaderRow(columns);
          const first = hRow;
          dataRows.forEach((line) => push(line));
          const last = Math.max(first, rows.length);
          const endCol = columns.length - 1;
          const ref = `A${first}:${colLetter(endCol)}${last}`;
          const tableName = `C360_${String(name || 'Data').replace(/[^A-Za-z0-9_]/g, '').slice(0, 20) || 'Data'}_${tables.length + 1}`;
          tables.push({ name: tableName, ref, columns: columns.map((c) => c.label || c), style: 'TableStyleMedium2' });
          return { first, last, ref };
        };

        // Cover and metadata band: the report is readable immediately on open.
        mergeRow(model.meta.title, titleStyle, 0, 7, 34);
        mergeRow(model.meta.subtitle || 'Cubicle360 presentation-ready report', subStyle, 0, 7, 30);
        mergeRow(`Reporting period: ${model.meta.reportingPeriod || 'All records'}    |    Source: ${model.meta.source || '—'}`, metaStyle, 0, 7, 22);
        mergeRow(`Generated: ${new Date(model.meta.generatedAt || generatedAt).toLocaleString()}    |    Records used: ${model.meta.recordsUsed} / ${model.meta.recordsInFile}${model.meta.sampleData ? '    |    SAMPLE DATA' : ''}`, metaStyle, 0, 7, 22);
        blankRow();

        const chartQueue = [];
        model.sections.forEach((section) => {
          if (section.type === 'heading') {
            sectionRow(section.title);
            if (section.subtitle) mergeRow(section.subtitle, smallMuted, 0, 7, 22);
            return;
          }
          if (section.type === 'kpi') {
            if (section.title) sectionRow(section.title);
            const bands = Math.ceil(section.items.length / 4);
            for (let band = 0; band < bands; band++) {
              const items = section.items.slice(band * 4, band * 4 + 4);
              const labelCells = Array(8).fill(null).map(() => BLANK(kpiLabel));
              const valCells = Array(8).fill(null).map(() => BLANK(kpiValue));
              const noteCells = Array(8).fill(null).map(() => BLANK(kpiNote));
              const labelRow = rows.length + 1;
              items.forEach((it, i) => {
                const c0 = i * 2;
                labelCells[c0] = S(it.label, kpiLabel);
                valCells[c0] = typeof it.value === 'number' ? numCell(it.value, it.format, styles.get({ bold: true, size: 18, color: NAVY, fill: 'F6F9FC', border: 'all', h: 'center', v: 'center', wrap: true, numFmt: fmtCode(it.format) })) : S(it.formattedValue || '—', kpiValue);
                noteCells[c0] = S(it.note || '', kpiNote);
                merges.push(`${colLetter(c0)}${labelRow}:${colLetter(c0 + 1)}${labelRow}`);
                merges.push(`${colLetter(c0)}${labelRow + 1}:${colLetter(c0 + 1)}${labelRow + 1}`);
                merges.push(`${colLetter(c0)}${labelRow + 2}:${colLetter(c0 + 1)}${labelRow + 2}`);
              });
              push(labelCells); rowHeights[rows.length - 1] = 22;
              push(valCells); rowHeights[rows.length - 1] = 34;
              push(noteCells); rowHeights[rows.length - 1] = 20;
              blankRow();
            }
            return;
          }
          if (section.type === 'summary' || section.type === 'text') {
            sectionRow(section.title || (section.type === 'summary' ? 'Executive Summary' : 'Notes'));
            mergeRow(section.text, summaryText, 0, 7, Math.max(48, Math.min(120, 18 + Math.ceil(String(section.text || '').length / 105) * 15)));
            blankRow();
            return;
          }
          if (section.type === 'chart') {
            sectionRow(section.title);
            const anchorRow = rows.length;
            for (let i = 0; i < 16; i++) {
              push(Array(8).fill(BLANK()));
              rowHeights[rows.length - 1] = 18;
            }
            chartQueue.push({ ...section, type: section.chartType, anchor: { row: anchorRow, col: 0 }, anchorRows: 16, anchorCols: 8 });
            blankRow();
            return;
          }
          if (section.type === 'table') {
            sectionRow(section.title);
            const dataRows = section.rows.map((row) => row.map((v, i) => {
              const col = section.columns[i];
              if (v === null || v === undefined) return BLANK(bodyText);
              if (col.kind === 'group') return S(v, bodyText);
              if (col.kind === 'rank') return numCell(v, { kind: 'integer' }, styles.get({ numFmt: '#,##0', border: 'all', h: 'right' }));
              return col.kind === 'calc' ? numCell(v, col.format, styles.get({ numFmt: fmtCode(col.format), border: 'all', h: 'right' })) : S(v, bodyText);
            }));
            const info = addTable('Details', section.columns, dataRows);
            if (section.totals) {
              push(section.totals.map((v, i) => {
                const col = section.columns[i];
                if (col.kind === 'group') return S(v ?? '', totalStyle);
                if (col.kind === 'rank' || col.kind === 'calc') return numCell(v, col.format || {}, styles.get({ bold: true, fill: 'EEF2F7', border: 'top', numFmt: fmtCode(col.format), h: 'right' }));
                return S(v ?? '', totalStyle);
              }));
            }
            if (info) {
              section.columns.forEach((c, i) => {
                const samples = section.rows.slice(0, 100).map((r) => c.kind === 'group' ? r[i] : formatValue(r[i], c.format || { kind: 'integer' }));
                widths[i] = Math.max(widths[i] || 12, Math.min(34, Math.max(13, ...[c.label, ...samples].map((v) => String(v ?? '').length + 2))));
              });
            }
            blankRow();
            return;
          }
          if (section.type === 'leaderboard') {
            sectionRow(section.title);
            const cols = section.columns.map((label) => ({ label, kind: 'text' }));
            const data = section.rows.map((r) => [
              numCell(r.rank, { kind: 'integer' }, styles.get({ numFmt: '#,##0', border: 'all', h: 'right' })),
              S(r.name, bodyText),
              numCell(r.value, section.valueFormat, styles.get({ numFmt: fmtCode(section.valueFormat), border: 'all', h: 'right' })),
              ...(r.sub !== '' ? [S(r.sub, bodyText)] : []),
            ]);
            addTable('Ranking', cols, data);
            blankRow();
            return;
          }
          if (section.type === 'comparison') {
            sectionRow(section.title);
            const labelCells = Array(8).fill(BLANK(kpiLabel));
            const valCells = Array(8).fill(BLANK(kpiValue));
            const noteCells = Array(8).fill(BLANK(kpiNote));
            section.cards.forEach((c, i) => {
              const c0 = i * 2;
              labelCells[c0] = S(c.label, kpiLabel);
              valCells[c0] = numCell(c.value, section.format, kpiValue);
              noteCells[c0] = S(c.name, kpiNote);
              merges.push(`${colLetter(c0)}${rows.length + 1}:${colLetter(c0 + 1)}${rows.length + 1}`);
              merges.push(`${colLetter(c0)}${rows.length + 2}:${colLetter(c0 + 1)}${rows.length + 2}`);
              merges.push(`${colLetter(c0)}${rows.length + 3}:${colLetter(c0 + 1)}${rows.length + 3}`);
            });
            push(labelCells); rowHeights[rows.length - 1] = 22;
            push(valCells); rowHeights[rows.length - 1] = 34;
            push(noteCells); rowHeights[rows.length - 1] = 20;
            blankRow();
          }
        });

        // Chart input ranges live in an editable appendix on the Report sheet.
        // This keeps native charts self-contained, transparent, and portable.
        if (chartQueue.length) {
          sectionRow('Chart data appendix · editable source ranges');
          chartQueue.forEach((chart, i) => {
            const cap = mergeRow(`${chart.title} — source values`, styles.get({ bold: true, color: NAVY, fill: 'EAF0F7', border: 'bottom' }), 0, 3, 20);
            const headerRow = push([S('Category', headerStyle), S(chart.seriesName || 'Value', headerStyle)]);
            const categories = chart.categories || [];
            const vals = chart.values || [];
            const valueStyle = styles.get({ numFmt: fmtCode(chart.format), border: 'all', h: 'right' });
            categories.forEach((cat, n) => push([S(cat, bodyText), numCell(vals[n], chart.format, valueStyle)]));
            const lastDataRow = rows.length;
            chart.categoriesRef = `'Report'!$A$${headerRow + 1}:$A$${lastDataRow}`;
            chart.valuesRef = `'Report'!$B$${headerRow + 1}:$B$${lastDataRow}`;
            chart.cacheValues = vals.map((v) => chart.format?.kind === 'percent' ? Number(v) / 100 : chart.format?.kind === 'duration' || chart.format?.kind === 'time' ? Number(v) / 86400 : Number(v));
            chart.nameRef = `'Report'!$B$${headerRow}`;
            chart.showLegend = Boolean(chart.showLegend);
            chartQueue[i] = chart;
            const range = `A${headerRow}:B${lastDataRow}`;
            tables.push({ name: `C360_ChartData_${i + 1}`, ref: range, columns: ['Category', chart.seriesName || 'Value'], style: 'TableStyleLight9' });
            blankRow();
          });
        }
        const reportSheet = {
          name: 'Report', rows, widths, heights: rowHeights, merges, charts: chartQueue,
          tables, freezeRows: 4, gridLines: false, tab: NAVY,
        };

        // A concise first-glance sheet for email/meeting hand-offs.
        const sumRows = [], sumMerges = [], sumHeights = {};
        const sumPush = (a = []) => { sumRows.push(a); return sumRows.length; };
        const sumMerge = (value, style, end = 3, height = 24) => {
          const row = sumPush([S(value, style), ...Array.from({ length: end }, () => BLANK(style))]);
          if (end) sumMerges.push(`A${row}:${colLetter(end)}${row}`);
          sumHeights[row - 1] = height;
        };
        sumMerge(model.meta.title, titleStyle, 3, 36);
        sumMerge(model.meta.subtitle || 'Cubicle360 report overview', subStyle, 3, 32);
        sumMerge(`Period: ${model.meta.reportingPeriod}  |  Source: ${model.meta.source}`, metaStyle, 3, 24);
        sumPush([]);
        sumMerge('Key performance indicators', sectionStyle, 3, 24);
        sumPush([S('Metric', headerStyle), S('Value', headerStyle), S('Context', headerStyle)]);
        const allKpis = model.sections.filter((x) => x.type === 'kpi').flatMap((x) => x.items);
        allKpis.forEach((it) => sumPush([S(it.label, bodyText), typeof it.value === 'number' ? numCell(it.value, it.format, styles.get({ numFmt: fmtCode(it.format), border: 'all', h: 'right' })) : S(it.formattedValue, bodyText), S(it.note || '', bodyText)]));
        sumPush([]);
        const summary = model.sections.find((x) => x.type === 'summary');
        if (summary) {
          sumMerge(summary.title, sectionStyle, 3, 24);
          sumMerge(summary.text, summaryText, 3, 64);
        }
        sumPush([]);
        sumMerge('Report details', sectionStyle, 3, 24);
        sumPush([S('Source file', headerStyle), S(model.meta.source, bodyText)]);
        sumPush([S('Records in file', headerStyle), N(model.meta.recordsInFile, bodyText)]);
        sumPush([S('Records excluded', headerStyle), N(model.meta.recordsExcluded, bodyText)]);
        sumPush([S('Records included', headerStyle), N(model.meta.recordsUsed, bodyText)]);
        sumPush([S('Template', headerStyle), S(model.meta.templateId, bodyText)]);
        sumPush([S('Presentation style', headerStyle), S(model.meta.presentationStyle, bodyText)]);
        const summarySheet = { name: 'Summary', rows: sumRows, widths: [30, 24, 54, 18], heights: sumHeights, merges: sumMerges, gridLines: false, tab: '3E7CB1' };
        const sheets = [reportSheet, summarySheet];

        if (includeSource && source && ds) {
          let srcRows = ds.rows;
          if (srcRows.length > 1048575 - 1) {
            warnings.push(`The source data has ${ds.rows.length} rows, more than Excel can hold; only the first ${1048575 - 1} were included.`);
            srcRows = srcRows.slice(0, 1048575 - 1);
          }
          const srcHeader = ds.columns.map((c) => S(c.name, headerStyle));
          if (ds.excluded.size) srcHeader.push(S('Excluded from report?', headerStyle));
          const src = [srcHeader];
          srcRows.forEach((raw, i) => {
            const line = ds.columns.map((col) => {
              const value = raw[col.index];
              if (isBlank(value)) return BLANK(bodyText);
              if (['text', 'category', 'identifier', 'boolean'].includes(col.type)) return S(value, bodyText);
              const parsed = parseValue(value, col);
              if (parsed == null) return S(value, bodyText);
              if (col.type === 'date' || col.type === 'datetime') return N(toExcelSerial(parsed), styles.get({ numFmt: col.type === 'date' ? 'yyyy-mm-dd' : 'yyyy-mm-dd hh:mm:ss', border: 'all' }));
              if (col.type === 'time' || col.type === 'duration') return N(parsed / 86400, styles.get({ numFmt: col.type === 'time' ? 'hh:mm:ss' : '[h]:mm:ss', border: 'all' }));
              if (col.type === 'percentage') return N(parsed / 100, styles.get({ numFmt: '0.0#%', border: 'all' }));
              return N(parsed, styles.get({ numFmt: col.type === 'integer' ? '#,##0' : 'General', border: 'all' }));
            });
            if (ds.excluded.size) line.push(ds.excluded.has(i) ? S('Yes', bodyText) : S('No', bodyText));
            src.push(line);
          });
          const srcWidths = ds.columns.map((c) => Math.min(38, Math.max(12, c.name.length + 3)));
          if (ds.excluded.size) srcWidths.push(22);
          const srcSheet = { name: 'Source Data', rows: src, widths: srcWidths, freezeRows: 1, filter: { rows: src.length, cols: srcHeader.length }, tab: '98A2B3' };
          sheets.push(srcSheet);
        }
        const bytes = writeXlsx(sheets, styles, generatedAt);
        return { bytes, warnings, model, chartCount: chartQueue.length, tableCount: tables.length };
      }

      /* Optional adapter boundary for a separately authorized Google Sheets integration.
         No OAuth flow, network request, or external dependency is loaded by this file. */
      let googleSheetsAdapter = null;
      function registerGoogleSheetsAdapter(adapter) {
        if (!adapter || typeof adapter.createSpreadsheet !== 'function' || typeof adapter.writeReportModel !== 'function') {
          throw new Error('Google Sheets adapter must provide createSpreadsheet(model) and writeReportModel(spreadsheetId, model).');
        }
        googleSheetsAdapter = adapter;
        return true;
      }
      async function exportReportModelToGoogleSheets(model) {
        if (!googleSheetsAdapter) throw new Error('Google Sheets integration is optional and is not connected in this standalone build.');
        const created = await googleSheetsAdapter.createSpreadsheet(model);
        const spreadsheetId = typeof created === 'string' ? created : created?.spreadsheetId;
        if (!spreadsheetId) throw new Error('The Google Sheets adapter did not return a spreadsheet ID.');
        await googleSheetsAdapter.writeReportModel(spreadsheetId, model);
        return { spreadsheetId, url: `https://docs.google.com/spreadsheets/d/${encodeURIComponent(spreadsheetId)}/edit` };
      }


      /* ---------------- extended verification suite ---------------- */
      const _origSelfTests = ns.runSelfTests;
      ns.runSelfTests = function () {
        const base = _origSelfTests();
        const extra = [];
        const test = (name, fn) => {
          try { fn(); extra.push({ name, ok: true }); }
          catch (e) { extra.push({ name, ok: false, error: e.message }); }
        };

        test('Phase2A: CSAT recipe adapts to non-standard headers; all sections produce real data', () => {
          const csv = [
            'Associate,Department,Date Submitted,Satisfaction',
            ...Array(6).fill('Alice,Support,2026-11-01,5'),
            ...Array(4).fill('Bob,Support,2026-11-02,3'),
            ...Array(8).fill('Caro,Sales,2026-10-15,4'),
            ...Array(2).fill('Dan,Sales,2026-11-03,1'),
          ].join('\n');
          const ds = ns.createDataset({ filename: 'csat_alt_headers.csv', text: csv });
          const recipe = ns.T2_RECIPES['t2-monthly-csat'];
          const m = ns.t2Match(ds, recipe);
          if (m.missingRequired.length) throw new Error('missing: ' + m.missingRequired.map((r) => r.label).join(','));
          if (m.mapping.score !== 'Satisfaction' || m.mapping.date !== 'Date Submitted') throw new Error('bad mapping: ' + JSON.stringify(m.mapping));
          const t2 = ns.t2RunAll(ds, recipe.id, m.mapping, {});
          for (const qid of Object.keys(t2.results)) if (!t2.results[qid].ok) throw new Error('query ' + qid + ' failed');
          const overall = ns.t2Val(t2, { calc: 'csatPct', total: true });
          const expected = (100 * (6 + 8)) / 20;
          if (Math.abs(overall.value - expected) > 0.001) throw new Error(`overall CSAT ${overall.value} != ${expected}`);
          const html = ns.t2Render(t2, 'detailed', {});
          if (!html.includes('Executive Summary')) throw new Error('summary missing');
          if (!html.includes('Responses by score') || !html.includes('Team ranking')) throw new Error('sections missing');
          if (html.includes('{name}') || html.includes('{file}')) throw new Error('unresolved placeholder');
          if (!html.includes(ns.formatValue(expected, overall.format))) throw new Error('rendered number does not match calculated value');
          const trendPts = ns.chartData(t2.results.trend, 'csatPct');
          if (!trendPts || trendPts.pts.length !== 2) throw new Error('expected 2 monthly trend points');
        });

        test('Phase2A: weighted CSAT overall is count-based, not an average of group percentages', () => {
          const csv = ['Agent,Team,Survey Date,CSAT Score',
            ...Array(5).fill('A,Alpha,2026-11-01,5'),
            ...Array(90).fill('B,Alpha,2026-11-01,5'),
            ...Array(10).fill('B,Alpha,2026-11-02,2'),

          eq(ranked(ds, lowest), [['A', 1], ['B', 2]], 'lowest two, lowest first');
          const highest = ns.buildGuidedDefinition(ds, { groupField: 'G', metricField: 'V', aggChoice: 'average', sortChoice: 'desc', topN: '2' });

          eq(ranked(ds, limitDef('asc', 'bottom', 2)), [['A', 1], ['B', 2]], 'asc + bottom');
          eq(ranked(ds, limitDef('desc', 'top', 2)), [['E', 1], ['D', 2]], 'desc + top');

        const countOf = (text, needle) => text.split(needle).length - 1;

        test('VISUALS: a saved single-chart definition becomes exactly one visual with the same type and metric', () => {
          eq(ns.visualsFromDefinition({ presentation: { charts: [{ type: 'hbar', dimension: 'group', metric: 'avg_metric' }] } }).map((v) => [v.type, v.metric]), [['hbar', 'avg_metric']], 'one visual, same choices');
          eq(ns.visualsFromDefinition({ presentation: { charts: [{ type: 'donut', metric: 'a' }, { type: 'line', metric: 'b' }] } }).map((v) => [v.type, v.metric]), [['donut', 'a'], ['line', 'b']], 'all saved charts are kept, not just the first');
          eq(ns.visualsFromDefinition({}).map((v) => [v.type, v.metric]), [['bar', null]], 'nothing saved: one default bar visual, as before');
          eq(ns.visualsFromDefinition({ presentation: { charts: [{ type: 'radar', metric: 'a' }] } })[0].type, 'bar', 'an unknown saved type falls back to bar, the old default');
          const ids = ns.visualsFromDefinition({ presentation: { charts: [{ type: 'bar' }, { type: 'bar' }] } }).map((v) => v.id);
          eq(new Set(ids).size, 2, 'ids are unique');
        });

        test('VISUALS: add, change and remove each touch only their own visual', () => {
          const res = visRes(visDs());
          let list = [{ id: 'v1', type: 'donut', metric: 'calls' }];
          const before = JSON.stringify(list);
          list = ns.addVisual(list, res);
          eq(list.length, 2, 'one more visual');

          eq(ns.resolveVisual(res, { id: 'v1', type: 'bar', metric: 'items' }).missing, false, 'the Total Records metric is selectable');

        test('VISUALS: Excel export writes one native chart per visual with its own data, in the right place', () => {

          const pkg = new TextDecoder().decode(out.bytes);

          if (pkg.includes('xl/charts/chart5.xml')) throw new Error('unexpected fifth chart');
          eq([countOf(pkg, '<c:doughnutChart>'), countOf(pkg, '<c:lineChart>'), countOf(pkg, '<c:barDir val="bar"/>'), countOf(pkg, '<c:barDir val="col"/>')], [1, 1, 1, 1], 'one donut, one line, one horizontal bar, one vertical bar');
          for (const t of ['C360ChartData"', 'C360ChartData2"', 'C360ChartData3"', 'C360ChartData4"']) if (!pkg.includes(`name="${t}`) && !pkg.includes(`displayName="${t}`)) throw new Error('table name missing: ' + t);
          const rows = [...pkg.matchAll(/<xdr:from><xdr:col>(\d+)<\/xdr:col><xdr:colOff>0<\/xdr:colOff><xdr:row>(\d+)<\/xdr:row>/g)].map((m) => +m[2]);

        test('VISUALS: one visual (old options) exports exactly as before, and no visuals means no chart', () => {

              const rq = indexedDB.open(DB_NAME, 1);
              rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
              rq.onsuccess = () => res(rq.result);
              rq.onerror = () => rej(rq.error);
            });
          } catch {
            this.available = false;
          }

        async get(key, fallback) {
          await this.open();
          if (!this.db) return fallback;
          return new Promise((res) => {
            const rq = this.db.transaction('kv').objectStore('kv').get(key);
            rq.onsuccess = () => res(rq.result ?? fallback);
            rq.onerror = () => res(fallback);
          });
        },
        async set(key, value) {
          await this.open();
          if (!this.db) return false;
          return new Promise((res) => {
            const tx = this.db.transaction('kv', 'readwrite');
            tx.objectStore('kv').put(value, key);
            tx.oncomplete = () => res(true);
            tx.onerror = () => res(false);
          });
        },
        async clear() {
          await this.open();
          if (!this.db) return;

            const tx = this.db.transaction('kv', 'readwrite');

      async function ingestFile(file) {
        if (!file) return;
        const okName = /\.(csv|tsv|txt)$/i.test(file.name) || file.type === 'text/csv' || file.type === 'text/plain' || file.type === '';
        if (/\.(xlsx|xls|xlsm|ods)$/i.test(file.name)) {

        state.busy = `Reading ${file.name} (${(file.size / 1048576).toFixed(1)} MB)…`;
        state.flash = null;
        render();
        await sleep();
        try {
          const buf = await file.arrayBuffer();
          let text;
          let encodingNote = null;
          try {
            text = new TextDecoder('utf-8', { fatal: true }).decode(buf);
          } catch {
            text = new TextDecoder('windows-1252').decode(buf);
            encodingNote = 'Read using Windows-1252 encoding (standard Excel CSV). Check that special characters look right in the preview.';

          state.raw = { text, filename: file.name, encodingNote };

        const ds = C.createDataset({ filename, text, hasHeader: state.uploadOpts.hasHeader, delimiter: state.uploadOpts.delimiter || undefined, importedAt: Date.now() });
        if (ds.columns.length === 0) {
          state.busy = null;
          flash('error', 'No columns were found', 'This file appears to be empty or is not formatted as a table.');
          return;
        }
        adoptDataset(ds, state.raw.encodingNote);
      }

      function initializeGuidedDefaults(ds) {
        const g = defaultGuided();
        const exp = C.explainDataset(ds);
        const firstGroup = exp.groups.entities[0] ?? exp.groups.categories[0] ?? exp.groups.dates[0];
        const firstMetric = exp.groups.metrics[0] ?? exp.groups.durations[0];
        const firstDate = exp.groups.dates[0];
        if (firstGroup) g.groupField = firstGroup.name;
        if (firstMetric) {
          g.metricField = firstMetric.name;
          g.aggChoice = 'average';
        } else {
          g.aggChoice = 'recordCount';
        }
        if (firstDate) g.dateFilterField = firstDate.name;
        g.title = `${ds.filename.replace(/\.[^.]+$/, '')} Report`;
        state.guided = g;
      }

      function adoptDataset(ds, encodingNote) {
        state.ds = ds;
        state.result = null;
        state.table = { ...state.table, sortId: null, search: '', page: 0, hidden: new Set() };
        state.dsTab = 'overview';
        const sig = signature(ds);
        const known = state.mappings[sig];
        state.preset = known?.preset ?? 'csat';
        state.mapping = known?.mapping ?? C.autoMap(ds, state.preset);
        initializeGuidedDefaults(ds);

        const starter = C.suggestReport(ds, 'general', C.autoMap(ds, 'general'));
        state.def = starter.definition;
        state.notes = starter.notes;
        state.layoutHint = null;

        if (!ds.isSample) {
          const meta = { filename: ds.filename, rows: ds.rows.length, columns: ds.columns.length, at: Date.now() };
          state.datasetsSeen = [meta, ...state.datasetsSeen.filter((m) => m.filename !== meta.filename)].slice(0, 8);
          persist.seen();
        }

        if (state.pendingDefinition) {
          state.def = state.pendingDefinition;
          state.pendingDefinition = null;
          state.builderMode = 'advanced';
          state.notes = ['Saved report configuration loaded. Verify that the selected columns match this file.'];
          flash('ok', `Loaded ${ds.filename}`, `${fmtInt(ds.rows.length)} records ready.`);
          state.view = 'builder';
          return;
        }

        if (state.pendingTask) {
          const task = state.pendingTask;
          state.pendingTask = null;
          if (task.action === 'guided') {
            state.builderMode = 'guided';
            flash('ok', `Loaded ${ds.filename}`, `Let’s build your report step by step (${fmtInt(ds.rows.length)} records loaded).`);
            state.view = 'builder';
            return;
          }
          if (task.action === 'template' && task.templateId) {
            selectTemplate(task.templateId);
            flash('ok', `Loaded ${ds.filename}`, `Matched your columns to the "${C.REPORT_TEMPLATES[task.templateId]?.name}" recipe.`);
            state.view = 'templates';
            return;
          }
        }

        flash('ok', `Loaded ${ds.filename}`, `${fmtInt(ds.rows.length)} records and ${ds.columns.length} columns analyzed${encodingNote ? `\n${encodingNote}` : ''}.`);
