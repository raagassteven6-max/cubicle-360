        state.view = state.t2wiz ? 'templates' : 'data';
      }

      function loadSample(nextTask = null) {
        if (nextTask) state.pendingTask = nextTask;
        const text = C.sampleCsatCsv();
        state.raw = { text, filename: 'SAMPLE_csat_export.csv', encodingNote: null };
        const ds = C.createDataset({ filename: 'SAMPLE_csat_export.csv', text, importedAt: Date.now() });
        ds.isSample = true;
        adoptDataset(ds);
        if (!nextTask) {
          flash('info', 'Sample CSAT dataset loaded', 'This built-in sample contains 246 survey records with realistic quirks (leading-zero IDs, "N/A" entries, mixed team casing, and a duplicate row) so you can explore safely.');
        }
        render();
      }

      function selectTemplate(templateId) {
        templateId = C.T2_LEGACY_MAP[templateId] ?? templateId;
        state.activeTemplateId = templateId;
        if (templateId.startsWith('t2-')) {
          const recipe = C.T2_RECIPES[templateId];
          const mapping = state.ds && recipe ? C.t2Match(state.ds, recipe).mapping : {};
          state.t2wiz = { step: 1, recipeId: templateId, mapping, dateFrom: '', dateTo: '', restrictValue: '', style: state.t2Style || 'executive' };
          state.templateMapping = {};
          return;
        }
        if (state.ds) {
          const match = C.matchTemplate(state.ds, templateId);
          state.templateMapping = { ...match.mapping };
        } else {
          state.templateMapping = {};
        }
      }

      function viewDashboard() {
        const tasksHtml = C.TASK_CATEGORIES.map(
          (t) => `<button class="task-card" data-act="pickTask" data-action="${t.action}" data-tpl="${t.templateId ?? ''}">
            <div class="task-icon" aria-hidden="true">${TASK_ICON_NAME[t.icon] ? icon(TASK_ICON_NAME[t.icon], 20) : t.icon}</div>
            <div class="task-body">
              <strong>${esc(t.title)}</strong>
              <span>${esc(t.subtitle)}</span>
            </div>
          </button>`
        ).join('');

        const recents = state.recents
          .map(
            (r, i) => `<div class="saved-row">
              <div class="saved-main">
                <b>${esc(r.name)}</b>
                <span>${r.def.calculations.length} metric(s) · saved ${new Date(r.savedAt).toLocaleDateString()}</span>
              </div>
              <div class="saved-acts">
                <button class="btn small" data-act="loadRecent" data-i="${i}">Open</button>
                <button class="btn small danger" data-act="delRecent" data-i="${i}">Delete</button>
              </div>
            </div>`
          )
          .join('');

        const activeBanner = state.ds
          ? `<div class="note info" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
              <div><b>Active file: ${esc(state.ds.filename)}</b>${fmtInt(state.ds.rows.length)} records · ${state.ds.columns.length} columns ready.</div>
              <div class="row">
                <button class="btn small primary" data-act="startGuided">Guided Report Builder</button>
                <button class="btn small" data-act="goTemplates">Browse Recipes</button>
                <button class="btn small" data-act="goData">Inspect Data</button>
              </div>
            </div>`
          : `<div class="card">
              <div class="row" style="justify-content:space-between;align-items:center">
                <div>
                  <h2 style="margin:0 0 4px">Start with a spreadsheet</h2>
                  <p class="hint" style="margin:0">Upload any CSV export from your computer, or try the built-in sample dataset. Nothing ever leaves your browser.</p>
                </div>
                <div class="row">
                  <button class="btn primary" data-act="goData">Upload CSV File</button>
                  <button class="btn" data-act="sample">Try Sample Data</button>
                </div>
              </div>
            </div>`;

        return `<h1>What would you like to accomplish today?</h1>
          <p class="sub">Choose a goal below. Cubicle360 will guide you step by step — no Excel formulas or pivot tables needed.</p>
          ${activeBanner}
          <div class="task-grid">${tasksHtml}</div>
          <div class="grid g2" style="margin-top:16px">
            <div class="card">
              <h2>Saved Report Configurations</h2>
              ${recents ? `<div class="saved-list">${recents}</div><p class="hint">Saved configurations store your report rules only — never your private spreadsheet data.</p>` : '<div class="empty-state" style="padding:20px">Reports you generate are saved here automatically for reuse with future CSV files.</div>'}
            </div>
            <div class="card">
              <h2>Prefer full manual control?</h2>
              <p class="hint">If you already know exact aggregations, custom formulas, or multi-level groupings you want to configure, you can switch directly to the Advanced Report Builder or import a saved <code>.c360.json</code> recipe.</p>
              <div class="row" style="margin-top:12px">
                <button class="btn" data-act="openAdvanced">Open Advanced Builder</button>
                <button class="btn" data-act="importDef">Load Recipe File…</button>
              </div>
            </div>
          </div>`;
      }

      const TYPE_ORDER = ['text', 'category', 'identifier', 'integer', 'decimal', 'percentage', 'boolean', 'date', 'datetime', 'time', 'duration'];
      const ROLES = [
        ['entity', 'Person / Employee'],
        ['identifier', 'ID / Reference Number'],
        ['date', 'Date / Timestamp'],
        ['metric', 'Number / Metric'],
        ['category', 'Category / Group'],
        ['duration', 'Duration / Handle Time'],
        ['text', 'General Text'],
      ];

      function viewData() {
        const ds = state.ds;
        const up = `<div class="card noprint">
          <div class="drop" id="drop" data-act="pick" tabindex="0" role="button" aria-label="Choose or drop a CSV file">
            <div class="drop-mark" aria-hidden="true">${icon('upload', 26)}</div>
            <strong>Drop a CSV file here, or click to browse</strong>
            <span class="hint">Processed 100% locally in your browser. Nothing is uploaded anywhere.</span>
            <div class="drop-types" aria-hidden="true"><i>.csv</i><i>.tsv</i><i>.txt</i></div>
          </div>
          <input type="file" id="file" accept=".csv,.tsv,.txt,text/csv,text/plain" hidden>
          <details style="margin-top:10px">
            <summary class="hint">File reading options (if headers or separators look wrong)</summary>
            <div class="row" style="margin-top:8px">
              <label class="chk"><input type="checkbox" data-chg="uploadHeader" ${state.uploadOpts.hasHeader ? '' : 'checked'}> First row is data (no column headers)</label>
              <div><label for="delim">Column separator</label><select id="delim" data-chg="uploadDelim" style="width:auto">${options([['', 'Detect automatically'], [',', 'Comma (,)'], [';', 'Semicolon (;)'], ['\t', 'Tab'], ['|', 'Pipe (|)']], state.uploadOpts.delimiter)}</select></div>
              ${ds && state.raw ? '<button class="btn small" data-act="reparse">Re-read file</button>' : ''}
              <button class="btn small" data-act="sample">Load sample CSV</button>
            </div>
          </details>
          ${state.busy ? `<div class="note info" style="margin-top:10px"><b>${esc(state.busy)}</b><div class="progress"><i></i></div></div>` : ''}
        </div>`;

        if (!ds) return `<h1>1. Your Data</h1><p class="sub">Upload a spreadsheet export to get started.</p>${up}`;

        const q = C.inspectQuality(ds);
        const tabs = [
          ['overview', 'Summary & Suggestions'],
          ['preview', 'Spreadsheet Preview'],
          ['quality', `Data Health${q.summary.errors + q.summary.warnings ? ` (${q.summary.errors + q.summary.warnings})` : ''}`],
          ['columns', 'Column Types & Names'],
        ];

        let body = '';
        if (state.dsTab === 'overview') body = dataOverview(ds, q);
        else if (state.dsTab === 'preview') body = dataPreview(ds);
        else if (state.dsTab === 'quality') body = dataQuality(ds, q);
        else body = dataColumns(ds);

        return `<div class="row" style="justify-content:space-between;align-items:center">
          <div>
            <h1>1. Your Data</h1>
            <p class="sub">${esc(ds.filename)} ${ds.isSample ? '<span class="tag sample">SAMPLE DATA</span>' : ''}</p>
          </div>
          <div class="row noprint">
            <button class="btn" data-act="goTemplates">Use a Report Recipe →</button>
            <button class="btn primary" data-act="startGuided">Build Report Step-by-Step →</button>
          </div>
        </div>
        ${up}
        <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="${state.dsTab === k ? 'on' : ''}" data-act="dsTab" data-k="${k}">${esc(l)}</button>`).join('')}</div>
        ${body}`;
      }

      function dataOverview(ds, q) {
        const exp = C.explainDataset(ds);
        const s = q.summary;

        const groupBadge = (title, cols) =>
          cols.length
            ? `<div class="meta-group"><span class="meta-lbl">${esc(title)}:</span> ${cols.map((c) => `<span class="tag">${esc(c.label)}</span>`).join(' ')}</div>`
            : '';

        const suggestionsHtml = exp.suggestions
          .map(
            (sug) => `<div class="suggestion-row">
              <div>
                <strong>${esc(C.REPORT_TEMPLATES[sug.templateId]?.name ?? 'Recommended Report')}</strong>
                <div class="hint">${esc(sug.reason)}</div>
              </div>
              <button class="btn small primary" data-act="useTemplate" data-tpl="${esc(sug.templateId)}">Use Recipe</button>
            </div>`
          )
          .join('');

        const uncertainHtml = exp.uncertainColumns.length
          ? `<div class="note warn">
              <b>Please confirm ${exp.uncertainColumns.length} column format(s)</b>
              ${exp.uncertainColumns.map((c) => `• "${c.label}": ${c.detected.notes.join(' ')}`).join('\n')}
              <div class="acts"><button class="btn small" data-act="dsTab" data-k="columns">Review Column Settings</button></div>
            </div>`
          : '';

        return `<div class="card">
          <h2>What we found in your file</h2>
          <p style="font-size:15px;margin:0 0 12px">${esc(exp.headline)}</p>
          <div class="meta-list">
            ${groupBadge('People / Entities', exp.groups.entities)}
            ${groupBadge('Categories / Groups', exp.groups.categories)}
            ${groupBadge('Dates', exp.groups.dates)}
            ${groupBadge('Numeric Metrics', exp.groups.metrics)}
            ${groupBadge('Durations', exp.groups.durations)}
            ${groupBadge('Identifiers (preserved as exact text)', exp.groups.identifiers)}
          </div>
        </div>

        <div class="grid g4" style="margin-bottom:14px">
          <div class="stat"><div class="n">${fmtInt(s.rows)}</div><div class="l">Total Records</div>${ds.excluded.size ? `<div class="nt">${ds.excluded.size} excluded</div>` : ''}</div>
          <div class="stat"><div class="n">${s.columns}</div><div class="l">Columns</div></div>
          <div class="stat"><div class="n">${fmtInt(s.emptyCells)}</div><div class="l">Blank Cells</div></div>
          <div class="stat"><div class="n">${s.errors + s.warnings}</div><div class="l">Items to Review</div></div>
        </div>

        ${uncertainHtml}

        ${s.errors + s.warnings ? `<div class="note warn"><b>${s.errors + s.warnings} data-quality item(s) detected</b>Nothing was deleted or altered. Open the <b>Data Health</b> tab if you want to exclude duplicates or merge inconsistent spellings.<div class="acts"><button class="btn small" data-act="dsTab" data-k="quality">Review Data Health</button></div></div>` : '<div class="note ok"><b>Data looks clean</b>No duplicate rows or formatting conflicts were found.</div>'}

        <div class="card">
          <h2>Suggested Reports for This File</h2>
          <p class="hint" style="margin-bottom:10px">Based on the columns detected in ${esc(ds.filename)}:</p>
          ${suggestionsHtml}
        </div>`;
      }

      function dataPreview(ds) {
        const n = state.previewRows;
        const rows = ds.rows.slice(0, n);
        return `<div class="row noprint" style="margin-bottom:8px">
          <div><label for="pv">Rows to display</label><select id="pv" data-chg="previewRows" style="width:auto">${options([[20, '20'], [50, '50'], [200, '200']], n)}</select></div>
          <span class="hint">Showing original values from the first ${Math.min(n, ds.rows.length)} of ${fmtInt(ds.rows.length)} rows.</span>
        </div>
        <div class="tbl-wrap"><table><thead><tr><th>Row</th>${ds.columns.map((c) => `<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${rows.map((r, i) => `<tr class="${ds.excluded.has(i) ? 'excluded' : ''}"><td>${C.rowNumber(ds, i)}</td>${r.map((v) => (v === '' ? '<td class="empty">—</td>' : `<td title="${esc(v)}">${esc(v)}</td>`)).join('')}</tr>`).join('')}</tbody></table></div>`;
      }

      function dataColumns(ds) {
        return `<p class="sub">Adjust how Cubicle360 interprets any column. Your source file is never changed.</p>
        <div class="tbl-wrap"><table><thead><tr><th>CSV Header</th><th>Display Name</th><th>Data Type</th><th>Role</th><th>Format Options</th><th>Notes</th></tr></thead><tbody>
        ${ds.columns.map((c) => `<tr><td>${esc(c.name)}</td><td><input type="text" value="${esc(c.label)}" data-chg="colLabel" data-k="${c.key}" style="min-width:150px"></td>
          <td><select data-chg="colType" data-k="${c.key}">${options(TYPE_ORDER.map((t) => [t, C.TYPE_LABELS[t]]), c.type)}</select></td>
          <td><select data-chg="colRole" data-k="${c.key}">${options(ROLES, c.role)}</select></td>
          <td>${c.type === 'date' || c.type === 'datetime' ? `<select data-chg="colDateOrder" data-k="${c.key}">${options([['MDY', 'Month / Day / Year'], ['DMY', 'Day / Month / Year']], c.dateOrder)}</select>` : c.type === 'duration' ? `<select data-chg="colDur" data-k="${c.key}">${options([['hm', '5:30 = hours:minutes'], ['ms', '5:30 = minutes:seconds']], c.durationTwoPart)}</select>` : '<span class="hint">—</span>'}</td>
          <td style="white-space:normal;min-width:220px;font-size:12px;color:var(--mute)">${esc(c.detected.notes.join(' ') || (c.stats.invalid ? `${c.stats.invalid} value(s) do not match this type.` : ''))}</td></tr>`).join('')}
        </tbody></table></div>`;
      }

      function dataQuality(ds, q) {
        if (!q.issues.length) return '<div class="note ok"><b>No data-quality problems found</b>Everything looks consistent.</div>';
        const lbl = { exclude: 'Exclude affected rows from reports', keep: 'Keep rows as they are', normalize: 'Merge into common spelling' };
        return `<p class="sub">Cubicle360 never silently deletes or alters your records. Decide how to handle each item below:</p>${q.issues
          .map((i) => {
            const d = ds.decisions[i.id];
            const acts = (i.actions ?? []).length
              ? `<div class="acts">${i.actions.map((a) => `<button class="btn small ${d?.action === a ? 'primary' : ''}" data-act="decide" data-id="${esc(i.id)}" data-a="${a}">${esc(lbl[a])}</button>`).join('')}${d ? `<button class="btn small" data-act="undo" data-id="${esc(i.id)}">Undo</button><span class="tag">${d.action === 'exclude' ? `${d.added.length} excluded` : d.action === 'normalize' ? 'spellings merged' : 'kept'}</span>` : ''}</div>`
              : i.fix === 'columns' ? '<div class="acts"><button class="btn small" data-act="dsTab" data-k="columns">Fix in Column Types</button></div>' : '';
            return `<div class="note ${i.severity === 'error' ? 'error' : i.severity === 'warn' ? 'warn' : 'info'}"><b>${esc(i.title)}</b>${esc(i.message)}${acts}</div>`;
          }).join('')}`;
      }

      function viewT2Library() {
        if (state.t2wiz) return viewT2Wizard();
        const q = (state.t2libQ || '').toLowerCase();
        let recipes = Object.values(C.T2_RECIPES);
        if (state.t2libCat !== 'All') recipes = recipes.filter((r) => r.category === state.t2libCat);
        if (state.t2libDiff !== 'All') recipes = recipes.filter((r) => r.difficulty === state.t2libDiff);
        if (q) recipes = recipes.filter((r) => (r.name + ' ' + r.description + ' ' + r.category).toLowerCase().includes(q));
        const cards = recipes.map((r) => `
          <div class="recipe-card">
            ${C.t2PreviewSvg(r)}
            <div class="row" style="justify-content:space-between;align-items:center;margin-top:2px">
              <span class="tag">${esc(r.category)}</span><span class="tag">${esc(r.difficulty)}</span>
            </div>
            <h3>${esc(r.name)}</h3>
            <p class="hint">${esc(r.description)}</p>
            <div class="row" style="margin-top:auto">
              <button class="btn small" data-act="t2Preview" data-id="${r.id}">Preview</button>
              <button class="btn small primary" data-act="t2Pick" data-id="${r.id}">Use Template</button>
            </div>
          </div>`).join('');
        const pv = state.t2preview ? t2PreviewPanel(C.T2_RECIPES[state.t2preview]) : '';
        return `<h1>Template Library</h1>
          <p class="sub">Pick a report template, upload your CSV, confirm the detected columns, and generate a finished, presentation-ready report — no formulas or pivot tables needed.</p>
          <div class="row noprint" style="margin-bottom:14px">
            <div class="grow"><label for="t2q">Search templates</label><input id="t2q" type="text" data-live="1" data-chg="t2q" value="${esc(state.t2libQ)}" placeholder="e.g. CSAT, attendance, SLA, productivity…"></div>
            <div><label for="t2cat">Category</label><select id="t2cat" data-chg="t2cat">${options([['All', 'All categories'], ...C.T2_CATEGORIES.map((c) => [c, c])], state.t2libCat)}</select></div>
            <div><label for="t2diff">Difficulty</label><select id="t2diff" data-chg="t2diff">${options([['All', 'Any level'], ['Beginner', 'Beginner'], ['Intermediate', 'Intermediate']], state.t2libDiff)}</select></div>
          </div>
          ${state.ds ? '' : '<div class="note info"><b>No CSV loaded yet</b>You can browse freely — when you pick a template we will ask for your spreadsheet (or sample data).</div>'}
          <div class="recipe-grid">${cards || '<div class="empty-state">No templates match your search.</div>'}</div>
          ${pv}`;
      }

      function t2PreviewPanel(r) {
        if (!r) return '';
        const req = r.roles.filter((x) => x.required).map((x) => x.label);
        const opt = r.roles.filter((x) => !x.required).map((x) => x.label);
        return `<div class="card" style="border:2px solid var(--graphite);background:#fff;box-shadow:0 0 0 3px var(--lime)">
          <div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Preview: ${esc(r.name)}</h2><button class="btn small" data-act="t2Preview" data-id="${r.id}">Close</button></div>
          <div class="grid g2" style="margin-top:12px">
            <div>
              <div class="meta-group" style="margin-bottom:8px"><span class="tag">${esc(r.category)}</span><span class="tag">${esc(r.difficulty)}</span></div>
              <p>${esc(r.description)}</p>
              <p><b>What it produces:</b> ${esc(r.produces)}</p>
              <p class="hint" style="margin-bottom:2px"><b>Required columns:</b> ${esc(req.join(', ') || 'None — works with any file')}</p>
              <p class="hint"><b>Optional columns:</b> ${esc(opt.join(', ') || 'None')}</p>
              <p class="hint">The same calculation recipe can be displayed as an Executive Summary, Detailed Analytical Report, Interactive Dashboard, or Printable Report.</p>
              <div class="row"><button class="btn primary" data-act="t2Pick" data-id="${r.id}">Use This Template</button></div>
            </div>
            <div>${C.t2PreviewSvg(r, true)}</div>
          </div>
        </div>`;
      }

      function viewT2Wizard() {
        const wiz = state.t2wiz;
        const recipe = C.T2_RECIPES[wiz.recipeId];
        const ds = state.ds;
        const steps = ['About this report', 'Confirm columns', 'Options & style']
          .map((s, i) => `<span class="tag ${wiz.step === i + 1 ? 'sample' : ''}">${i + 1}. ${s}</span>`).join(' ');
        let body = '';
        if (wiz.step === 1) {
          body = `<div class="card">
            <div class="row" style="align-items:flex-start">
              <div class="grow">
                <div class="meta-group" style="margin-bottom:8px"><span class="tag">${esc(recipe.category)}</span><span class="tag">${esc(recipe.difficulty)}</span></div>
                <p style="font-size:15px">${esc(recipe.description)}</p>
                <p><b>What it produces:</b> ${esc(recipe.produces)}</p>
                <h3>Information it needs from your CSV</h3>
                <ul class="method-list">
                  ${recipe.roles.map((r) => `<li><b>${esc(r.label)}</b> — ${r.required ? '<b style="color:var(--err)">required</b>' : 'optional'}</li>`).join('')}
                </ul>
                <p class="hint">All calculations run on your own computer. Your file is never uploaded anywhere.</p>
              </div>
              <div style="width:300px;flex:none">${C.t2PreviewSvg(recipe, true)}</div>
            </div>
            <div class="row" style="margin-top:14px">
              <button class="btn" data-act="t2BackToLib">← Back to library</button>
              <button class="btn primary" data-act="t2Next">Continue: confirm columns →</button>
            </div>
          </div>`;
        } else if (wiz.step === 2) {
          if (!ds) {
            body = `<div class="card">
              <h2>Upload your CSV</h2>
              <p class="hint">To map columns for the <b>${esc(recipe.name)}</b>, load the spreadsheet you want to report on.</p>
              <div class="row">
                <button class="btn primary" data-act="t2Upload">Upload CSV…</button>
                <button class="btn" data-act="t2Sample">Use sample data</button>
                <button class="btn" data-act="t2BackToLib">Cancel</button>
              </div>
            </div>`;
          } else {
            const missing = recipe.roles.filter((r) => r.required && !wiz.mapping[r.key]);
            const roleRows = recipe.roles.map((r) => `<div>
              <label>${esc(r.label)} ${r.required ? '<span style="color:var(--err)">*</span>' : '<span class="hint">(optional)</span>'}</label>
              <select data-chg="t2Role" data-k="${r.key}">${options(ds.columns.map((c) => [c.name, `${c.label} (${C.TYPE_LABELS[c.type]})`]), wiz.mapping[r.key], '— not in my file —')}</select>
            </div>`).join('');
            body = `<div class="card">
              <div class="row" style="justify-content:space-between;align-items:center">
                <h2 style="margin:0">Confirm column mapping — ${esc(ds.filename)}</h2>
                <button class="btn small" data-act="t2Auto">Auto-detect again</button>
              </div>
              <p class="hint">Cubicle360 pre-matched your headers. Adjust anything that looks wrong.</p>
              <div class="grid g2" style="margin-top:10px">${roleRows}</div>
              ${missing.length
                ? `<div class="note warn" style="margin-top:12px"><b>Still needed:</b> ${esc(missing.map((m) => m.label).join(', '))}. Your CSV must contain a column for each required item.</div>`
                : '<div class="note ok" style="margin-top:12px"><b>All required columns found.</b> You can continue.</div>'}
              <div class="row" style="margin-top:14px">
                <button class="btn" data-act="t2Back">← Back</button>
                ${missing.length ? '<button class="btn" disabled>Continue: options →</button>' : '<button class="btn primary" data-act="t2Next">Continue: options →</button>'}
              </div>
            </div>`;
          }
        } else {
          const dCol = wiz.mapping.date ? C.resolveColumn(ds, wiz.mapping.date) : null;
          const optRole = recipe.roles.find((r) => !r.required && r.accepts === 'text' && wiz.mapping[r.key] && C.resolveColumn(ds, wiz.mapping[r.key]));
          const oCol = optRole ? C.resolveColumn(ds, wiz.mapping[optRole.key]) : null;
          const vals = oCol && C.TEXT_TYPES.has(oCol.type) && oCol.stats.distinct <= 200
            ? [...new Set(C.getTyped(ds, oCol).filter((v) => v !== null))].sort((a, b) => String(a).localeCompare(String(b))).slice(0, 80)
            : [];
          const styleCards = Object.entries(C.T2_STYLES).map(([k, s]) => `
            <label class="recipe-card ${wiz.style === k ? 'selected' : ''}" style="cursor:pointer;position:relative">
              <input type="radio" name="t2style" value="${k}" data-chg="t2StyleRadio" ${wiz.style === k ? 'checked' : ''} style="position:absolute;opacity:0;pointer-events:none">
              <strong style="color:var(--navy)">${esc(s.label)}</strong>
              <span class="hint">${esc(s.desc)}</span>
            </label>`).join('');
          body = `<div class="card">
            <h2>Options & presentation style</h2>
            ${dCol ? `<div class="row">
                <div class="grow"><label>Reporting period — from</label><input type="text" placeholder="2026-11-01" value="${esc(wiz.dateFrom)}" data-chg="t2From"></div>
                <div class="grow"><label>to</label><input type="text" placeholder="2026-11-30" value="${esc(wiz.dateTo)}" data-chg="t2To"></div>
              </div>
              <p class="hint">Leave blank to include every row in the file.</p>`
            : '<p class="hint">No date column was mapped — the report will cover all rows in the file.</p>'}
            ${recipe.id === 't2-monthly-csat' ? `<div class="row"><div class="grow"><label>Lowest score that counts as "satisfied" (optional)</label><input type="text" inputmode="decimal" placeholder="e.g. 4" value="${esc(wiz.csatThreshold || '')}" data-chg="t2Threshold" style="max-width:160px"></div></div>
              <p class="hint">Leave blank to use the standard rule: 4 or higher on a 1–5 scale, or 9 or higher on a 1–10 scale. If your scores look different, enter the threshold here.</p>` : ''}
            ${recipe.id === 't2-attendance' ? `<div class="row"><div class="grow"><label>Statuses that count as absent (optional)</label><input type="text" placeholder="e.g. Absent, NCNS" value="${esc(wiz.absentStatuses || '')}" data-chg="t2Absent" style="max-width:320px"></div></div>
              <p class="hint">Separate several statuses with commas. Leave blank to detect them from names such as "Absent", "NCNS", "No show" or "AWOL". If your file uses codes such as P / A / L, enter the codes that mean absent here.</p>` : ''}
            ${vals.length ? `<div class="row"><div class="grow"><label>Focus on one ${esc(optRole.label.toLowerCase())} (optional filter)</label>
              <select data-chg="t2Restrict">${options(vals.map((v) => [v, v]), wiz.restrictValue, 'All values')}</select></div></div>` : ''}
            <h3 style="margin-top:16px">Presentation style <span class="hint">— the same calculations, arranged differently</span></h3>
            <div class="recipe-grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${styleCards}</div>
            <div class="row" style="margin-top:14px">
              <button class="btn" data-act="t2Back">← Back</button>
              <button class="btn primary" data-act="t2Generate">Generate Report</button>
            </div>
          </div>`;
        }
        return `<h1>${esc(recipe.name)}</h1><p class="sub">${steps}</p>${body}`;
      }

      function viewTemplates() {
        return viewT2Library();
      }

      const colOpts = (ds, filter) => ds.columns.filter(filter ?? (() => true)).map((c) => [c.name, `${c.label} (${C.TYPE_LABELS[c.type]})`]);
      const isNum = (c) => C.NUMERIC_TYPES.has(c.type);
      const fieldFilterFor = (kind) => ({ numeric: isNum, optionalNumeric: isNum, ordered: (c) => C.ORDERED_TYPES.has(c.type) })[kind] ?? (() => true);

      function viewBuilder() {
        const ds = state.ds;
        if (!ds) {
          return `<h1>3. Build Report</h1>
            <div class="card empty-state">
              <p>Upload a spreadsheet first so we can see your columns.</p>
              <button class="btn primary" data-act="goData">Upload CSV</button>
              <button class="btn" data-act="sample">Try with Sample Data</button>
            </div>`;
        }

        const modeBar = `<div class="row noprint" style="justify-content:space-between;align-items:center;margin-bottom:14px">
          <div>
            <h1 style="margin:0">3. Build Report</h1>
            <p class="sub" style="margin:2px 0 0">Working on <b>${esc(ds.filename)}</b> (${fmtInt(ds.rows.length)} records)</p>
          </div>
          <div class="seg" role="group" aria-label="Builder mode">
            <button class="${state.builderMode === 'guided' ? 'on' : ''}" data-act="setBuilderMode" data-m="guided">Guided Step-by-Step</button>
            <button class="${state.builderMode === 'advanced' ? 'on' : ''}" data-act="setBuilderMode" data-m="advanced">Advanced Controls</button>
          </div>
        </div>`;

        return modeBar + (state.builderMode === 'guided' ? viewGuidedBuilder(ds) : viewAdvancedBuilder(ds));
      }

      function viewGuidedBuilder(ds) {
        const g = state.guided;
        const exp = C.explainDataset(ds);
        const groupCandidates = [...exp.groups.entities, ...exp.groups.categories, ...exp.groups.dates, ...ds.columns.filter((c) => !exp.groups.entities.includes(c) && !exp.groups.categories.includes(c) && !exp.groups.dates.includes(c))];
        const metricCandidates = [...exp.groups.metrics, ...exp.groups.durations];
        const dateCandidates = exp.groups.dates;

        const selectedGroupCol = g.groupField ? C.resolveColumn(ds, g.groupField) : null;
        const isDateGroup = selectedGroupCol && C.DATE_TYPES.has(selectedGroupCol.type);
        const selectedMetricCol = g.metricField ? C.resolveColumn(ds, g.metricField) : null;

        const aggChoices = [
          ['average', 'Calculate the average (mean)'],
          ['sum', 'Add all values together (total)'],
          ['max', 'Find the highest value'],
          ['min', 'Find the lowest value'],
          ['percentage', 'Calculate percentage meeting a goal or rule'],
          ['distinctCount', 'Count unique entries (no duplicates)'],
          ['recordCount', 'Simply count the number of records'],
        ];

        const previewDef = C.buildGuidedDefinition(ds, g);
        const check = C.validateDefinition(ds, previewDef);

        return `<div class="guided-stack">
          <div class="card">
            <div class="step"><span class="no">1</span><h2>How would you like to organize your results?</h2></div>
            <p class="hint">Choose what each row in your final report should represent (for example: each employee, team, or month).</p>
            <div class="row" style="margin-top:10px">
              <div class="grow">
                <label for="g_group">Organize results by</label>
                <select id="g_group" data-chg="gGroup">
                  ${options(groupCandidates.map((c) => [c.name, `${c.label} (${C.TYPE_LABELS[c.type]})`]), g.groupField, 'Show one overall summary (do not split into groups)')}
                </select>
              </div>
              ${isDateGroup ? `<div class="grow">
                <label for="g_bucket">Group dates by</label>
                <select id="g_bucket" data-chg="gBucket">${options(Object.entries(C.DATE_BUCKETS), g.dateBucket)}</select>
              </div>` : ''}
            </div>
          </div>

          <div class="card">
            <div class="step"><span class="no">2</span><h2>What would you like to measure?</h2></div>
            <p class="hint">Tell us what numbers or counts you want to see in your report.</p>
            <div class="row" style="margin-top:10px">
              <div class="grow">
                <label for="g_agg">What would you like to know?</label>
                <select id="g_agg" data-chg="gAgg">${options(aggChoices, g.aggChoice)}</select>
              </div>
              ${g.aggChoice !== 'recordCount' ? `<div class="grow">
                <label for="g_metric">Which column should we measure?</label>
                <select id="g_metric" data-chg="gMetric">
                  ${options((g.aggChoice === 'distinctCount' ? ds.columns : metricCandidates).map((c) => [c.name, `${c.label} (${C.TYPE_LABELS[c.type]})`]), g.metricField, 'Choose a column…')}
                </select>
              </div>` : ''}
            </div>
            ${g.aggChoice === 'percentage' && selectedMetricCol ? `<div class="row" style="margin-top:10px;background:var(--bg);padding:10px;border-radius:6px">
              <div class="grow">
                <label for="g_pct_op">Goal / Condition on "${esc(selectedMetricCol.label)}"</label>
                <select id="g_pct_op" data-chg="gPctOp">${options(Object.entries(C.OPERATORS).filter(([k]) => !['isEmpty', 'notEmpty', 'between'].includes(k)).map(([k, o]) => [k, o.label]), g.pctOperator)}</select>
              </div>
              <div class="grow">
                <label for="g_pct_val">Target value</label>
                <input id="g_pct_val" type="text" value="${esc(g.pctValue)}" placeholder="${isNum(selectedMetricCol) ? 'e.g. 4' : 'e.g. Completed'}" data-chg="gPctVal">
              </div>
            </div>` : ''}
            <div class="how-box">
              <strong>How does this work?</strong>
              <span>${esc(C.FRIENDLY_CALC[g.aggChoice]?.explain ?? '')}</span>
            </div>
          </div>

          <div class="card">
            <div class="step"><span class="no">3</span><h2>Time period & optional filters</h2></div>
            <p class="hint">Leave blank to include every row in your spreadsheet.</p>
            ${dateCandidates.length ? `<div class="row" style="margin-top:10px">
              <div class="grow">
                <label for="g_dcol">Date column</label>
                <select id="g_dcol" data-chg="gDateCol">${options(dateCandidates.map((c) => [c.name, c.label]), g.dateFilterField, 'No date filter')}</select>
              </div>
              ${g.dateFilterField ? `<div class="grow"><label for="g_dfrom">From date</label><input id="g_dfrom" type="text" placeholder="YYYY-MM-DD" value="${esc(g.dateFrom)}" data-chg="gDateFrom"></div>
              <div class="grow"><label for="g_dto">To date</label><input id="g_dto" type="text" placeholder="YYYY-MM-DD" value="${esc(g.dateTo)}" data-chg="gDateTo"></div>` : ''}
            </div>` : ''}
            <div class="row" style="margin-top:10px">
              <div class="grow">
                <label for="g_fcol">Focus on specific records (optional)</label>
                <select id="g_fcol" data-chg="gFilterCol">${options(colOpts(ds), g.filterField, 'Include all records')}</select>
              </div>
              ${g.filterField ? `<div class="grow">
                <label for="g_fop">Rule</label>
                <select id="g_fop" data-chg="gFilterOp">${options(Object.entries(C.OPERATORS).filter(([k]) => k !== 'between').map(([k, o]) => [k, o.label]), g.filterOp)}</select>
              </div>
              ${C.OPERATORS[g.filterOp]?.needs > 0 ? `<div class="grow"><label for="g_fval">Value</label><input id="g_fval" type="text" value="${esc(g.filterValue)}" data-chg="gFilterVal"></div>` : ''}` : ''}
            </div>
          </div>

          <div class="card">
            <div class="step"><span class="no">4</span><h2>Order & report title</h2></div>
            <div class="row" style="margin-top:10px">
              <div class="grow">
                <label for="g_title">Report title</label>
                <input id="g_title" type="text" value="${esc(g.title)}" data-chg="gTitle">
              </div>
              ${g.groupField ? `<div class="grow">
                <label for="g_sort">How should rows be ordered?</label>
                <select id="g_sort" data-chg="gSort">
                  ${options([['desc', 'Highest to lowest (Top performers first)'], ['asc', 'Lowest to highest'], ['natural', 'Alphabetical / chronological order']], g.sortChoice)}
                </select>
              </div>
              ${g.sortChoice !== 'natural' ? `<div>
                <label for="g_topn">Limit rows (optional)</label>
                <input id="g_topn" type="number" min="1" placeholder="All" value="${esc(g.topN)}" data-chg="gTopN" style="width:110px">
              </div>` : ''}` : ''}
            </div>
            <div style="margin-top:12px">${check.errors.map((e) => noteHtml(e, 'error')).join('')}</div>
            <div class="row" style="margin-top:14px">
              <button class="btn primary" data-act="generateGuided">Generate Report</button>
              <button class="btn" data-act="guidedToAdvanced">Fine-tune in Advanced Builder</button>
            </div>
          </div>
        </div>`;
      }

      function datalistFor(ds, field) {
        const col = C.resolveColumn(ds, field);
        if (!col || !C.TEXT_TYPES.has(col.type) || col.stats.distinct > 200) return '';
        const vals = [...new Set(C.getTyped(ds, col).filter((v) => v !== null))].sort((a, b) => String(a).localeCompare(String(b))).slice(0, 80);
        return `<datalist id="dl_${esc(col.key)}">${vals.map((v) => `<option value="${esc(v)}">`).join('')}</datalist>`;
      }

      function conditionEditor(ds, c, path, label) {
        const needs = C.OPERATORS[c.op]?.needs ?? 1;
        const col = C.resolveColumn(ds, c.field);
        const isDate = col && C.DATE_TYPES.has(col.type);
        const ph = isDate ? '2026-11-30' : col && isNum(col) ? 'number' : 'value';
        return `<div class="row" style="margin-bottom:6px"><div class="grow"><label>${label ?? 'Column'}</label><select data-chg="condField" data-p="${path}">${options(colOpts(ds), c.field, 'Choose a column…')}</select></div>
          <div class="grow"><label>Condition</label><select data-chg="condOp" data-p="${path}">${options(Object.entries(C.OPERATORS).map(([k, o]) => [k, o.label]), c.op, 'Choose…')}</select></div>
          ${needs >= 1 ? `<div class="grow"><label>${needs === 2 ? 'From' : 'Value'}</label><input type="text" value="${esc(c.value ?? '')}" placeholder="${ph}" list="dl_${esc(col?.key ?? '')}" data-chg="condVal" data-p="${path}" data-w="value"></div>` : ''}
          ${needs === 2 ? `<div class="grow"><label>To</label><input type="text" value="${esc(c.value2 ?? '')}" placeholder="${ph}" data-chg="condVal" data-p="${path}" data-w="value2"></div>` : ''}${datalistFor(ds, c.field)}</div>`;
      }

      const resolvePath = (p) => {
        const [k, i] = p.split('.');
        return k === 'f' ? state.def.filters.conditions[+i] : state.def.calculations[+i].condition;
      };

      function calcEditor(ds, c, i) {
        const m = C.CALC_TYPES[c.type];
        const earlier = state.def.calculations.slice(0, i);
        const groups = {};
        Object.entries(C.CALC_TYPES).forEach(([k, v]) => (groups[v.group] ??= []).push([k, `${C.FRIENDLY_CALC[k]?.short ?? v.label} (${v.label})`]));
        const typeSel = `<select data-chg="calcType" data-i="${i}">${Object.entries(groups).map(([g, items]) => `<optgroup label="${esc(g)}">${options(items, c.type)}</optgroup>`).join('')}</select>`;
        let body = '';
        if (m.derived) {
          const calcOpts = earlier.map((e) => [e.id, e.name]);
          const bIsConst = c.b && typeof c.b === 'object' && Object.hasOwn(c.b, 'value');
          body = `<div class="row"><div class="grow"><label>A (first value)</label><select data-chg="calcA" data-i="${i}">${options(calcOpts, c.a, 'Choose a calculation above…')}</select></div>
          ${c.type === 'periodChange' ? '' : `<div class="grow"><label>B / target is</label><select data-chg="calcBKind" data-i="${i}">${options([['calc', 'another calculation'], ['value', 'a fixed number']], bIsConst ? 'value' : 'calc')}</select></div>
          <div class="grow">${bIsConst ? `<label>Target number</label><input type="text" value="${esc(c.b.value)}" data-chg="calcBVal" data-i="${i}" placeholder="e.g. 4.5">` : `<label>B (second value)</label><select data-chg="calcBCalc" data-i="${i}">${options(calcOpts, c.b?.calc, 'Choose…')}</select>`}</div>`}</div>`;
        } else {
          body = `<div class="row">${m.field !== 'none' ? `<div class="grow"><label>${m.field === 'optional' || m.field === 'optionalNumeric' ? 'Column (optional)' : 'Calculate on column'}</label><select data-chg="calcField" data-i="${i}">${options(colOpts(ds, fieldFilterFor(m.field)), c.field, m.field.startsWith('optional') ? '— all records —' : 'Choose a column…')}</select></div>` : ''}
          ${m.weight ? `<div class="grow"><label>Weight column</label><select data-chg="calcWeight" data-i="${i}">${options(colOpts(ds, isNum), c.weightField, 'Choose a column…')}</select></div>` : ''}</div>`;
          if (m.condition !== undefined) {
            const has = Boolean(c.condition);
            body += `<div style="margin-top:8px">${m.condition === 'required' || has ? `<div class="hint" style="margin-bottom:4px"><b>${m.condition === 'required' ? 'Which rows count? (required)' : 'Only count rows where:'}</b></div>${conditionEditor(ds, c.condition ?? { field: '', op: '' }, `c.${i}`, 'When column')}${m.condition === 'optional' ? `<button class="btn small" data-act="calcCondOff" data-i="${i}">Remove condition</button>` : ''}` : `<button class="btn small" data-act="calcCondOn" data-i="${i}">+ Only count rows meeting a condition</button>`}</div>`;
          }
        }
        const f = c.format ?? { kind: 'auto' };
        return `<div class="calc"><div class="row"><div class="grow"><label>Column heading in report</label><input type="text" value="${esc(c.name)}" data-chg="calcName" data-i="${i}"></div><div class="grow"><label>Calculation</label>${typeSel}</div>
          <div><label>Format</label><select data-chg="calcFmt" data-i="${i}" style="width:auto">${options([['auto', 'Automatic'], ['integer', 'Whole number'], ['decimal', 'Decimal'], ['percent', 'Percent'], ['duration', 'Duration h:mm:ss']], f.kind)}</select></div>
          ${['decimal', 'percent'].includes(f.kind) ? `<div><label>Decimals</label><select data-chg="calcDec" data-i="${i}" style="width:auto">${options([0, 1, 2, 3, 4].map((n) => [n, n]), f.decimals ?? (f.kind === 'percent' ? 1 : 2))}</select></div>` : ''}
          <button class="btn small danger" data-act="calcDel" data-i="${i}">Remove</button></div>
          <div class="help">${esc(m.help)}</div>${body}
          <details class="how-details"><summary>How does this work?</summary><p class="hint">${esc(C.explainCalculation(ds, c, state.def.calculations))}</p></details>
        </div>`;
      }

      function checksHtml() {
        if (!state.ds) return '';
        const check = C.validateDefinition(state.ds, state.def);
        return check.errors.map((e) => noteHtml(e, 'error')).join('') + check.warnings.map((e) => noteHtml(e, 'warn')).join('');
      }

      function viewAdvancedBuilder(ds) {
        const d = state.def;
        const step = (n, t, inner, hint) => `<div class="card"><div class="step"><span class="no">${n}</span><h2>${t}</h2></div>${hint ? `<p class="hint" style="margin-top:-4px">${hint}</p>` : ''}${inner}</div>`;
        const groupHtml = d.groupBy
          .map((g, i) => {
            const col = C.resolveColumn(ds, g.field);
            return `<div class="row" style="margin-bottom:6px"><div class="grow"><label>Organize by</label><select data-chg="groupField" data-i="${i}">${options(colOpts(ds), g.field, 'Choose a column…')}</select></div>${col && C.DATE_TYPES.has(col.type) ? `<div class="grow"><label>Date grouping</label><select data-chg="groupBucket" data-i="${i}">${options(Object.entries(C.DATE_BUCKETS), g.bucket ?? 'day')}</select></div>` : ''}<button class="btn small danger" data-act="groupDel" data-i="${i}">Remove</button></div>`;
          }).join('');
        const calcs = d.calculations.map((c, i) => calcEditor(ds, c, i)).join('');
        const filters = d.filters.conditions.map((c, i) => `<div style="border-bottom:1px dashed var(--line);margin-bottom:8px">${conditionEditor(ds, c, `f.${i}`)}<button class="btn small danger" data-act="filterDel" data-i="${i}" style="margin-bottom:8px">Remove filter</button></div>`).join('');
        const rk = d.ranking;
        const metricOpts = d.calculations.map((c) => [c.id, c.name]);
        return `${state.notes.map((n) => `<div class="note info">${esc(n)}</div>`).join('')}
        ${step(1, 'Report Title', `<div class="row"><div class="grow"><label for="rname">Report name</label><input id="rname" type="text" value="${esc(d.name)}" data-chg="defName"></div></div>`)}
        ${step(2, 'Organize Results By (Grouping)', `${groupHtml || '<p class="hint">No grouping: shows one overall summary row.</p>'}<button class="btn small" data-act="groupAdd">+ Add a grouping column</button>`)}
        ${step(3, 'Calculations & Metrics', `${calcs || '<p class="hint">Add at least one calculation.</p>'}<div class="row"><button class="btn small" data-act="calcAdd">+ Add a calculation</button></div>`)}
        ${step(4, 'Filters', `${d.filters.conditions.length > 1 ? `<div class="row" style="margin-bottom:6px"><label class="chk"><input type="radio" name="logic" value="AND" data-chg="filterLogic" ${d.filters.logic === 'AND' ? 'checked' : ''}> Match ALL conditions (AND)</label><label class="chk"><input type="radio" name="logic" value="OR" data-chg="filterLogic" ${d.filters.logic === 'OR' ? 'checked' : ''}> Match ANY condition (OR)</label></div>` : ''}${filters || '<p class="hint">No filters: every record is included.</p>'}<button class="btn small" data-act="filterAdd">+ Add a filter</button>`)}
        ${step(5, 'Sorting & Ranking', `<div class="row"><div class="grow"><label for="rkby">Rank by</label><select id="rkby" data-chg="rkBy">${options(metricOpts, rk.by, 'No ranking (natural order)')}</select></div>
          <div class="grow"><label for="rkdir">Direction</label><select id="rkdir" data-chg="rkDir">${options([['desc', 'Highest to lowest'], ['asc', 'Lowest to highest']], rk.direction)}</select></div>
          <div class="grow"><label for="rkm">Tie handling</label><select id="rkm" data-chg="rkMethod">${options([['competition', 'Competition (1, 2, 2, 4)'], ['dense', 'Dense (1, 2, 2, 3)']], rk.method)}</select></div>
          <div class="grow"><label for="rkl">Show</label><select id="rkl" data-chg="rkLimit">${options([['all', 'All rows'], ['top', 'Top N'], ['bottom', 'Bottom N']], rk.limit.mode)}</select></div>
          ${rk.limit.mode !== 'all' ? `<div><label for="rkn">N</label><input id="rkn" type="number" min="1" value="${rk.limit.n}" data-chg="rkN" style="width:80px"></div>` : ''}</div>`)}
        ${step(6, 'Generate & Save', `<div id="checks">${checksHtml()}</div><div class="row"><button class="btn primary" data-act="generate">Generate Report</button><button class="btn" data-act="exportDef">Save Recipe File</button><button class="btn" data-act="importDef">Load Recipe File…</button></div>`)}`;
      }

      function visibleCols(res) {
        return res.columns.map((c, i) => ({ c, i })).filter(({ c }) => !state.table.hidden.has(c.id));
      }

      function tableRows(res) {
        const t = state.table;
        let rows = res.rows.map((r, i) => ({ r, i }));
        const q = t.search.trim().toLowerCase();
        if (q) rows = rows.filter(({ r }) => r.some((v, k) => String(v === null ? '' : res.columns[k].kind === 'calc' ? C.formatValue(v, res.columns[k].format) : v).toLowerCase().includes(q)));
        if (t.sortId) {
          const k = res.columns.findIndex((c) => c.id === t.sortId);
          rows.sort((a, b) => {
            const x = a.r[k];
            const y = b.r[k];
            if (x === null || x === '') return y === null || y === '' ? 0 : 1;
            if (y === null || y === '') return -1;
            return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'en', { numeric: true })) * t.sortDir;
          });
        }
        return rows;
      }

      function viewReports() {
        if (state.t2) return viewT2Report();
        const res = state.result;
        if (!res) {
          return `<h1>4. View Results</h1>
            <div class="card empty-state">
              <p>No report has been generated yet.</p>
              <button class="btn primary" data-act="startGuided">Build a Report</button>
              <button class="btn" data-act="goTemplates">Choose a Recipe</button>
            </div>`;
        }

        const t = state.table;
        const rows = tableRows(res);
        const size = t.pageSize ?? 25;
        const pages = Math.max(1, Math.ceil(rows.length / size));
        t.page = Math.min(t.page, pages - 1);
        const slice = rows.slice(t.page * size, t.page * size + size);
        const vis = visibleCols(res);
        const kpis = res.kpis.filter((k) => !state.hiddenKpis.has(k.id));
        const narratives = C.narrateReport(res);

        const head = vis.map(({ c }) => `<th class="sortable ${c.kind === 'calc' || c.kind === 'rank' ? 'num' : ''}" data-act="sort" data-id="${esc(c.id)}">${esc(c.label)}${t.sortId === c.id ? (t.sortDir === 1 ? ' ▲' : ' ▼') : ''}</th>`).join('');
        const cell = (v, c) => {
          if (v === null || v === undefined || v === '') return '<td class="empty num">—</td>';
          if (c.kind === 'group') return `<td title="${esc(v)}">${esc(v)}</td>`;
          return `<td class="num">${esc(c.kind === 'rank' ? v : C.formatValue(v, c.format))}</td>`;
        };
        const body = slice.map(({ r }) => `<tr>${vis.map(({ c, i }) => cell(r[i], c)).join('')}</tr>`).join('');
        const totalRow = res.totals && !t.search ? `<tr class="total">${vis.map(({ c, i }) => (c.kind === 'group' || c.kind === 'rank' ? `<td>${esc(res.totals[i] ?? '')}</td>` : cell(res.totals[i], c))).join('')}</tr>` : '';
        const m = res.meta;

        const methodologyHtml = res.definition.calculations
          .map((c) => `<li><b>${esc(c.name)}:</b> ${esc(C.explainCalculation(state.ds, c, res.definition.calculations))}</li>`)
          .join('');

        return `<div class="row noprint" style="justify-content:space-between">
          <div>
            <h1>${esc(m.name)}</h1>
            <p class="sub">${esc(m.source)} · ${fmtInt(m.filteredRows)} of ${fmtInt(m.inputRows)} records ${state.ds?.isSample ? '<span class="tag sample">SAMPLE DATA</span>' : ''}</p>
          </div>
          <div class="row">
            <button class="btn" data-act="goBuilder">Edit Report</button>
            <button class="btn primary" data-act="export">Download Excel (.xlsx)</button>
            <button class="btn" data-act="print">Print</button>
          </div>
        </div>

        ${res.warnings.length ? `<details ${res.warnings.length <= 2 ? 'open' : ''} class="card"><summary>${res.warnings.length} note(s) about data values in this report</summary><div style="margin-top:10px">${res.warnings.map((w) => noteHtml(w)).join('')}</div></details>` : ''}

        <div class="card">
          <h2>Understanding Your Results</h2>
          <div class="narrative-grid">
            ${narratives.map((n) => `<div class="narrative-item"><strong>${esc(n.title)}</strong><p>${esc(n.text)}</p></div>`).join('')}
          </div>
          <details class="how-details" style="margin-top:10px">
            <summary>How were these numbers calculated?</summary>
            <ul class="method-list">${methodologyHtml}</ul>
          </details>
        </div>

        <div class="grid g4" style="margin-bottom:14px">
          ${kpis.map((k) => `<div class="stat kpi"><div class="l">${esc(k.label)}</div><div class="n">${esc(k.value === null || k.value === undefined ? '—' : C.formatValue(k.value, k.format))}</div>${k.note ? `<div class="nt">${esc(k.note)}</div>` : ''}</div>`).join('')}
        </div>

        ${chartCard(res)}

        <div class="card">
          <div class="row noprint" style="margin-bottom:8px">
            <div class="grow"><label for="tsearch">Search results</label><input id="tsearch" type="text" value="${esc(t.search)}" placeholder="Type to filter rows…" data-chg="tSearch" data-live="1"></div>
            <div><label for="tps">Rows per page</label><select id="tps" data-chg="tSize" style="width:auto">${options([10, 25, 50, 100].map((n) => [n, n]), size)}</select></div>
          </div>
          <details class="noprint" style="margin-bottom:8px"><summary>Show / hide columns</summary><div class="pill-list" style="margin-top:8px">${res.columns.map((c) => `<label class="chk"><input type="checkbox" data-chg="colToggle" data-id="${esc(c.id)}" ${t.hidden.has(c.id) ? '' : 'checked'}> ${esc(c.label)}</label>`).join('')}</div></details>
          <div class="tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${vis.length}" class="empty">No matching rows.</td></tr>`}${totalRow}</tbody></table></div>
          <div class="pager noprint"><button class="btn small" data-act="page" data-d="-1" ${t.page === 0 ? 'disabled' : ''}>◀ Previous</button><span>Page ${t.page + 1} of ${pages} · ${fmtInt(rows.length)} row(s)</span><button class="btn small" data-act="page" data-d="1" ${t.page >= pages - 1 ? 'disabled' : ''}>Next ▶</button></div>
        </div>

        <div class="card noprint">
          <h2>Export to Excel Workbook</h2>
          <div class="row">
            <label class="chk"><input type="checkbox" data-chg="expSource" ${state.exportOpts.includeSource ? 'checked' : ''}> Include original CSV rows as a "Source Data" tab</label>
            <div><label for="expmode">Cell format</label><select id="expmode" data-chg="expMode" style="width:auto">${options([['static', 'Static values (recommended)'], ['formula', 'Formulas where mathematically safe']], state.exportOpts.mode)}</select></div>
            <button class="btn primary" data-act="export">Download .xlsx</button>
          </div>
        </div>`;
      }

      function chartCard(res) {
        const calcCols = res.columns.filter((c) => c.kind === 'calc');
        if (!calcCols.length || !res.rows.length) return '';
        const hasGroups = res.meta.groupBy.length > 0;
        const typeItems = [['bar', 'Vertical Bar'], ['hbar', 'Horizontal Bar'], ['pie', 'Pie'], ['donut', 'Donut'], ['line', 'Trend Line']];
        const cards = state.visuals.map((v, i) => {
          const rv = C.resolveVisual(res, v);
          const metricItems = rv.missing ? [['', '— choose a metric —'], ...calcCols.map((c) => [c.id, c.label])] : calcCols.map((c) => [c.id, c.label]);
          const body = rv.missing
            ? `<p class="hint">The metric "${esc(v.metric)}" is not part of this report any more.\nChoose another metric above, or remove this visual.</p>`
            : hasGroups ? drawChart(res, v.type, rv.metric) : '<p class="hint">Organize your report by a group (such as Agent, Team, or Month) to display a chart.</p>';
          return `<div class="card" data-visual="${esc(v.id)}">
          <div class="row noprint">
            <h2 style="margin:0 auto 0 0">Visual ${i + 1}</h2>
            <div><label for="ctype-${esc(v.id)}">Chart style</label><select id="ctype-${esc(v.id)}" data-chg="visType" data-vid="${esc(v.id)}" style="width:auto">${options(typeItems, v.type)}</select></div>
            <div><label for="cmet-${esc(v.id)}">Metric shown</label><select id="cmet-${esc(v.id)}" data-chg="visMetric" data-vid="${esc(v.id)}" style="width:auto">${options(metricItems, rv.missing ? '' : rv.metric)}</select></div>
            <button class="btn" data-act="removeVisual" data-vid="${esc(v.id)}">Remove visual</button>
          </div>
          <div class="chartbox">${body}</div>
        </div>`;
        }).join('');
        const empty = state.visuals.length ? '' : '<div class="card"><p class="hint">No visuals selected. Use "Add visual" to show a metric as a chart.</p></div>';
        return `${cards}${empty}<div class="row noprint" style="margin-bottom:14px"><button class="btn" data-act="addVisual">+ Add visual</button></div>`;
      }

      function drawChart(res, type, metricId) {
        const mi = res.columns.findIndex((c) => c.id === metricId);
        const mcol = res.columns[mi];
        const gi = res.columns.map((c, i) => (c.kind === 'group' ? i : -1)).filter((i) => i >= 0);
        let pts = res.rows.map((r) => ({ label: gi.map((i) => r[i]).join(' / '), v: r[mi] })).filter((p) => p.v !== null && p.v !== undefined && Number.isFinite(p.v));
        if (!pts.length) return '<p class="hint">No numeric values available to chart.</p>';
        let note = '';
        const MAXP = type === 'pie' || type === 'donut' ? 12 : 40;
        if (pts.length > MAXP) {
          note = `Showing the first ${MAXP} of ${pts.length} groups.`;
          pts = pts.slice(0, MAXP);
        }
        const fmt = (v) => C.formatValue(v, mcol.format);
        const short = (s, n) => (s.length > n ? `${s.slice(0, n - 1)}…` : s);
        const W = 760;
        const noteHtml2 = note ? `<p class="hint">${esc(note)}</p>` : '';

        if (type === 'pie' || type === 'donut') {
          const use = pts.filter((p) => p.v > 0);
          const total = use.reduce((s, p) => s + p.v, 0);
          if (!use.length) return '<p class="hint">Pie charts require positive values.</p>';
          const cx = 160, cy = 150, R = 130, r0 = type === 'donut' ? 70 : 0;
          let a = -Math.PI / 2;
          const slices = use.map((p, i) => {
            const frac = p.v / total;
            const a2 = a + frac * 2 * Math.PI;
            const large = frac > 0.5 ? 1 : 0;
            const pt = (ang, rad) => `${(cx + rad * Math.cos(ang)).toFixed(2)},${(cy + rad * Math.sin(ang)).toFixed(2)}`;
            const full = frac > 0.9999;
            const dpath = full
              ? `M${cx - R},${cy} A${R},${R} 0 1 1 ${cx + R},${cy} A${R},${R} 0 1 1 ${cx - R},${cy}${r0 ? ` M${cx - r0},${cy} A${r0},${r0} 0 1 0 ${cx + r0},${cy} A${r0},${r0} 0 1 0 ${cx - r0},${cy}` : ''}Z`
              : `M${pt(a, R)} A${R},${R} 0 ${large} 1 ${pt(a2, R)} ${r0 ? `L${pt(a2, r0)} A${r0},${r0} 0 ${large} 0 ${pt(a, r0)}` : `L${cx},${cy}`} Z`;
            a = a2;
            return `<path d="${dpath}" fill="${COLORS[i % COLORS.length]}" fill-rule="evenodd" stroke="#17191D" stroke-width="1"><title>${esc(p.label)}: ${esc(fmt(p.v))}</title></path>`;
          });
          const legend = use.map((p, i) => `<g transform="translate(340,${24 + i * 22})"><rect width="12" height="12" y="-10" rx="2" fill="${COLORS[i % COLORS.length]}"/><text x="18" y="0" font-size="13" fill="#17191D">${esc(short(p.label, 30))} — ${esc(fmt(p.v))} (${((p.v / total) * 100).toFixed(1)}%)</text></g>`).join('');
          return `<svg viewBox="0 0 ${W} ${Math.max(300, 40 + use.length * 22)}" role="img">${slices.join('')}${legend}</svg>` + noteHtml2;
        }

        const maxV = Math.max(0, ...pts.map((p) => p.v));
        const minV = Math.min(0, ...pts.map((p) => p.v));
        const span = maxV - minV || 1;
        const raw = span / 5;
        const pow = 10 ** Math.floor(Math.log10(raw));
        const f = raw / pow;
        const niceStep = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * pow;
        const top = Math.ceil(maxV / niceStep) * niceStep;
        const bot = Math.floor(minV / niceStep) * niceStep;
        const ticks = [];
        for (let t = bot; t <= top + niceStep / 2; t += niceStep) ticks.push(t);

        if (type === 'hbar') {
          const rowH = 26, L = 190, H = 30 + pts.length * rowH + 30;
          const x = (v) => L + ((v - bot) / (top - bot || 1)) * (W - L - 60);
          return `<svg viewBox="0 0 ${W} ${H}" role="img">${ticks.map((t) => `<line x1="${x(t)}" x2="${x(t)}" y1="10" y2="${H - 28}" stroke="#E2DECF"/><text x="${x(t)}" y="${H - 12}" font-size="11" text-anchor="middle" fill="#4C505B">${esc(fmt(t))}</text>`).join('')}
          ${pts.map((p, i) => `<text x="${L - 8}" y="${20 + i * rowH + 14}" font-size="12" text-anchor="end" fill="#17191D">${esc(short(p.label, 26))}</text><rect x="${Math.min(x(0), x(p.v))}" y="${20 + i * rowH}" width="${Math.abs(x(p.v) - x(0))}" height="${rowH - 8}" fill="${COLORS[0]}" stroke="#17191D" stroke-width="1.25" rx="2"><title>${esc(p.label)}: ${esc(fmt(p.v))}</title></rect><text x="${x(p.v) + (p.v >= 0 ? 5 : -5)}" y="${20 + i * rowH + 13}" font-size="11" text-anchor="${p.v >= 0 ? 'start' : 'end'}" fill="#17191D">${esc(fmt(p.v))}</text>`).join('')}</svg>` + noteHtml2;
        }

        const H = 340, L = 64, B = 90, T = 16;
        const plotW = Math.max(W, L + pts.length * 40 + 20);
        const y = (v) => T + (1 - (v - bot) / (top - bot || 1)) * (H - T - B);
        const bw = (plotW - L - 20) / pts.length;
        const grid = ticks.map((t) => `<line x1="${L}" x2="${plotW - 10}" y1="${y(t)}" y2="${y(t)}" stroke="#E2DECF"/><text x="${L - 6}" y="${y(t) + 4}" font-size="11" text-anchor="end" fill="#4C505B">${esc(fmt(t))}</text>`).join('');
        const labels = pts.map((p, i) => `<text transform="translate(${L + bw * i + bw / 2},${H - B + 12}) rotate(-40)" font-size="11" text-anchor="end" fill="#17191D">${esc(short(p.label, 22))}</text>`).join('');

        if (type === 'line') {
          const px = (i) => L + bw * i + bw / 2;
          const path = pts.map((p, i) => `${i ? 'L' : 'M'}${px(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
          return `<svg viewBox="0 0 ${plotW} ${H}" width="${plotW}" role="img">${grid}<path d="${path}" fill="none" stroke="#17191D" stroke-width="2.25" stroke-linejoin="round"/>${pts.map((p, i) => `<circle cx="${px(i)}" cy="${y(p.v)}" r="5" fill="${COLORS[0]}" stroke="#17191D" stroke-width="1.75"><title>${esc(p.label)}: ${esc(fmt(p.v))}</title></circle>`).join('')}${labels}</svg>` + noteHtml2;
        }
        return `<svg viewBox="0 0 ${plotW} ${H}" width="${plotW}" role="img">${grid}${pts.map((p, i) => `<rect x="${L + bw * i + bw * 0.15}" y="${Math.min(y(p.v), y(0))}" width="${bw * 0.7}" height="${Math.abs(y(p.v) - y(0))}" fill="${COLORS[0]}" stroke="#17191D" stroke-width="1.25" rx="2"><title>${esc(p.label)}: ${esc(fmt(p.v))}</title></rect>`).join('')}<line x1="${L}" x2="${plotW - 10}" y1="${y(0)}" y2="${y(0)}" stroke="#4C505B"/>${labels}</svg>` + noteHtml2;
      }

      function viewT2Report() {
        const t2 = state.t2;
        const styleId = state.t2Style || 'executive';
        const st = C.T2_STYLES[styleId];
        const warnings = [];
        const seenW = new Set();
        for (const res of Object.values(t2.results)) {
          for (const w of res?.warnings ?? []) {
            const k = w.title + '|' + w.message;
            if (!seenW.has(k)) { seenW.add(k); warnings.push(w); }
          }
        }
        const stylesBar = Object.entries(C.T2_STYLES)
          .map(([k, s]) => `<button class="btn small ${styleId === k ? 'primary' : ''}" data-act="t2StyleSet" data-k="${k}" title="${esc(s.desc)}">${esc(s.label)}</button>`).join('');
        return `<div class="row noprint" style="justify-content:space-between;align-items:flex-start">
            <div>
              <h1 style="margin:0">${esc(t2.recipe.name)}</h1>
              <p class="sub" style="margin:2px 0 0">${esc(t2.dsName)} · Presentation-ready report ${state.ds?.isSample ? '<span class="tag sample">SAMPLE DATA</span>' : ''}</p>
            </div>
            <div class="row">
              <button class="btn" data-act="t2Edit">Edit Setup</button>
              <button class="btn primary" data-act="export">Download Excel (.xlsx)</button>
              <button class="btn" data-act="print">Print / Save PDF</button>
            </div>
          </div>
          <div class="row noprint" style="margin:10px 0 14px">
            <span class="hint" style="align-self:center">Presentation style:</span>${stylesBar}
          </div>
          ${warnings.length ? `<details ${warnings.length <= 2 ? 'open' : ''} class="card noprint"><summary>${warnings.length} note(s) about the data behind this report</summary><div style="margin-top:10px">${warnings.map((w) => noteHtml(w)).join('')}</div></details>` : ''}
          <div class="t2-report ${st.print ? 't2-print' : ''}">${C.t2Render(t2, styleId, { chart: state.t2chart, sort: state.t2sort })}</div>
          <div class="card noprint" style="margin-top:14px">
            <h2>Spreadsheet-native report export</h2>
            <div class="row">
              <label class="chk"><input type="checkbox" data-chg="expSource" ${state.exportOpts.includeSource ? 'checked' : ''}> Include original CSV rows as a "Source Data" tab</label>
              <button class="btn primary" data-act="export">Download presentation-ready .xlsx</button>
            </div>
            <p class="hint" style="margin-top:8px">The same report model drives this web view and the workbook. Excel exports use formatted KPI cards, editable native charts, filtered table ranges, a condensed Summary sheet, and the optional original Source Data sheet.</p>
          </div>
          <div class="card noprint">
            <h2>Google Sheets compatibility</h2>
            <div class="note info"><b>Stage A · XLSX import</b>Import the downloaded workbook into Google Sheets. The file uses standard worksheet cells, merged ranges, number formats, filtered table ranges, and embedded column/bar, pie, doughnut, and line chart objects. Google Sheets may normalize some Excel-specific chart styling, trendline formatting, table styles, or positioning during conversion; check the imported copy before presenting it. This offline build has no Google authorization, so a live Google Sheets import/conversion test remains an external acceptance check rather than a test performed by the workstation.</div>
            <details><summary>Stage B · Optional direct Google Sheets integration</summary>
              <p class="hint">The integration is deliberately separate from this offline workstation. A separately loaded adapter can consume the same report model, create a spreadsheet, write cell values, apply formatting and merged ranges, and add native charts through the official Google Sheets API. The adapter contract is exposed as <code>C360.registerGoogleSheetsAdapter</code>; no Google authorization, credentials, API request, or network connection is required for CSV processing or XLSX export.</p>
              <p class="hint">Implementation sequence: create a spreadsheet with <code>spreadsheets.create</code>; write values using <code>spreadsheets.values.batchUpdate</code>; then send formatting, merge, frozen-row, filter, and chart requests in <code>spreadsheets.batchUpdate</code>. Use a separate OAuth client and the narrowest suitable scope such as <code>drive.file</code> or the Sheets scope. Batch related changes together so a failed request does not leave a half-built report.</p>
              <p class="hint"><a href="https://developers.google.com/workspace/sheets/api/reference/rest/v4/spreadsheets/create" target="_blank" rel="noopener">Spreadsheet create API</a> · <a href="https://developers.google.com/workspace/sheets/api/reference/rest/v4/spreadsheets/values/batchUpdate" target="_blank" rel="noopener">Values batch update</a> · <a href="https://developers.google.com/workspace/sheets/api/guides/batchupdate" target="_blank" rel="noopener">Formatting, merges and charts</a></p>
            </details>
          </div>`;
      }

      function t2DoGenerate() {
        const wiz = state.t2wiz;
        const ds = state.ds;
        const recipe = C.T2_RECIPES[wiz.recipeId];
        const optRole = recipe.roles.find((r) => !r.required && r.accepts === 'text' && wiz.mapping[r.key] && C.resolveColumn(ds, wiz.mapping[r.key]));
        let t2;
        try {
          t2 = C.t2RunAll(ds, wiz.recipeId, wiz.mapping, {
            dateFrom: wiz.dateFrom.trim(), dateTo: wiz.dateTo.trim(),
            restrictRole: optRole?.key, restrictValue: wiz.restrictValue || '',
            csatThreshold: (wiz.csatThreshold || '').trim(),
            absentStatuses: (wiz.absentStatuses || '').trim(),
          });
        } catch (e) {
          flash('error', 'Could not build the report', e.message);
          return render();
        }
        t2._facts = null;
        const primary = t2.results[C.T2_PRIMARY];
        if (!primary.ok) {
          flash('error', 'The report could not be calculated', primary.errors.map((e) => `${e.title}: ${e.message}`).join('\n'));
          return render();
        }
        state.t2 = t2;
        state.t2Style = wiz.style || 'executive';
        state.t2chart = {};
        state.t2sort = {};
        state.result = primary;
        state.flash = null;
        if (!ds.isSample) saveRecent();
        go('reports');
      }

      function viewSettings() {
        const testHtml = state.testReport
          ? `<div style="margin-top:12px">
              <div class="note ${state.testReport.passed === state.testReport.total ? 'ok' : 'error'}">
                <b>Self-Test Results: ${state.testReport.passed} / ${state.testReport.total} passed</b>
                ${state.testReport.results.map((r) => `${r.ok ? '✓' : '✗'} ${r.name}${r.error ? ` — ${r.error}` : ''}`).join('\n')}
              </div>
            </div>`
          : '';

        return `<h1>Settings</h1><p class="sub">Preferences, browser storage, and built-in engine diagnostics.</p>
        <div class="card"><h2>Experience Preferences</h2><div class="row">
          <div><label for="defmode">Default report builder mode</label><select id="defmode" data-chg="prefMode" style="width:auto">${options([['guided', 'Guided Step-by-Step (Recommended)'], ['advanced', 'Advanced Controls']], state.prefs.defaultBuilderMode)}</select></div>
          <div><label for="ps">Default table page size</label><select id="ps" data-chg="prefPageSize" style="width:auto">${options([10, 25, 50, 100].map((n) => [n, n]), state.prefs.pageSize)}</select></div>
          <label class="chk"><input type="checkbox" data-chg="prefSource" ${state.prefs.includeSourceDefault ? 'checked' : ''}> Include "Source Data" tab in Excel exports by default</label>
        </div></div>
        <div class="card"><h2>Local Storage</h2><p class="hint">All settings and saved report recipes live strictly inside your browser. Your uploaded CSV data is never persisted to disk or sent over the network.</p>
        <table><tbody><tr><td>Saved report configurations</td><td>${state.recents.length}</td></tr><tr><td>Remembered column mappings</td><td>${Object.keys(state.mappings).length}</td></tr><tr><td>Recent dataset names</td><td>${state.datasetsSeen.length}</td></tr></tbody></table>
        <button class="btn danger" style="margin-top:10px" data-act="clearAll">Clear All Local Data</button></div>
        <div class="card"><h2>Calculation Engine & Guidance Diagnostics</h2><p class="hint">Verify weighted calculations, leading-zero preservation, template adaptation, guided builder translation, and Excel workbook generation.</p>
        <button class="btn" data-act="runTests">Run Built-In Verification Suite</button>
        ${testHtml}</div>`;
      }

      function render() {
        const main = $('#main');
        const views = { dashboard: viewDashboard, data: viewData, templates: viewTemplates, builder: viewBuilder, reports: viewReports, settings: viewSettings };
        let html;
        try {
          html = views[state.view]();
        } catch (e) {
          console.error(e);
          html = `<div class="note error"><b>Something went wrong displaying this screen</b>${esc(e.message)}</div>`;
        }
        const f = state.flash;
        main.innerHTML = (f ? `<div class="note ${f.kind}" role="status"><b>${esc(f.title)}</b>${esc(f.message)}</div>` : '') + html;
        $('#nav').innerHTML = `<div class="brand">${brandLogo(30)}<small>Data workstation</small></div>${NAV.map(([k, l]) => `<button class="${state.view === k ? 'on' : ''}" data-act="nav" data-k="${k}" title="${esc(l)}"${state.view === k ? ' aria-current="page"' : ''}><span class="ni">${icon(NAV_ICON[k] ?? 'list')}</span><span class="nl">${l}</span></button>`).join('')}<div class="grow"></div><div class="foot">${state.ds ? `<b>${esc(state.ds.filename)}</b><br>${fmtInt(state.ds.rows.length)} records` : 'No CSV loaded'}<br>100% local · offline ready</div>`;
        if (!$('#foot').firstChild) $('#foot').innerHTML = footerHtml();
        const navEl = $('#nav'), navOn = $('#nav button.on');
        if (navOn && navEl.scrollWidth > navEl.clientWidth) navEl.scrollLeft = Math.max(0, navOn.offsetLeft - 70);
        wireDrop();
      }

      function wireDrop() {
        const drop = $('#drop');
        const input = $('#file');
        if (!drop || !input) return;
        input.onchange = () => {
          ingestFile(input.files[0]);
          input.value = '';
        };
        drop.onkeydown = (e) => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), input.click());
        ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => (e.preventDefault(), drop.classList.add('over'))));
        ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => (e.preventDefault(), drop.classList.remove('over'))));
        drop.addEventListener('drop', (e) => {
          const files = [...(e.dataTransfer?.files ?? [])];
          if (files.length > 1) flash('warn', 'One file at a time', `Using the first file (${files[0].name}).`);
          ingestFile(files[0]);
        });
      }

      function executeDefinition(def) {
        state.t2 = null; // Prevent a previous template report from being reused by the XLSX exporter.
        state.def = def;
        const res = C.runReport(state.ds, def);
        if (!res.ok) {
          flash('error', 'Please check your report settings', res.errors.map((e) => `${e.title}: ${e.message}`).join('\n'));
          state.result = null;
          return render();
        }
        state.result = res;
        state.table = { ...state.table, sortId: null, page: 0, search: '', hidden: new Set() };
        state.hiddenKpis = new Set();
        state.visuals = C.visualsFromDefinition(res.definition);
        state.flash = null;
        if (!state.ds.isSample) saveRecent();
        go('reports');
      }

      function saveRecent() {
        const def = JSON.parse(JSON.stringify(state.def));
        state.recents = [{ name: def.name, def, savedAt: Date.now() }, ...state.recents.filter((r) => r.name !== def.name)].slice(0, 10);
        persist.recents();
      }

      const downloadBlob = (bytes, name, type) => {
        const url = URL.createObjectURL(new Blob([bytes], { type }));
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      };
      const safeName = (s) => String(s).replace(/[^\w\-. ]+/g, '_').trim().slice(0, 60) || 'report';

      function exportXlsx() {
        try {
          let out;
          let filename;
          if (state.t2) {
            const model = C.buildReportModel(state.t2, state.t2Style || 'executive', { chart: state.t2chart, sort: state.t2sort });
            out = C.buildTemplateWorkbook(state.ds, state.t2, model, { includeSource: state.exportOpts.includeSource, generatedAt: new Date() });
            filename = `${safeName(model.meta.title)}.xlsx`;
            downloadBlob(out.bytes, filename, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
            flash('ok', 'Presentation-ready workbook downloaded', `${filename} · ${out.chartCount} native chart(s) · ${out.tableCount} formatted table(s).`);
          } else {
            out = C.buildReportWorkbook(state.ds, state.result, {
              includeSource: state.exportOpts.includeSource, mode: state.exportOpts.mode,
              visuals: state.visuals, generatedAt: new Date(),
            });
            filename = `${safeName(state.result.meta.name)}.xlsx`;
            downloadBlob(out.bytes, filename, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
            const skipped = out.skippedVisuals.length ? `\n${out.skippedVisuals.length} visual(s) were left out because their metric is not available or has no values to chart.` : '';
            flash('ok', 'Presentation-ready workbook downloaded', `${filename} · ${out.chartCount} chart(s) and formatted report table included.${skipped}`);
          }
        } catch (e) {
          console.error('Cubicle360 XLSX export', e);
          flash('error', 'Excel export failed', `${e.message}`);
        }
        render();
      }

      function setCalcType(c, type) {
        const m = C.CALC_TYPES[type];
        c.type = type;
        if (m.derived) {
          c.field = undefined;
          c.weightField = undefined;
          c.condition = null;
          if (type !== 'periodChange' && !c.b) c.b = { calc: '' };
        } else {
          c.a = undefined;
          c.b = undefined;
          if (m.field === 'none') c.field = undefined;
          if (!m.weight) c.weightField = undefined;
          if (m.condition === 'required' && !c.condition) c.condition = { field: '', op: '' };
        }
      }

      const A = {
        nav: (el) => go(el.dataset.k),
        goData: () => go('data'),
        goTemplates: () => go('templates'),
        goBuilder: () => go('builder'),
        startGuided: () => {
          state.builderMode = 'guided';
          go('builder');
        },
        openAdvanced: () => {
          state.builderMode = 'advanced';
          go('builder');
        },
        setBuilderMode: (el) => {
          if (el.dataset.m === 'advanced' && state.builderMode === 'guided') {
            state.def = C.buildGuidedDefinition(state.ds, state.guided);
          }
          state.builderMode = el.dataset.m;
          render();
        },
        pickTask: (el) => {
          const action = el.dataset.action;
