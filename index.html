          if (state.ds) {
            if (action === 'guided') {
              state.builderMode = 'guided';
              return go('builder');
            }
            if (action === 'template' && tpl) {
              selectTemplate(tpl);
              return go('templates');
            }
          } else {
            state.pendingTask = { action, templateId: tpl };
            if (action === 'template' && tpl) {
              selectTemplate(tpl);
              return go('templates');
            }
            flash('info', 'First, upload your CSV file', 'Once uploaded, we will take you straight into your chosen workflow.');
            return go('data');
          }
        },
        pickTemplate: (el) => {
          selectTemplate(el.dataset.tpl);
          render();
        },
        useTemplate: (el) => {
          selectTemplate(el.dataset.tpl);
          go('templates');
        },
        uploadForTemplate: (el) => {
          state.pendingTask = { action: 'template', templateId: el.dataset.tpl };
          go('data');
        },
        sampleForTemplate: (el) => {
          loadSample({ action: 'template', templateId: el.dataset.tpl });
        },
        rematchTemplate: () => {
          if (state.ds && state.activeTemplateId) {
            state.templateMapping = C.matchTemplate(state.ds, state.activeTemplateId).mapping;
            render();
          }
        },
        runTemplateNow: () => {
          const applied = C.applyTemplate(state.ds, state.activeTemplateId, state.templateMapping);
          if (!applied.ok) return flash('error', 'Missing columns', applied.message), render();
          state.notes = applied.notes;
          executeDefinition(applied.definition);
        },
        runTemplatePartial: () => {
          const applied = C.applyTemplate(state.ds, state.activeTemplateId, state.templateMapping, { allowPartial: true });
          state.notes = applied.notes;
          executeDefinition(applied.definition);
        },
        customizeTemplate: () => {
          const applied = C.applyTemplate(state.ds, state.activeTemplateId, state.templateMapping);
          if (!applied.ok) return flash('error', 'Missing columns', applied.message), render();
          state.def = applied.definition;
          state.notes = applied.notes;
          state.builderMode = 'advanced';
          go('builder');
        },
        generateGuided: () => {
          const def = C.buildGuidedDefinition(state.ds, state.guided);
          executeDefinition(def);
        },
        guidedToAdvanced: () => {
          state.def = C.buildGuidedDefinition(state.ds, state.guided);
          state.builderMode = 'advanced';
          render();
        },
        pick: () => $('#file').click(),
        sample: () => loadSample(),
        dsTab: (el) => {
          state.dsTab = el.dataset.k;
          render();
        },
        reparse: async () => {
          if (!state.raw) return;
          state.busy = 'Re-reading file…';
          render();
          await sleep();
          buildDatasetFromRaw();
          state.busy = null;
          render();
        },
        decide: (el) => {
          const q = C.inspectQuality(state.ds);
          const issue = q.issues.find((i) => i.id === el.dataset.id);
          if (issue) C.applyDecision(state.ds, issue, el.dataset.a);
          state.result = null;
          render();
        },
        undo: (el) => {
          C.undoDecision(state.ds, el.dataset.id);

          render();
        },
        groupAdd: () => {
          state.def.groupBy.push({ field: '' });
          render();
        },
        groupDel: (el) => {
          state.def.groupBy.splice(+el.dataset.i, 1);
          render();
        },
        calcAdd: () => {
          const id = C.uniqueId(state.def.calculations, 'calc');
          state.def.calculations.push({ id, name: `Metric ${state.def.calculations.length + 1}`, type: 'recordCount', format: { kind: 'auto' } });
          render();
        },
        calcDel: (el) => {
          const [gone] = state.def.calculations.splice(+el.dataset.i, 1);
          if (state.def.ranking.by === gone.id) state.def.ranking.by = null;
          render();
        },
        calcCondOn: (el) => {
          state.def.calculations[+el.dataset.i].condition = { field: '', op: '' };
          render();
        },
        calcCondOff: (el) => {
          state.def.calculations[+el.dataset.i].condition = null;
          render();
        },
        filterAdd: () => {
          state.def.filters.conditions.push({ field: '', op: '', value: '' });
          render();
        },
        filterDel: (el) => {
          state.def.filters.conditions.splice(+el.dataset.i, 1);
          render();
        },
        generate: () => executeDefinition(state.def),
        sort: (el) => {
          const t = state.table;
          if (t.sortId === el.dataset.id) t.sortDir *= -1;
          else {
            t.sortId = el.dataset.id;
            t.sortDir = 1;
          }
          render();
        },
        page: (el) => {
          state.table.page += +el.dataset.d;
          render();
        },
        export: () => exportXlsx(),
        showInfo: (el) => openInfo(el.dataset.k),
        closeInfo: () => $('#info').close(),
        addVisual: () => { if (state.result) { state.visuals = C.addVisual(state.visuals, state.result); render(); } },
        removeVisual: (el) => { state.visuals = C.removeVisual(state.visuals, el.dataset.vid); render(); },
        print: () => window.print(),
        exportDef: () => {
          const json = JSON.stringify({ app: 'Cubicle360', ...state.def }, null, 2);
          downloadBlob(json, `${safeName(state.def.name)}.c360.json`, 'application/json');
        },
        importDef: () => {
          const inp = document.createElement('input');
          inp.type = 'file';
          inp.accept = '.json,application/json';
          inp.onchange = async () => {
            try {
              const parsed = JSON.parse(await inp.files[0].text());
              const n = C.normalizeDefinition(parsed);
              if (!n.definition) throw new Error(n.errors.join('\n'));
              state.def = n.definition;
              state.builderMode = 'advanced';
              state.notes = ['Recipe loaded. Verify that its selected columns exist in your CSV.'];
              state.flash = null;
              if (state.ds) go('builder');
              else {
                state.pendingDefinition = n.definition;
                flash('info', 'Recipe loaded', 'Now upload the CSV file you want to run it on.');
                go('data');
              }
            } catch (e) {
              flash('error', 'Could not load recipe file', e.message);
              render();
            }
          };
          inp.click();
        },
        loadRecent: (el) => {
          const r = state.recents[+el.dataset.i];
          const n = C.normalizeDefinition(r.def);
          if (!n.definition) return;
          state.def = n.definition;
          state.builderMode = 'advanced';
          if (state.ds) go('builder');
          else {
            state.pendingDefinition = n.definition;
            flash('info', `"${r.name}" loaded`, 'Upload the CSV file you want to run it on.');
            go('data');
          }
        },
        delRecent: (el) => {
          state.recents.splice(+el.dataset.i, 1);
          persist.recents();
          render();
        },
        t2Pick: (el) => {
          selectTemplate(el.dataset.id);
          render();
        },
        t2Preview: (el) => {
          state.t2preview = state.t2preview === el.dataset.id ? null : el.dataset.id;
          render();
        },
        t2BackToLib: () => {
          state.t2wiz = null;
          state.t2preview = null;
          render();
        },
        t2Next: () => {
          if (state.t2wiz.step < 3) {
            state.t2wiz.step++;
            render();
          }
        },
        t2Back: () => {
          if (state.t2wiz.step > 1) {
            state.t2wiz.step--;
            render();
          } else {
            state.t2wiz = null;
            render();
          }
        },
        t2Auto: () => {
          if (state.ds && state.t2wiz) {
            state.t2wiz.mapping = C.t2Match(state.ds, C.T2_RECIPES[state.t2wiz.recipeId]).mapping;
            render();
          }
        },
        t2Upload: () => go('data'),
        t2Generate: () => t2DoGenerate(),
        t2Edit: () => {
          if (!state.t2) return;
          state.t2wiz = {
            step: 2, recipeId: state.t2.recipe.id, mapping: { ...state.t2.mapping },
            dateFrom: state.t2.opts.dateFrom || '', dateTo: state.t2.opts.dateTo || '',
            restrictValue: state.t2.opts.restrictValue || '', csatThreshold: state.t2.opts.csatThreshold || '', absentStatuses: state.t2.opts.absentStatuses || '', style: state.t2Style,
          };
          go('templates');
        },
        t2StyleSet: (el) => {
          state.t2Style = el.dataset.k;
          render();
        },
        t2sort: (el) => {
          const k = el.dataset.k;
          const cur = state.t2sort[k];

          render();

        gDateCol: (el) => { state.guided.dateFilterField = el.value; render(); },

        condField: (el) => {

        colToggle: (el) => { el.checked ? state.table.hidden.delete(el.dataset.id) : state.table.hidden.add(el.dataset.id); render(); },
        tSearch: (el) => {

        tSize: (el) => { state.table.pageSize = +el.value; state.table.page = 0; render(); },
        visType: (el) => { state.visuals = C.updateVisual(state.visuals, el.dataset.vid, { type: el.value }); render(); },

        t2q: (el) => {

          s?.focus();
          s?.setSelectionRange(s.value.length, s.value.length);
        },
        t2cat: (el) => { state.t2libCat = el.value; render(); },
        t2diff: (el) => { state.t2libDiff = el.value; render(); },
        t2Role: (el) => { state.t2wiz.mapping[el.dataset.k] = el.value || null; render(); },
        t2From: (el) => { state.t2wiz.dateFrom = el.value; },
        t2To: (el) => { state.t2wiz.dateTo = el.value; },
        t2Threshold: (el) => { state.t2wiz.csatThreshold = el.value; },
        t2Absent: (el) => { state.t2wiz.absentStatuses = el.value; },
        t2Restrict: (el) => { state.t2wiz.restrictValue = el.value; },
        t2StyleRadio: (el) => { state.t2wiz.style = el.value; render(); },
        t2search: (el) => {
          const tbl = document.getElementById(el.dataset.tbl);
          if (!tbl) return;
          const qv = el.value.trim().toLowerCase();
          tbl.querySelectorAll('tbody tr[data-s]').forEach((tr) => {
            tr.style.display = !qv || tr.dataset.s.includes(qv) ? '' : 'none';
          });
        },
        t2chartmet: (el) => { state.t2chart[el.dataset.k] = el.value; render(); },
        prefMode: (el) => { state.prefs.defaultBuilderMode = el.value; state.builderMode = el.value; persist.prefs(); },
        prefPageSize: (el) => { state.prefs.pageSize = +el.value; state.table.pageSize = +el.value; persist.prefs(); },
        prefSource: (el) => { state.prefs.includeSourceDefault = el.checked; state.exportOpts.includeSource = el.checked; persist.prefs(); },
      };

      $('#info').addEventListener('click', (e) => { if (e.target.id === 'info') e.target.close(); });
      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-act]');
        if (!el || el.disabled) return;
        const fn = A[el.dataset.act];
        if (fn) fn(el, e);
      });
      document.addEventListener('change', (e) => {
        const el = e.target.closest('[data-chg]');
        if (!el) return;
        try {
          CH[el.dataset.chg]?.(el, e);
          const box = $('#checks');
          if (box) box.innerHTML = checksHtml();
        } catch (err) {
          console.error(err);
          flash('error', 'Could not apply change', err.message);
          render();
        }
      });
      document.addEventListener('input', (e) => {
        const el = e.target.closest('[data-live]');
        if (el) CH[el.dataset.chg]?.(el, e);
      });
      window.addEventListener('dragover', (e) => e.preventDefault());
      window.addEventListener('drop', (e) => e.preventDefault());
      window.addEventListener('error', (e) => console.error(e.error ?? e.message));

      window.__C360 = { state, C, store };
      persist.load().catch(() => {}).finally(render);
    })();
  </script>
</body>
</html>
